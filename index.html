/* ============================================================
   5. SÉANCE EN COURS
   échauffement-prêt → échauffement → prêt → effort → saisie
   → récup → prêt … → terminé
   ============================================================ */
const Seance = {
  active:null, etat:'pret', iBloc:0, iSerie:1, repsSaisies:0, effortEcoule:0,
  progressions:[], aAnnoncer:[], annonces:[],

  demarrer(modele){
    const blocs=(modele.blocs||[]).filter(b=>DB.exercice(b.exerciceId));
    if(!blocs.length){ toast('Cette séance ne contient aucun exercice. Ajoute-lui des exercices depuis la bibliothèque.'); return; }
    this.active={
      id:uid(), modeleId:modele.id, nom:modele.nom,
      debut:new Date().toISOString(),
      blocs:blocs.map(b=>Object.assign({},b)), series:[]
    };
    this.iBloc=0; this.iSerie=1; this.progressions=[]; this.aAnnoncer=[];
    /* Proposition entretenue par le moteur, et réglages courants
       (écartement, hauteur, lestage) hérités du bloc puis de l'exercice. */
    this.active.blocs.forEach(b=>{
      const exo=DB.exercice(b.exerciceId);
      b.derniereSaisie = DB.proposition(exo,b);
      /* Le vécu prime sur le modèle : ce que tu as réellement soulevé
         la dernière fois, sinon le réglage de la séance, sinon celui
         de l'exercice. */
      b.reglagesRepris=false;
      ['ecartementCm','hauteurCm','lestageKg'].forEach(k=>{
        const vu=DB.maxPrecedent(b.exerciceId,k);
        if(vu!=null){ b[k]=vu; b.reglagesRepris=true; }
        else b[k]=DB.reglageBloc(exo,b,k);
      });
    });
    this._preparerSaisie(); Ecran.prendre(); ongletCourant='seance'; edition=null;
    this.annonces=[];
    this.etat='pret';
    this.persister(); rendre();
    Voix.dire(modele.nom+'. '+this._exo().nom+', série 1 sur '+this._bloc().nbSeries+
      ', viser '+this.repsSaisies+(this._exo().modeEffort==='temps'?' secondes.':' répétitions.'));
  },

  reprendre(){
    const s=Store.lire('seanceEnCours',null);
    if(!s||!s.active||!Array.isArray(s.active.blocs)) return false;
    const blocs=s.active.blocs.filter(b=>DB.exercice(b.exerciceId));
    if(!blocs.length){ Store.effacer('seanceEnCours'); return false; }
    s.active.blocs=blocs;
    const iBloc=Math.min(Math.max(0,s.iBloc|0),blocs.length-1);
    const iSerie=Math.min(Math.max(1,s.iSerie|0),blocs[iBloc].nbSeries);
    this.active=s.active; this.iBloc=iBloc; this.iSerie=iSerie; this.progressions=[];
    /* on ne relance jamais un chrono tout seul au chargement */
    this.etat = (s.etat==='recup-termine') ? 'recup-termine' : 'pret';
    this._preparerSaisie();
    return true;
  },
  persister(){
    if(!this.active){ Store.effacer('seanceEnCours'); return; }
    Store.ecrire('seanceEnCours',{active:this.active,iBloc:this.iBloc,iSerie:this.iSerie,etat:this.etat});
  },

  _bloc(){ return this.active.blocs[this.iBloc]; },
  _exo(){ const b=this._bloc(); return b?DB.exercice(b.exerciceId):null; },
  _blocSuivant(){ return this.active.blocs[this.iBloc+1]||null; },
  _preparerSaisie(){
    const b=this._bloc(), exo=this._exo();
    if(!b||!exo) return;
    if(b.ecartementCm===undefined) b.ecartementCm=exo.ecartementCm;
    if(b.hauteurCm===undefined) b.hauteurCm=exo.hauteurCm;
    if(b.lestageKg===undefined) b.lestageKg=exo.lestageKg||0;
    /* la saisie de la série précédente devient la proposition par défaut */
    this.repsSaisies = (b.derniereSaisie!=null) ? b.derniereSaisie : b.nbReps;
  },

  demarrerSerie(){
    const exo=this._exo(), b=this._bloc();
    this.etat='effort'; this.persister();
    Voix.gong();
    Chrono.lancer('effort', exo.modeEffort==='temps'?b.nbReps:null, {
      surFin:()=>{ this.effortEcoule=b.nbReps; this._versSaisie(); }
    });
    rendre();
  },
  terminerSerie(){ this.effortEcoule=Chrono.ecouleSec(); Chrono.arreter(); this._versSaisie(); },
  /* Fin de série et validation en un seul geste, avec la valeur
     proposée. Le compteur reste accessible par « Autre nombre ». */
  terminerEtValider(){
    this.effortEcoule=Chrono.ecouleSec(); Chrono.arreter();
    const exo=this._exo(), b=this._bloc();
    this.repsSaisies = exo.modeEffort==='temps'
      ? Math.round(this.effortEcoule)
      : ((b.derniereSaisie!=null) ? b.derniereSaisie : b.nbReps);
    this.validerSerie();
  },
  _versSaisie(){
    const exo=this._exo();
    this.etat='saisie';
    const b0=this._bloc();
    this.repsSaisies = exo.modeEffort==='temps'
      ? Math.round(this.effortEcoule)
      : ((b0.derniereSaisie!=null) ? b0.derniereSaisie : b0.nbReps);
    this.persister(); Voix.dire('Série terminée.'); rendre();
  },
  validerSerie(){
    const b=this._bloc();
    this.active.series.push({
      exerciceId:b.exerciceId, indexBloc:this.iBloc, numeroSerie:this.iSerie,
      repsObjectif:b.nbReps, repsRealisees:this.repsSaisies,
      ecartementCm:b.ecartementCm, hauteurCm:b.hauteurCm, lestageKg:b.lestageKg,
      effortSec:Math.round(this.effortEcoule), recupSec:0, ts:new Date().toISOString()
    });
    b.derniereSaisie=this.repsSaisies;
    const derniereSerie=this.iSerie>=b.nbSeries, dernierBloc=!this._blocSuivant();
    if(derniereSerie&&dernierBloc){ this._terminer(); return; }
    const recup = derniereSerie ? (b.recupFinSec||b.recupSerieSec) : b.recupSerieSec;
    this.etat='recup'; this.persister();
    Voix.dire((derniereSerie?'Exercice terminé. ':'')+'Récupération, '+direDuree(recup)+'.');
    Chrono.lancer('recup',recup,{ surFin:()=>this.recupTerminee() });
    rendre();
  },

  /* ce que sera la prochaine série, sans encore y aller */
  prochaine(){
    const b=this._bloc();
    if(this.iSerie<b.nbSeries){
      const exo=this._exo();
      return {iBloc:this.iBloc, iSerie:this.iSerie+1, nbSeries:b.nbSeries,
              exo:exo, nbReps:b.nbReps, memeExercice:true};
    }
    const suiv=this._blocSuivant();
    if(!suiv) return null;
    return {iBloc:this.iBloc+1, iSerie:1, nbSeries:suiv.nbSeries,
            exo:DB.exercice(suiv.exerciceId), nbReps:suiv.nbReps, memeExercice:false};
  },

  /* Correction 2 : à la fin du décompte, la série suivante part
     seule. On annonce d'abord, puis on lance après un court délai
     pour que la voix ait le temps de commencer. */
  recupTerminee(){
    const der=this.active.series[this.active.series.length-1];
    if(der) der.recupSec=Math.round(Chrono.cibleSec||0);
    Chrono.arreter();
    const p=this.prochaine();
    if(!p){ this._terminer(); return; }
    Voix.dire('Récupération terminée. '+p.exo.nom+', série '+p.iSerie+' sur '+p.nbSeries+
      '. Objectif '+direQuantite(p.exo,p.nbReps)+'.');
    if(DB.reglages.enchainementAuto === false){
      this.etat='recup-termine'; this.persister(); Voix.gong(); rendre(); return;
    }
    this._avancer(); this.etat='pret'; this.persister(); rendre();
    const cible=this.active.series.length;
    setTimeout(()=>{
      if(Seance.active && Seance.etat==='pret' && Seance.active.series.length===cible)
        Seance.demarrerSerie();
    }, 1500);
  },

  _avancer(){
    const b=this._bloc();
    if(this.iSerie>=b.nbSeries){ this.iBloc++; this.iSerie=1; } else this.iSerie++;
    this._preparerSaisie(); this.persister();
  },
  /* depuis l'écran « récupération terminée » : on avance ET on lance */
  avancerEtDemarrer(){ this._avancer(); this.demarrerSerie(); },

  /* On a lu les changements de la séance précédente : on commence. */
  commencerApresAnnonce(){
    this.annonces=[]; this.etat='pret'; this.persister(); rendre();
    Voix.dire(this.active.nom+'. '+this._exo().nom+', série 1 sur '+this._bloc().nbSeries+
      ', viser '+direQuantite(this._exo(),this.repsSaisies)+'.');
  },

  /* Abandonne les séries restantes de l'exercice courant et passe au
     suivant. Les séries déjà réalisées restent au journal. */
  passerExercice(){
    Chrono.arreter();
    if(!this._blocSuivant()){
      if(this.active.series.length) this._terminer();
      else { this.abandonner(); toast('Séance annulée.'); }
      return;
    }
    this.iBloc++; this.iSerie=1;
    this.etat='pret'; this._preparerSaisie(); this.persister();
    const exo=this._exo(), b=this._bloc();
    Voix.dire('Exercice suivant. '+exo.nom+', série 1 sur '+b.nbSeries+'.');
    rendre();
  },

  /* raccourci pendant la récup : on saute le reste du décompte */
  passerRecup(){
    const der=this.active.series[this.active.series.length-1];
    if(der) der.recupSec=Math.round(Chrono.ecouleSec());
    Chrono.arreter(); this._avancer();
    this.etat='pret'; this.persister();
    Voix.gong();
    const exo=this._exo(), nb=this._bloc();
    Voix.dire(exo.nom+', série '+this.iSerie+' sur '+nb.nbSeries+'.');
    rendre();
  },

  /* ------------------------------------------------------------
     Moteur de progression.

     Deux mécanismes distincts, à ne pas confondre :

     1. LA PROPOSITION. Ce que l'app propose au compteur la fois
        suivante. Si toutes les séries ont tenu la proposition, elle
        monte d'un cran ; sinon elle redescend au meilleur résultat
        du jour. 6 séries visées à 8, réalisées 8-8-8-6-5-3 : la
        proposition reste 8. Réalisées 8 partout : elle passe à 9.

     2. L'OBJECTIF. Il ne bouge que lorsque la séance est pleinement
        réussie — toutes les séries à l'objectif. Alors s'applique le
        paquet de progression : répétitions, écartement, hauteur,
        lestage. Ces changements sont annoncés en fin de séance, puis
        rappelés au démarrage de la suivante.
     ------------------------------------------------------------ */
  /* Plus de progression automatique : la fin de séance n'écrit plus
     que dans le journal. Les objectifs de l'exercice ne bougent que
     si Jérém les change lui-même. */
  _terminer(){
    Chrono.arreter(); Ecran.relacher();
    const a=this.active;
    a.fin=new Date().toISOString();
    a.dureeSec=Math.round((new Date(a.fin)-new Date(a.debut))/1000);
    DB.journal.push(a); DB.sauver('journal');
    const p=DB.planifiees.find(p=>p.modeleId===a.modeleId&&p.statut==='planifiee');
    if(p){ p.statut='realisee'; DB.sauver('planifiees'); }
    this.etat='termine'; Store.effacer('seanceEnCours');
    Voix.gong(); Voix.dire('Séance terminée. Bravo.'); rendre();
  },
  abandonner(){
    Chrono.arreter(); Ecran.relacher();
    this.active=null; this.etat='pret'; Store.effacer('seanceEnCours'); rendre();
  },
  ajusterReps(d){
    const exo=this._exo();
    const pas=pasSaisie(exo);
    this.repsSaisies=Math.max(0,this.repsSaisies+d*pas);
    /* le conteneur s'appelle .saisie-rangee depuis que l'objectif est
       passé à gauche ; si le nœud manque, on redessine plutôt que de
       laisser l'écran mentir sur la valeur réelle. */
    const n=document.querySelector('.saisie-rangee .val');
    if(!n){ rendre(); return; }
    n.textContent=valeurSaisieAffichee(exo,this.repsSaisies);
    const o=this._bloc().nbReps;
    n.className='val'+(this.repsSaisies<o?' sous-objectif':this.repsSaisies>o?' sur-objectif':'');
  },
  ajusterReglage(champ,d,noeud){
    const b=this._bloc();
    const v=Math.max(0,Math.round(((b[champ]==null?0:b[champ])+d)*10)/10);
    b[champ] = (champ==='lestageKg' && v===0) ? null : v;
    this.persister();
    if(noeud){ const n=noeud.parentNode.querySelector('.v');
      if(n) n.textContent = champ==='lestageKg'
        ? (b[champ]==null?'Poids du corps':b[champ]+' kg')
        : (b[champ]==null?'\u2014':b[champ]+' cm'); }
  },
  progression(){
    const total=this.active.blocs.reduce((n,b)=>n+b.nbSeries,0), faites=this.active.series.length;
    return {faites,total,pct: total?Math.round(faites/total*100):0};
  }
};

function rafraichirCadran(){
  const cadran=document.getElementById('cadran');

     qui permet de consulter un exercice sans perdre le chrono de vue. */
  const chip=document.getElementById('cadran-mini');
  if(chip){

  }

  if(m && m.textContent!==etat.mode) m.textContent=etat.mode;
  if(se && se.textContent!==etat.serie) se.textContent=etat.serie;
  if(a) a.style.strokeDashoffset=etat.arc;
}

/* source unique de vérité pour ce qu'affiche le cadran */
function etatCadran(){
  const C=552.9;
  if(!Seance.active) return {cls:'',mode:'',gros:'',sous:'',serie:'',arc:0};
  const b=Seance._bloc(), exo=Seance._exo();
  if(!b||!exo) return {cls:'',mode:'',gros:'',sous:'',serie:'',arc:0};
  const parTemps=exo.modeEffort==='temps';
  const serieEnCours='Série '+Seance.iSerie+' sur '+b.nbSeries;

  if(Seance.etat==='recup-termine'){
    const p=Seance.prochaine();
    return {cls:'recup', mode:'Récupération terminée', gros:'00',
      sous: p ? (p.memeExercice?'même exercice':'exercice suivant') : 'fin de séance',
      serie: p ? 'Série '+p.iSerie+' sur '+p.nbSeries : '', arc:C};
  }
  if(Seance.etat==='effort'){
    if(parTemps){
      const r=Chrono.restantSec()==null?b.nbReps:Chrono.restantSec();
      return {cls:'effort'+(r<=5?' alerte':''), mode:Chrono.enPause()?'Effort · en pause':'Effort',
        gros: b.nbReps>=60?mmss(r):Math.ceil(r), sous:'sur '+dureeLisible(b.nbReps),
        serie:serieEnCours, arc:C*(1-r/b.nbReps)};
    }
    return {cls:'effort', mode:Chrono.enPause()?'Effort · en pause':'Effort',
      gros:mmss(Chrono.ecouleSec()), sous:'objectif '+b.nbReps+' reps', serie:serieEnCours, arc:0};
  }
  if(Seance.etat==='recup'){
    const r=Chrono.restantSec()||0, cible=Chrono.cibleSec||1;
    return {cls:'recup'+(r<=5?' alerte':''), mode:Chrono.enPause()?'Récupération · en pause':'Récupération',
      gros:Math.ceil(r), sous:'sur '+cible+' s', serie:serieEnCours, arc:C*(1-r/cible)};
  }
  if(Seance.etat==='saisie')
    return {cls:'', mode:'Série terminée', gros:mmss(Seance.effortEcoule),
      sous:'temps sous tension', serie:serieEnCours, arc:0};
  return {cls:'', mode:'Série '+Seance.iSerie+' sur '+b.nbSeries,
    gros:parTemps?dureeLisible(b.nbReps):b.nbReps,
    sous:parTemps?'objectif à tenir':'répétitions à réaliser', serie:'', arc:0};
}

function cadranHTML(){

}

function rendre(){
  const enCours = ongletCourant==='seance' && Seance.active;
  const m = METAS[ongletCourant]||METAS.accueil;
  $('#glyphe').textContent = enCours?'\u{1F3CB}':m.glyphe;
  $('#eyebrow').textContent = enCours?'Entraînement':m.eyebrow;
  $('#titre').textContent = enCours?Seance.active.nom:m.titre;
  document.querySelectorAll('#barre button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.onglet===ongletCourant?'page':'false'));
  const v=$('#vue');
  try{
    let carte=false, html;
    if(dernierePanne) html=vuePanne();
    else if(detailSeanceId) html=vueDetailSeance();
    else if(ecranParams) html=vueParametres();
    else if(vueSpecialeHisto) html=vueHistorique();
    else if(planif) html=vuePlanificateur();
    else if(ongletCourant==='seance') html = Seance.active?vueSeanceEnCours():vueListeSeances();
    else if(ongletCourant==='biblio') html = edition?vueEditeur():vueBiblio();
    else if(ongletCourant==='accueil'){ html = vueAccueil(); carte=true; }
    else html=vuePlanif();
    /* La fiche se pose par-dessus, dans son propre conteneur : la vue
       dessous reste montée, donc le retour ne coûte rien et le cadran
       continue de tourner. */
    v.innerHTML = html;
    const sur=document.getElementById('surcouche');
    if(sur) sur.innerHTML = ficheModale?modaleFiche():(repartModale?modaleRepartition():'');
    if(carte) colorierCorps();
  }catch(err){
    noterPanneSansBoucle(err);
    ficheModale=null; repartModale=null;
    const sur=document.getElementById('surcouche'); if(sur) sur.innerHTML='';
    v.innerHTML=vuePanne();
  }
}

}

/* Part de chaque groupe musculaire dans les séries d'une séance.
   Renvoie une liste triée, du plus sollicité au moins sollicité. */
function repartitionSeance(m){
  const compte={}; let total=0;
  (m.blocs||[]).forEach(b=>{
    const e=DB.exercice(b.exerciceId);
    if(!e || e.categorie==='echauffement' || e.categorie==='etirement') return;
    total += b.nbSeries;
    (e.zone1||[]).forEach(g=>{ compte[g]=(compte[g]||0)+b.nbSeries; });
    (e.zone2||[]).forEach(g=>{ compte[g]=(compte[g]||0)+b.nbSeries*0.5; });
  });
  if(!total) return [];
  return Object.keys(compte)
    .map(g=>({g, pct:Math.round(compte[g]/total*100)}))
    .filter(x=>x.pct>=5)       /* le détail complet est dans la modale */
    .sort((a,b)=>b.pct-a.pct);
}
/* À quelle colonne appartient chaque groupe musculaire. */
const COL_HAUT = ['pectoraux','dos','epaules','triceps','biceps'];
const COL_BAS  = ['fessiers','quadriceps','ischios','mollets','hanche','abdo'];
/* Noms raccourcis : trois colonnes sur un écran de téléphone ne
   laissent pas la place à « Ischio-jambiers ». */
const GROUPES_COURTS = {abdo:'Gainage', ischios:'Ischios', quadriceps:'Quadriceps'};
const nomCourt = g => GROUPES_COURTS[g] || GROUPES[g];

/* Part de chaque grande famille dans le total des séries. Les trois
   font 100 %. */
function partsFamilles(m){
  let prep=0, haut=0, bas=0, total=0;
  (m.blocs||[]).forEach(b=>{
    const e=DB.exercice(b.exerciceId); if(!e) return;
    total+=b.nbSeries;
    if(e.categorie==='echauffement'||e.categorie==='etirement'||e.categorie==='course') prep+=b.nbSeries;
    else if(e.categorie==='haut') haut+=b.nbSeries;
    else bas+=b.nbSeries;
  });
  if(!total) return null;
  /* Les arrondis séparés donnaient 99 % ou 101 % : on arrondit les
     deux premières familles et la troisième prend le reste, pour que
     les trois colonnes affichent toujours exactement 100 %. */
  const a=Math.round(prep/total*100), b=Math.round(haut/total*100);
  return {prep:a, haut:b, bas:100-a-b};
}

/* Y a-t-il de l'échauffement, des étirements dans cette séance ? */
function preparationSeance(m){
  const out={chauffe:false, etire:false};
  (m.blocs||[]).forEach(b=>{
    const e=DB.exercice(b.exerciceId); if(!e) return;
    if(e.categorie==='echauffement'||e.categorie==='course') out.chauffe=true;
    if(e.categorie==='etirement') out.etire=true;
  });
  return out;
}

/* Résumé d'une ligne, pour les vues qui n'ont pas la place de la
   grille : bibliothèque et planning. */
function resumeSeance(m){
  const f=partsFamilles(m);
  if(!f) return 'vide';
  const bouts=[];
  if(f.prep) bouts.push(f.prep+'\u2009% prépa.');
  if(f.haut) bouts.push(f.haut+'\u2009% haut');
  if(f.bas)  bouts.push(f.bas+'\u2009% bas');
  return bouts.join(' \u00B7 ');
}
function pastillesSeance(m){
  const r=repartitionSeance(m), f=partsFamilles(m);
  if(!f) return '<p class="aide" style="margin:8px 0 0">Aucun exercice — à compléter.</p>';
  const prep=preparationSeance(m);
  const colonne=(titre,pct,contenu)=>
    '<div class="col"><span class="tete">'+titre+'<b>'+pct+'\u2009%</b></span>'+contenu+'</div>';
  const badges=liste=>r.filter(x=>liste.indexOf(x.g)>=0).slice(0,5)
    .map(x=>'<span class="p"><b>'+x.pct+'\u2009%</b> '+nomCourt(x.g)+'</span>').join('');
  return '<div class="repart">'+
    colonne('Préparation', f.prep,
      (prep.chauffe?'<span class="p">Échauffement</span>':'')+
      (prep.etire?'<span class="p">Étirements</span>':'')+
      (!prep.chauffe&&!prep.etire?'<span class="p muet">\u2014</span>':''))+
    colonne('Haut', f.haut, badges(COL_HAUT)||'<span class="p muet">\u2014</span>')+
    colonne('Bas / gainage', f.bas, badges(COL_BAS)||'<span class="p muet">\u2014</span>')+
    '</div>';
}

/* --- page 3 : création / modification d'exercice --- */
/* Groupes d'origine d'un exercice du catalogue, pour le bouton
   « Par défaut ». Renvoie null pour un exercice créé à la main :
   il n'a pas de valeur d'origine à restaurer. */
function zonesDOrigine(id){
  if(!id) return null;
  const ref=exercicesParDefaut().filter(e=>e.id===id)[0];
  return ref ? {zone1:(ref.zone1||[]).slice(), zone2:(ref.zone2||[]).slice()} : null;
}

/* --- page 4 : création / modification de séance --- */
function editeurSeance(){
  const d=edition.data;
  const optExos=Object.keys(CAT_EXO).map(cat=>
    '<optgroup label="'+CAT_EXO[cat]+'">'+
    DB.exercices.filter(e=>e.categorie===cat).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'))
      .map(e=>'<option value="'+e.id+'">'+esc(e.nom)+'</option>').join('')+'</optgroup>').join('');

  /* Durée d'une série en deux molettes : minutes, puis secondes
     bornées à 59. On écrit toujours un total en secondes. */
  const dureeHTML=(i,total)=>{
    const m=Math.floor((total||0)/60), sec=(total||0)%60;
    const molette=(part,val,pas,suffixe)=>
      '<span class="pas">'+
      '<button data-duree="blocs.'+i+'.nbReps" data-part="'+part+'" data-pas="'+(-pas)+'">\u2212</button>'+
      '<span class="v" data-dpart="'+i+'-'+part+'">'+val+' '+suffixe+'</span>'+
      '<button data-duree="blocs.'+i+'.nbReps" data-part="'+part+'" data-pas="'+pas+'">+</button></span>';
    return '<div class="reglage" style="padding:8px 0"><span class="nom">Durée</span>'+molette('min',m,1,'min')+'</div>'+
           '<div class="reglage" style="padding:8px 0"><span class="nom"></span>'+molette('sec',sec,5,'s')+'</div>';
  };
  const blocs=(d.blocs||[]).map((b,i)=>{
    const exo=DB.exercice(b.exerciceId);
    if(!exo) return '';
    const pas=(champ,val,unite,step)=>
      '<div class="reglage" style="padding:8px 0"><span class="nom">'+champ.lib+'</span><span class="pas">'+
      '<button data-inc="blocs.'+i+'.'+champ.cle+'" data-pas="'+(-step)+'" data-min="'+(champ.min||0)+'" data-suffixe="'+unite+'">\u2212</button>'+
      '<span class="v">'+val+' '+unite+'</span>'+
      '<button data-inc="blocs.'+i+'.'+champ.cle+'" data-pas="'+step+'" data-min="'+(champ.min||0)+'" data-suffixe="'+unite+'">+</button></span></div>';
    return '<div class="bloc-exo"><div class="tete">'+pictoLien(exo,'mini')+'<b>'+esc(exo.nom)+'</b><div class="mini">'+
      (i>0?'<button data-bloc-monter="'+i+'" aria-label="Monter">\u2191</button>':'')+
      (i<d.blocs.length-1?'<button data-bloc-descendre="'+i+'" aria-label="Descendre">\u2193</button>':'')+
      '<button data-bloc-dupliquer="'+i+'" aria-label="Dupliquer">\u29C9</button>'+
      '<button data-bloc-suppr="'+i+'" aria-label="Supprimer" style="color:var(--effort)">\u00D7</button></div></div>'+
      pas({lib:'Nombre de séries',cle:'nbSeries',min:1},b.nbSeries,'','1'.length?1:1)+
      (exo.modeEffort==='temps' ? dureeHTML(i,b.nbReps)
        : pas({lib:'Répétitions',cle:'nbReps',min:1},b.nbReps,'reps',1))+
      pas({lib:'Récup. entre séries',cle:'recupSerieSec',min:0},b.recupSerieSec,'s',15)+
      pas({lib:'Récup. fin d’exercice',cle:'recupFinSec',min:0},b.recupFinSec,'s',15)+
      (function(){
        /* Mêmes réglages qu'à l'écran de séance : ce qui n'a pas de
           sens pour l'exercice ne s'affiche nulle part. */
        const u=reglagesUtiles(exo);
        return (u.indexOf('hauteurCm')<0?'':
          '<div class="reglage" style="padding:8px 0"><span class="nom">Hauteur</span><span class="pas">'+
          '<button data-inc="blocs.'+i+'.hauteurCm" data-pas="-1" data-min="0" data-suffixe="cm">\u2212</button>'+
          '<span class="v">'+(b.hauteurCm==null?'\u2014':b.hauteurCm+' cm')+'</span>'+
          '<button data-inc="blocs.'+i+'.hauteurCm" data-pas="1" data-min="0" data-suffixe="cm">+</button></span></div>')+
        (u.indexOf('lestageKg')<0?'':
          '<div class="reglage" style="padding:8px 0"><span class="nom">Lestage</span><span class="pas">'+
          '<button data-inc="blocs.'+i+'.lestageKg" data-pas="-0.5" data-min="0" data-suffixe="kg">\u2212</button>'+
          '<span class="v" style="min-width:96px">'+(b.lestageKg==null||b.lestageKg===0?'Poids du corps':b.lestageKg+' kg')+'</span>'+
          '<button data-inc="blocs.'+i+'.lestageKg" data-pas="0.5" data-min="0" data-suffixe="kg">+</button></span></div>');
      })()+
      '<div class="champ" style="margin:12px 0 0"><label>Point de départ</label>'+
      '<input data-champ="blocs.'+i+'.repsInitiales" data-num="1" type="number" inputmode="numeric" '+
      'placeholder="comme l’exercice ('+DB.repsDepart(exo,null).val+')" value="'+
      (b.repsInitiales==null?'':b.repsInitiales)+'">'+
      '<p class="aide">Ce qui sera proposé à la première série, avant toute réalisation.</p></div>'+
      (exo.conseilProgression
        ? '<p class="aide" style="margin-top:10px"><b>Conseil :</b> '+esc(exo.conseilProgression)+'</p>'
        : '')+
      '</div>';
  }).join('');

  const total=(d.blocs||[]).reduce((s,b)=>s+b.nbSeries,0);
  return '<p class="etiquette">'+(edition.nouveau?'Nouvelle séance':'Modifier la séance')+'</p>'+
    '<div class="carte">'+
    '<div class="champ" style="margin:0"><label>Nom</label>'+
    '<input data-champ="nom" value="'+esc(d.nom)+'" placeholder="Routine Haut"></div>'+
    '</div>'+
    '<p class="etiquette" style="margin-top:20px">Exercices'+
    (total?' \u00B7 '+d.blocs.length+' exercice'+(d.blocs.length>1?'s':'')+', '+total+' séries':'')+'</p>'+
    blocs+
    '<div class="carte" style="margin-bottom:10px"><label style="display:block;font-size:12.5px;font-weight:600;color:var(--texte-2);margin-bottom:6px">Ajouter un exercice</label>'+
    '<select id="choixExo"><option value="">Choisir…</option>'+optExos+'</select>'+
    '<button class="bouton discret" style="margin-top:10px" data-act="ajouter-bloc">+ Ajouter à la séance</button></div>'+
    '<div class="barre-form"><button class="bouton discret" data-act="annuler-edition">Annuler</button>'+
    '<button class="bouton principal" data-act="sauver-seance">Enregistrer</button></div>'+
    (edition.nouveau?'':'<button class="bouton danger" style="margin-top:8px" data-act="suppr-seance">Supprimer cette séance</button>');
}

/* ============================================================
   VUE : SÉANCE EN COURS
   ============================================================ */
function vueSeanceEnCours(){
  if(Seance.etat==='termine') return vueBilan();
  const a=Seance.active;

  /* Changements hérités de la dernière fois : on les montre avant
     de commencer, échauffement compris. */
  if(Seance.etat==='annonce'){
    return '<div style="text-align:center;padding:20px 0 14px"><div style="font-size:44px">\u2197</div>'+
      '<h2 style="font-weight:800;font-size:23px;letter-spacing:-.02em;margin:8px 0 2px">Ça progresse</h2>'+
      '<p style="color:var(--texte-2);margin:0;font-size:13.5px">'+
      'Voici ce qui a changé depuis ta dernière '+esc(a.nom)+'.</p></div>'+
      '<div class="carte" style="border-color:var(--accent)">'+
      Seance.annonces.map(t=>'<div class="delta"><span style="font-size:14.5px">'+esc(t)+'</span></div>').join('')+
      '</div>'+
      '<button class="bouton principal" style="margin-top:18px" data-act="commencer">Commencer la séance</button>';
  }

  const b=Seance._bloc(), exo=Seance._exo();
  if(!b||!exo){ Seance.abandonner(); return vueListeSeances(); }
  const prog=Seance.progression(), parTemps=exo.modeEffort==='temps';
  const unite=parTemps?'s':'reps';

  /* Correction 5 : « Exercice suivant » désigne bien l'exercice
     suivant, jamais la prochaine série de l'exercice en cours. */
  const bs=Seance._blocSuivant();
  const exoSuivant = bs ? (DB.exercice(bs.exerciceId)||{nom:'?'}) : null;
  const restantes = b.nbSeries - Seance.iSerie;
  const vignetteSuite = exoSuivant ? pictoLien(exoSuivant,'mini',true) : '';
  const ligneSuite = exoSuivant
    ? 'Exercice suivant : <b>'+esc(exoSuivant.nom)+'</b>'+
      (restantes>0 ? ' <span style="color:var(--texte-3)">— encore '+restantes+' série'+(restantes>1?'s':'')+' ici</span>' : '')
    : 'Dernier exercice de la séance'+
      (restantes>0 ? ' <span style="color:var(--texte-3)">— encore '+restantes+' série'+(restantes>1?'s':'')+'</span>' : ' <b>— dernière série</b>');

  let action='';
  if(Seance.etat==='pret'){
    action='<button class="bouton principal" data-act="demarrer">Démarrer la série '+Seance.iSerie+'</button>';
  } else if(Seance.etat==='recup-termine'){
    action='<button class="bouton principal" data-act="enchainer">Lancer la série suivante</button>';
  } else if(Seance.etat==='effort'){
    const prevu = parTemps
      ? dureeLisible(b.nbReps)
      : ((b.derniereSaisie!=null?b.derniereSaisie:b.nbReps)+' rép.');
    action='<button class="bouton effort" data-act="finValider">Série terminée \u00B7 '+prevu+'</button>'+
      '<div class="rangee" style="margin-top:8px">'+
      (parTemps?'<button class="bouton discret" data-act="pause">'+(Chrono.enPause()?'Reprendre':'Pause')+'</button>':'')+
      '<button class="bouton discret" data-act="finSerie">Autre nombre</button></div>';
  } else if(Seance.etat==='saisie'){
    /* Correction 4 : l'objectif est un cadre à gauche du compteur,
       de même hauteur que les commandes. */
    const c=Seance.repsSaisies<b.nbReps?'sous-objectif':Seance.repsSaisies>b.nbReps?'sur-objectif':'';
    const enMin=saisieEnMinutes(exo);
    action='<div class="carte">'+
      '<p class="rappel-obj">'+(parTemps?(enMin?'Durée réalisée':'Temps tenu'):'Répétitions réalisées')+'</p>'+
      '<div class="saisie-rangee">'+
      '<div class="objectif-box"><span class="lb">Objectif</span><span class="nb">'+
        valeurSaisieAffichee(exo,b.nbReps)+'</span></div>'+
      '<button class="rond" data-act="reps-" aria-label="Retirer">\u2212</button>'+
      '<span class="val '+c+'">'+valeurSaisieAffichee(exo,Seance.repsSaisies)+'</span>'+
      '<button class="rond" data-act="reps+" aria-label="Ajouter">+</button></div>'+
      '<p class="rappel-obj">'+(parTemps?(enMin?'minutes':'secondes'):'répétitions')+'</p></div>'+
      '<button class="bouton principal" data-act="valider">Valider et récupérer</button>';
  } else if(Seance.etat==='recup'){
    action='<div class="rangee">'+
      '<button class="bouton discret" data-act="pause">'+(Chrono.enPause()?'Reprendre':'Pause')+'</button>'+
      '<button class="bouton recup" data-act="passer">Passer à la suite</button></div>';
  }

  return '<div class="fil"><span>Exercice '+(Seance.iBloc+1)+'/'+a.blocs.length+'</span>'+
    '<span>'+prog.pct+' %</span></div>'+
    '<div class="jauge"><i style="width:'+prog.pct+'%"></i></div>'+cadranHTML()+
    '<div class="exo-tete">'+pictoLien(exo,'grand',true)+'<div style="min-width:0">'+
    '<h2 class="exo-nom">'+esc(exo.nom)+'</h2>'+
    '<p class="exo-meta">'+exo.zone1.map(z=>GROUPES[z]).join(' \u00B7 ')+
    (exo.zone2.length?' \u2192 '+exo.zone2.map(z=>GROUPES[z]).join(' \u00B7 '):'')+'</p></div></div>'+
    '<div class="zone-action">'+action+'</div>'+
    blocProgression(exo,b)+
    reglagesSerie(exo,b)+
    (exo.remarque?'<p class="aide" style="margin-top:10px">'+esc(exo.remarque)+'</p>':'')+
    '<div class="suite">'+vignetteSuite+'<span>'+ligneSuite+'</span></div>'+
    '<div class="rangee" style="margin-top:14px">'+
    (bs?'<button class="bouton discret" data-act="passer-exo">Passer l’exercice</button>':'')+
    '<button class="bouton discret" data-act="terminer">Terminer la séance</button></div>';
}

/* Plus aucun exercice ne se règle par l'écartement : la liste reste,
   vide, pour que la mécanique tienne si le besoin réapparaît. */
const ECARTEMENT_UTILE = [];
/* La hauteur ne sert qu'aux pompes, où surélever les pieds ou les
   mains est le seul moyen de doser la difficulté. */
const HAUTEUR_UTILE = ['exo-pompes-serrees','exo-pompes-larges'];
const SANS_LESTAGE = ['exo-pogo-hops','exo-sauts-verticaux','exo-bondissements',
  'exo-corde-a-sauter','exo-pallof-press','exo-rotateurs-externes-elastique',
  'exo-monster-walk-elastique','exo-face-pull','exo-bird-dog','exo-curl-up-mcgill',
  'exo-charniere-de-hanche-au-baton','exo-mobilite-cheville-au-mur',
  'exo-mobilite-hanche-fente-haute','exo-rotations-thoraciques','exo-superman'];

/* Quels réglages ont un sens pour cet exercice. */
function reglagesUtiles(exo){
  if(!exo) return [];
  const hors = exo.categorie==='etirement' || exo.categorie==='course' ||
    exo.id==='exo-echauffement-tapis-de-course';
  const l=[];
  if(!hors && ECARTEMENT_UTILE.indexOf(exo.id)>=0) l.push('ecartementCm');
  if(!hors && HAUTEUR_UTILE.indexOf(exo.id)>=0) l.push('hauteurCm');
  if(!hors && SANS_LESTAGE.indexOf(exo.id)<0) l.push('lestageKg');
  return l;
}

/* Les durées longues — échauffement, course — se saisissent en
   minutes ; les tenues courtes restent en secondes. */
function saisieEnMinutes(exo){
  return !!exo && exo.modeEffort==='temps' &&
    (exo.categorie==='echauffement' || exo.categorie==='course');
}
function pasSaisie(exo){
  if(saisieEnMinutes(exo)) return 60;
  return exo && exo.modeEffort==='temps' ? 5 : 1;
}
function valeurSaisieAffichee(exo,v){
  return saisieEnMinutes(exo) ? Math.round(v/60) : v;
}

/* Une quantité dite à voix haute : « 10 min » plutôt que « 600
   secondes », « 12 répétitions » pour le reste. */
function direQuantite(exo,v){
  return exo && exo.modeEffort==='temps' ? dureeLisible(v) : v+' répétitions';
}

/* Ce que vise l'exercice et comment il progresse. Affiché en clair
   pendant la séance : c'est au moment de lancer la série qu'on a
   besoin de savoir ce qui déclenche le palier suivant. */
/* Le conseil de progression, plus les deux charges de référence.
   Un échauffement ou un étirement n'a rien à charger : on n'affiche
   rien plutôt qu'une phrase vide. */
function blocProgression(exo,b){
  if(exo.categorie==='echauffement' || exo.categorie==='course') return '';
  const c=(exo.conseilProgression||'').trim();
  return (c?'<div class="bloc-prog"><b>Progression :</b> '+esc(c)+'</div>':'')+
    chargesReference(exo);
}

/* Les deux charges qui situent la série : celle de la dernière fois,
   et le record. Affiché seulement là où le lestage a un sens — inutile
   sur un étirement ou un Pallof press — et seulement s'il y a
   quelque chose à montrer. */
function chargesReference(exo){
  if(reglagesUtiles(exo).indexOf('lestageKg')<0) return '';
  const der=DB.maxPrecedent(exo.id,'lestageKg');
  const rec=DB.recordDeTousTemps(exo.id,'lestageKg');
  if(der==null && !rec) return '';
  const cases=[];
  cases.push('<span><i>Dernière séance</i>'+(der!=null?nbCourt(der)+' kg':'\u2014')+'</span>');
  if(rec) cases.push('<span class="record"><i>Record</i>'+nbCourt(rec.val)+' kg'+
    '<em>'+dateCourte(rec.date)+'</em></span>');
  return '<div class="charges-ref">'+cases.join('')+'</div>';
}
/* Date compacte, pour tenir dans une pastille. Abréviations écrites
   plutôt que tronquées : « avril » coupé à quatre lettres donne
   « avri », et juin/juillet se confondent sur trois. */
const MOIS_COURT=['janv.','févr.','mars','avr.','mai','juin',
  'juil.','août','sept.','oct.','nov.','déc.'];
function dateCourte(iso){
  const d=new Date(iso);
  return isNaN(d)?'':d.getDate()+' '+MOIS_COURT[d.getMonth()];
}

/* Écartement, hauteur, lestage : ouverts quand on s'apprête à lancer
   une série, repliés pendant l'effort et la récupération, où les
   toucher n'aurait plus de sens. */
function reglagesSerie(exo,b){
  const utiles=reglagesUtiles(exo);
  if(!utiles.length) return '';
  const corps =
    (utiles.indexOf('ecartementCm')>=0?reglageHTML('Écartement','ecartementCm',b.ecartementCm,'cm',1):'')+
    (utiles.indexOf('hauteurCm')>=0?reglageHTML('Hauteur','hauteurCm',b.hauteurCm,'cm',1):'')+
    (utiles.indexOf('lestageKg')>=0?reglageLestage(b.lestageKg):'')+
    '<p class="aide" style="padding-bottom:11px">'+
    (b.reglagesRepris
      ? 'Repris du maximum de ta dernière séance sur cet exercice. Ajuste avant de lancer : la valeur part avec la série.'
      : 'Premier passage : valeurs du modèle. Ce que tu régleras ici servira de point de départ la prochaine fois.')+
    '</p>';
  if(Seance.etat==='pret')
    return '<div class="reglages reglages-vifs">'+corps+'</div>';
  return '<details class="reglages"><summary>Réglages de l’exercice</summary>'+corps+'</details>';
}

/* Le lestage a son propre affichage : rien saisi = poids du corps. */
function reglageLestage(val){
  return '<div class="reglage"><span class="nom">Lestage</span><span class="pas">'+
    '<button data-reg="lestageKg" data-pas="-0.5">\u2212</button>'+
    '<span class="v" style="min-width:96px">'+(val==null||val===0?'Poids du corps':val+' kg')+'</span>'+
    '<button data-reg="lestageKg" data-pas="0.5">+</button></span></div>';
}
function reglageHTML(nom,champ,val,unite,pas){
  return '<div class="reglage"><span class="nom">'+nom+'</span><span class="pas">'+
    '<button data-reg="'+champ+'" data-pas="'+(-pas)+'">\u2212</button>'+
    '<span class="v">'+(val==null?'\u2014':val+' '+unite)+'</span>'+
    '<button data-reg="'+champ+'" data-pas="'+pas+'">+</button></span></div>';
}

function vueBilan(){
  const a=DB.journal[DB.journal.length-1];
  if(!a) return '<div class="vide"><p>Aucune séance enregistrée.</p></div>';
  const totalReps=a.series.reduce((n,s)=>n+s.repsRealisees,0);
  const atteints=a.series.filter(s=>s.repsRealisees>=s.repsObjectif).length;
  const stats=[[mmss(a.dureeSec),'durée'],[totalReps,'répétitions'],[atteints+'/'+a.series.length,'objectifs']];

  /* Rappel des conseils de progression des exercices chargés :
     c'est le moment de décider ce qu'on mettra la prochaine fois. */
  const vus={};
  (a.series||[]).forEach(s=>{ if(s.lestageKg>0) vus[s.exerciceId]=Math.max(vus[s.exerciceId]||0,s.lestageKg); });
  const conseils=Object.keys(vus).map(id=>{
    const e=DB.exercice(id); if(!e||!e.conseilProgression) return '';
    return '<div style="padding:9px 0;border-bottom:1px solid var(--filet);font-size:13.5px">'+
      '<b>'+esc(e.nom)+'</b> \u00B7 '+nbCourt(vus[id])+' kg<br>'+
      '<span style="color:var(--texte-2)">'+esc(e.conseilProgression)+'</span></div>';
  }).filter(Boolean).join('');
  const prog = conseils
    ? '<div class="carte" style="margin-top:12px">'+
      '<p class="etiquette">Pour la prochaine fois</p>'+conseils+'</div>'
    : '';
  const objSeance='';
  return '<div style="text-align:center;padding:26px 0 18px"><div style="font-size:46px">\u{1F3C5}</div>'+
    '<h2 style="font-weight:800;font-size:25px;letter-spacing:-.025em;margin:8px 0 2px">Séance terminée</h2>'+
    '<p style="color:var(--texte-2);margin:0">'+esc(a.nom)+'</p></div>'+
    '<div class="carte stat-grille">'+
    stats.map(s=>'<div><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('')+'</div>'+objSeance+prog+
    '<button class="bouton principal" style="margin-top:16px" data-act="retour">Retour aux séances</button>'+
    '<button class="bouton discret" style="margin-top:8px" data-detail="'+a.id+'">Voir le détail série par série</button>';
}

  const d=edition.data;
  if(!String(d.nom).trim()){ toast('Donne un nom à la séance.'); return; }
  (d.blocs||[]).forEach(b=>{
    ['nbSeries','nbReps','recupSerieSec','recupFinSec'].forEach(k=>b[k]=Math.max(0,parseInt(b[k],10)||0));

  const i=DB.modeles.findIndex(x=>x.id===d.id);

let planif=null;   /* écran de planification : {modeleId,date,mode,jours,occurrences} */

const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const memeJour=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
function lundiDe(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function cleSemaine(d){ return lundiDe(d).toISOString().slice(0,10); }
function isoJour(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }

const PERIODES={'7j':7,'1m':30,'3m':91,'6m':183,'annee':null,'1an':365};
const LIB_PERIODES={'7j':'7 jours','1m':'1 mois','3m':'3 mois','6m':'6 mois','annee':'Année en cours','1an':'1 an'};
function debutPeriode(cle){
  const d=new Date();
  if(cle==='annee') return new Date(d.getFullYear(),0,1).getTime();
  const n=PERIODES[cle]||91;
  return d.getTime()-n*86400000;
}

/* ------------------------------------------------------------
   DEUX UNITÉS, JAMAIS MÉLANGÉES
   Les exercices en répétitions (pompes, squat…) se comptent en
   répétitions. Les exercices en temps (gainage, étirements) se
   comptent en secondes. Aucune conversion entre les deux : le
   ratio « 3 s = 1 rép. » était arbitraire, il a disparu.
   ------------------------------------------------------------ */
const UNITES={reps:{cle:'reps',lib:'Répétitions',court:'rép.',axe:'répétitions'},
              temps:{cle:'temps',lib:'Durée',court:'min',axe:'minutes'}};

function categorieSerie(s){ const e=DB.exercice(s.exerciceId); return e?e.categorie:'haut'; }
function uniteSerie(s){ const e=DB.exercice(s.exerciceId); return (e&&e.modeEffort==='temps')?'temps':'reps'; }
/* valeur d'une série dans SON unité : répétitions, ou secondes */
function valeurSerie(s){ return s.repsRealisees; }
/* la série compte-t-elle pour l'unité demandée ? */
function serieDansUnite(s,unite){ return uniteSerie(s)===unite; }

/* catégories proposées aux filtres, étirements compris */
const CATS_STAT=[['tous','Tout'],['haut','Haut du corps'],['abdo','Abdo/Gainage'],
                 ['bas','Bas du corps'],['etirement','Étirements']];
/* unité naturelle d'une catégorie : les étirements se lisent en durée */
function uniteNaturelle(cat){ return cat==='etirement'?'temps':'reps'; }

/* bilan d'une séance archivée, chaque unité de son côté */
function bilanSeance(a){
  let reps=0, sec=0, atteints=0;
  (a.series||[]).forEach(s=>{
    if(uniteSerie(s)==='temps') sec+=valeurSerie(s); else reps+=valeurSerie(s);
    if(s.repsRealisees>=s.repsObjectif) atteints++;
  });
  return {reps:Math.round(reps), sec:Math.round(sec), min:Math.round(sec/60),
          series:(a.series||[]).length, atteints, duree:a.dureeSec||0};
}
function resumeChiffre(b){
  const p=[];
  if(b.reps) p.push(b.reps+' rép.');
  if(b.min)  p.push(b.min+' min de tenue');
  if(!p.length) p.push(b.series+' séries');
  return p.join(' \u00B7 ');
}

function serieActivites(){
  const N=Math.max(1,DB.reglages.seancesParSemaine||2);
  const parSem={};
  DB.journal.forEach(a=>{ const k=cleSemaine(new Date(a.debut)); parSem[k]=(parSem[k]||0)+1; });
  let semaines=0,total=0;
  const cur=lundiDe(new Date());
  const cetteSemaine=parSem[cur.toISOString().slice(0,10)]||0;
  const d=new Date(cur);
  for(let i=0;i<520;i++){
    const k=d.toISOString().slice(0,10), n=parSem[k]||0;
    /* la semaine en cours n'est pas finie : elle ne casse pas la série */
    if(i===0 && n<N){ d.setDate(d.getDate()-7); continue; }
    if(n>=N){ semaines++; total+=n; d.setDate(d.getDate()-7); } else break;
  }
  return {semaines,total,objectif:N,cetteSemaine};
}

function seancesPeriode(cle,filtre,unite){
  const t0=debutPeriode(cle);
  return DB.journal.filter(a=>new Date(a.debut).getTime()>=t0)
    .map(a=>{
      const series=(a.series||[]).filter(x=>
        serieDansUnite(x,unite) && (filtre==='tous'||categorieSerie(x)===filtre));
      const brut=series.reduce((n,x)=>n+valeurSerie(x),0);
      return {date:new Date(a.debut), nom:a.nom, id:a.id, nb:series.length,
              val: unite==='temps' ? Math.round(brut/60) : Math.round(brut)};
    })
    .filter(x=>x.nb>0)
    .sort((a,b)=>a.date-b.date);
}

function deltaPeriode(cle,unite){
  const n=PERIODES[cle]||91;
  const fin=Date.now(), deb=cle==='annee'?debutPeriode('annee'):fin-n*86400000;
  const duree=fin-deb, debPrec=deb-duree;
  const cats = unite==='temps' ? ['abdo','etirement'] : ['haut','bas','abdo'];
  const somme=(t0,t1)=>{
    const r={}; cats.forEach(c=>r[c]=0);
    DB.journal.forEach(a=>{
      const t=new Date(a.debut).getTime();
      if(t<t0||t>=t1) return;
      (a.series||[]).forEach(s=>{
        if(!serieDansUnite(s,unite)) return;
        const c=categorieSerie(s);
        if(r[c]!=null) r[c]+=valeurSerie(s);
      });
    });
    return r;
  };
  const act=somme(deb,fin), prec=somme(debPrec,deb);
  const conv=v=>unite==='temps'?Math.round(v/60):Math.round(v);
  return cats.map(c=>{
    const a=conv(act[c]), p=conv(prec[c]);
    const pct = p>0 ? Math.round((a-p)/p*100) : (a>0?null:0);
    return {cat:c, actuel:a, precedent:p, delta:a-p, pct};
  });
}

function recordsParGroupe(semaines,unite){
  const t0=Date.now()-semaines*7*86400000, r={};
  Object.keys(GROUPES).forEach(g=>{
    r[g]={val:0,valBrute:0,valFac:1,valExo:'',charge:0,chargeBrute:0,chargeFac:1,chargeExo:''};
  });
  DB.journal.forEach(a=>{
    if(new Date(a.debut).getTime()<t0) return;
    (a.series||[]).forEach(s=>{
      const e=DB.exercice(s.exerciceId); if(!e) return;
      const v = serieDansUnite(s,unite) ? (valeurSerie(s)||0) : 0;
      const kg = s.lestageKg||0;
      const paires=[].concat(
        (e.zone1||[]).map(g=>[g,1]), (e.zone2||[]).map(g=>[g,0.5]));
      paires.forEach(pr=>{
        const g=pr[0], f=pr[1], c=r[g];
        if(!c) return;
        if(v>0 && v*f>c.val){ c.val=v*f; c.valBrute=v; c.valFac=f; c.valExo=e.nom; }
        if(kg>0 && kg*f>c.charge){ c.charge=kg*f; c.chargeBrute=kg; c.chargeFac=f; c.chargeExo=e.nom; }
      });
    });
  });
  return r;
}
/* Un nombre lisible : pas de décimale inutile, virgule française. */
function nbCourt(v){
  const x=Math.round(v*10)/10;
  return String(x % 1 === 0 ? x : x.toFixed(1)).replace('.',',');
}
/* Le tableau par groupe : volume, meilleure série, charge la plus
   lourde. Trié par volume décroissant — l'ordre porte l'information
   principale, celle du déséquilibre entre groupes. */
function tableauGroupes(vol,maxVol,semaines,unite){
  const rec=recordsParGroupe(semaines,unite);
  const uEff = unite==='temps' ? 's' : 'rép.';
  const libEff = unite==='temps' ? 'Tenue max' : 'Série max';
  const lignes=Object.keys(GROUPES).map(g=>({g,v:vol[g]||0,r:rec[g]}))
    .sort((a,b)=>b.v-a.v)
    .map(x=>{
      const part=maxVol>0?Math.max(0,Math.min(1,x.v/maxVol)):0;
      const cell=(brut,val,fac,exo,u)=>{
        if(!(val>0)) return '<span class="vv muet">\u2014</span>';
        const sous = fac<1 ? nbCourt(brut)+' '+u+' \u00D7 50 %' : (exo?exo:'');
        return '<span class="vv">'+nbCourt(val)+
          '<small>'+esc(sous||u)+'</small></span>';
      };
      return '<div class="gl"><div class="nm">'+GROUPES[x.g]+
        '<div class="barre-g"><i style="width:'+(part*100).toFixed(0)+'%"></i></div>'+
        '<span class="src">'+nbCourt(x.v)+' '+(unite==='temps'?'min':'rép.')+' cumulées'+
        (x.r.valExo?' \u00B7 '+esc(x.r.valExo):'')+'</span></div>'+
        cell(x.r.valBrute,x.r.val,x.r.valFac,'',uEff)+
        cell(x.r.chargeBrute,x.r.charge,x.r.chargeFac,x.r.chargeExo,'kg')+
        '</div>';
    }).join('');
  return '<div class="groupes-tab">'+
    '<div class="gl"><div class="nm" style="color:var(--texte-3);font-size:11px;letter-spacing:.08em">GROUPE</div>'+
    '<span class="vv muet" style="font-size:11px;letter-spacing:.04em">'+libEff.toUpperCase()+'</span>'+
    '<span class="vv muet" style="font-size:11px;letter-spacing:.04em">CHARGE MAX</span></div>'+
    lignes+'</div>';
}

function volumeParGroupe(semaines,unite){
  const t0=Date.now()-semaines*7*86400000, vol={};
  Object.keys(GROUPES).forEach(g=>vol[g]=0);
  DB.journal.forEach(a=>{
    if(new Date(a.debut).getTime()<t0) return;
    (a.series||[]).forEach(s=>{
      if(!serieDansUnite(s,unite)) return;
      const e=DB.exercice(s.exerciceId); if(!e) return;
      const v=valeurSerie(s);
      (e.zone1||[]).forEach(g=>{ if(vol[g]!=null) vol[g]+=v; });
      (e.zone2||[]).forEach(g=>{ if(vol[g]!=null) vol[g]+=v*0.5; });
    });
  });
  if(unite==='temps') Object.keys(vol).forEach(g=>vol[g]=vol[g]/60);
  return vol;
}

/* ============================================================
   Graphique : nuage + courbe, SVG à la main
   ============================================================ */
function graphCharge(pts,unite){
  if(pts.length<1) return '<div class="vide" style="padding:30px"><p>Pas encore de données sur cette période.</p></div>';
  const L=320,H=150,mg={g:34,d:8,h:12,b:22};
  const maxY=Math.max(unite==='temps'?5:10,...pts.map(p=>p.val));
  const t0=pts[0].date.getTime(), t1=pts[pts.length-1].date.getTime();
  const etendue=Math.max(1,t1-t0);
  const x=p=>mg.g+(L-mg.g-mg.d)*((p.date.getTime()-t0)/etendue);
  const y=v=>mg.h+(H-mg.h-mg.b)*(1-v/maxY);
  const chemin=pts.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+' '+y(p.val).toFixed(1)).join(' ');
  const aire=pts.length>1 ? chemin+' L'+x(pts[pts.length-1]).toFixed(1)+' '+(H-mg.b)+' L'+x(pts[0]).toFixed(1)+' '+(H-mg.b)+' Z' : '';
  const ticks=[0,Math.round(maxY/2),maxY];
  const grilles=ticks.map(v=>'<line class="gril" x1="'+mg.g+'" y1="'+y(v)+'" x2="'+(L-mg.d)+'" y2="'+y(v)+'"/>'+
    '<text class="lb" x="'+(mg.g-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>').join('');
  const dates=[pts[0],pts[pts.length-1]].filter((p,i,t)=>i===0||t[0]!==p).map((p,i)=>
    '<text class="lb" x="'+x(p)+'" y="'+(H-6)+'" text-anchor="'+(i?'end':'start')+'">'+
    p.date.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>').join('');
  return '<svg class="graph" viewBox="0 0 '+L+' '+H+'" role="img" aria-label="Charge d’entraînement">'+
    grilles+
    (aire?'<path class="aire" d="'+aire+'"/>':'')+
    (pts.length>1?'<path class="courbe" d="'+chemin+'"/>':'')+
    pts.map(p=>'<circle class="pt" cx="'+x(p).toFixed(1)+'" cy="'+y(p.val).toFixed(1)+'" r="3.5"/>').join('')+
    '<line class="axe" x1="'+mg.g+'" y1="'+(H-mg.b)+'" x2="'+(L-mg.d)+'" y2="'+(H-mg.b)+'"/>'+
    dates+'</svg>';
}

    'avec au moins '+sa.objectif+' entraînement'+(sa.objectif>1?'s':'')+

  const bF=CATS_STAT.filter(c=>uniteCharge==='reps'?c[0]!=='etirement':true).map(c=>
    '<button data-fcharge="'+c[0]+'" aria-pressed="'+(filtreCharge===c[0])+'">'+c[1]+'</button>').join('');
  const noteU = uniteCharge==='temps'

/* Nombre de séances réalisées, semaine par semaine. */
function frequenceHebdo(nb){
  const auj=new Date(), out=[];
  for(let w=nb-1;w>=0;w--){
    const lundi=lundiDe(auj); lundi.setDate(lundi.getDate()-7*w);
    const fin=new Date(lundi); fin.setDate(fin.getDate()+7);
    const c=DB.journal.filter(a=>{ const d=new Date(a.debut); return d>=lundi&&d<fin; }).length;
    out.push({lundi:new Date(lundi), n:c});
  }
  return out;
}
/* Charge maximale retenue à chaque séance, pour un exercice. */
function serieCharges(exerciceId){
  const pts=[];
  DB.journal.forEach(a=>{
    let m=null;
    (a.series||[]).forEach(s=>{
      if(s.exerciceId!==exerciceId) return;
      if(s.lestageKg!=null && s.lestageKg>0 && (m==null||s.lestageKg>m)) m=s.lestageKg;
    });
    if(m!=null) pts.push({t:new Date(a.debut).getTime(), kg:m});
  });
  return pts.sort((a,b)=>a.t-b.t);
}
/* Les exercices qui ont au moins un point, du mieux fourni au moins
   fourni : c'est l'ordre dans lequel on propose les onglets. */
function exercicesAvecCharge(){
  return DB.exercices.map(e=>({e, pts:serieCharges(e.id)}))
    .filter(x=>x.pts.length>0)
    .sort((a,b)=>b.pts.length-a.pts.length || b.pts[b.pts.length-1].kg-a.pts[a.pts.length-1].kg);
}

function blocCharges(){
  const dispo=exercicesAvecCharge();
  const titre='<p class="etiquette" style="margin-top:22px">Charge maximale par exercice</p>';
  if(!dispo.length)
    return titre+'<div class="carte"><div class="vide" style="padding:20px 0">'+
      '<p>Aucune charge enregistrée pour l’instant.</p>'+
      '<p style="font-size:13px">La courbe apparaîtra dès la première série réalisée avec un '+
      'lestage : un point par séance, la charge la plus lourde validée ce jour-là.</p></div></div>';
  if(!exoCourbe || !dispo.some(x=>x.e.id===exoCourbe)) exoCourbe=dispo[0].e.id;
  const cible=dispo.filter(x=>x.e.id===exoCourbe)[0];
  const pts=cible.pts, exo=cible.e;

  const onglets='<div class="chips">'+dispo.slice(0,12).map(x=>
    '<button'+(x.e.id===exoCourbe?' class="on"':'')+' data-courbe="'+esc(x.e.id)+'">'+
    esc(x.e.nom)+'</button>').join('')+'</div>';

  const premier=pts[0], dernier=pts[pts.length-1];
  const gain=Math.round((dernier.kg-premier.kg)*10)/10;
  const entete='<div class="delta"><span>'+esc(exo.nom)+'</span>'+
    '<span class="n">'+nbCourt(dernier.kg)+' kg</span></div>'+
    '<p class="aide" style="margin:2px 0 0">'+pts.length+' séance'+(pts.length>1?'s':'')+
    ' \u00B7 '+(pts.length>1
      ? (gain>0?'+':'')+nbCourt(gain)+' kg depuis le '+dateCourte(new Date(premier.t).toISOString())
      : 'premier point enregistré')+'</p>';

  if(pts.length<2)
    return titre+'<div class="carte">'+onglets+entete+
      '<p class="aide" style="margin-top:10px">Une deuxième séance sur cet exercice et la courbe '+
      'apparaîtra.</p></div>';

  /* --- tracé ------------------------------------------------------ */
  const W=320, H=150, mg={g:42,d:10,h:12,b:22};
  const t0=pts[0].t, t1=pts[pts.length-1].t, dt=Math.max(1,t1-t0);
  const kgs=pts.map(p=>p.kg);
  let lo=Math.min.apply(null,kgs), hi=Math.max.apply(null,kgs);
  if(hi===lo){ hi=lo+5; lo=Math.max(0,lo-5); }
  const marge=(hi-lo)*0.15; lo=Math.max(0,lo-marge); hi=hi+marge;
  const X=t=>mg.g+(t-t0)/dt*(W-mg.g-mg.d);
  const Y=k=>mg.h+(1-(k-lo)/(hi-lo))*(H-mg.h-mg.b);
  const d=pts.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+' '+Y(p.kg).toFixed(1)).join('');
  const aire=d+'L'+X(t1).toFixed(1)+' '+(H-mg.b)+'L'+X(t0).toFixed(1)+' '+(H-mg.b)+'Z';
  const cercles=pts.map(p=>'<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.kg).toFixed(1)+'" r="3"/>').join('');
  const bas=Math.min.apply(null,kgs), haut=Math.max.apply(null,kgs);
  const grad=[bas,(bas+haut)/2,haut].map(v=>
    '<line x1="'+mg.g+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-mg.d)+'" y2="'+Y(v).toFixed(1)+'"/>'+
    '<text x="'+(mg.g-5)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end">'+nbCourt(v)+'</text>').join('');
  const dates='<text x="'+mg.g+'" y="'+(H-6)+'">'+dateCourte(new Date(t0).toISOString())+'</text>'+
    '<text x="'+(W-mg.d)+'" y="'+(H-6)+'" text-anchor="end">'+dateCourte(new Date(t1).toISOString())+'</text>';

  return titre+'<div class="carte">'+onglets+entete+
    '<svg class="courbe" viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" '+
      'role="img" aria-label="Évolution de la charge maximale">'+
      '<g class="grille">'+grad+'</g>'+
      '<path class="aire" d="'+aire+'"/><path class="trait" d="'+d+'"/>'+
      '<g class="pts">'+cercles+'</g><g class="axe">'+dates+'</g></svg>'+
    '<p class="aide" style="margin-top:8px">Un point par séance : la charge la plus lourde validée '+
    'ce jour-là. L\u2019axe horizontal suit les dates réelles — un creux après une coupure se voit.</p>'+
    '</div>';
}

function blocFrequence(){
  const sem=frequenceHebdo(12);
  const total=sem.reduce((t,s)=>t+s.n,0);
  if(!total) return '';
  const CIBLE=2;
  const max=Math.max(CIBLE+1,...sem.map(s=>s.n));
  const actives=sem.filter(s=>s.n>0).length;
  const moy=Math.round(total/sem.length*10)/10;
  const barres=sem.map((s,i)=>
    '<div class="hb'+(s.n?'':' vide')+'">'+
      '<span class="v">'+(s.n||'')+'</span>'+
      '<i style="height:'+(s.n?Math.max(6,Math.round(s.n/max*100)):1)+'%"></i>'+
    '</div>').join('');
  const etiq=sem.map((s,i)=>'<span>'+((i%2===0||i===sem.length-1)
    ? s.lundi.getDate()+'/'+(s.lundi.getMonth()+1) : '')+'</span>').join('');
  return '<p class="etiquette" style="margin-top:22px">Séances par semaine \u00B7 12 semaines</p>'+
    '<div class="carte">'+
    '<div class="delta"><span>Moyenne</span><span class="n">'+String(moy).replace('.',',')+
      ' / semaine</span></div>'+
    '<div class="histo">'+barres+
      '<div class="cible" style="bottom:'+Math.round(CIBLE/max*100)+'%"><b>cible '+CIBLE+'</b></div>'+
    '</div>'+
    '<div class="histo-lb">'+etiq+'</div>'+
    '<p class="aide" style="margin-top:10px">Une barre par semaine, du lundi au dimanche. '+
    'Le repère est à deux séances : c\u2019est la fréquence du programme en trois phases, '+
    'et le minimum efficace retenu par la litt\u00E9rature chez le coureur. '+
    (actives<sem.length?'Semaines sans s\u00E9ance : '+(sem.length-actives)+'.':'Aucune semaine blanche.')+
    '</p></div>';
}

function journalBulles(){
  const auj=new Date();
  let html='<p class="etiquette" style="margin-top:22px">Journal d’entraînement</p>';
  const maxDuree=Math.max(1,...DB.journal.map(a=>a.dureeSec||0));
  for(let w=0;w<semainesJournal;w++){
    const lundi=lundiDe(auj); lundi.setDate(lundi.getDate()-7*w);
    const dim=new Date(lundi); dim.setDate(dim.getDate()+6);
    const tot={haut:0,bas:0,abdo:0}, tps={gainage:0,etirement:0};
    const cells=[];
    for(let i=0;i<7;i++){
      const d=new Date(lundi); d.setDate(lundi.getDate()+i);
      const faites=DB.journal.filter(a=>memeJour(new Date(a.debut),d));
      if(!faites.length){ cells.push('<div class="bulle vide"><i></i></div>'); continue; }
      const duree=faites.reduce((n,a)=>n+(a.dureeSec||0),0);
      faites.forEach(a=>(a.series||[]).forEach(s=>{
        const c=categorieSerie(s);
        if(uniteSerie(s)==='temps'){ tps[c==='etirement'?'etirement':'gainage']+=valeurSerie(s); }
        else if(tot[c]!=null) tot[c]+=valeurSerie(s);
      }));
      const taille=Math.round(16+22*Math.sqrt(duree/maxDuree));
      cells.push('<div class="bulle" data-detail="'+faites[0].id+'">'+
        '<i style="width:'+taille+'px;height:'+taille+'px">'+Math.round(duree/60)+'</i></div>');
    }
    html+='<div class="carte" style="margin-bottom:9px">'+
      '<div class="semaine-lg"><b style="color:var(--texte);font-size:13px">'+
      lundi.getDate()+' '+MOIS[lundi.getMonth()].slice(0,4)+'. \u2013 '+dim.getDate()+' '+MOIS[dim.getMonth()].slice(0,4)+'.</b></div>'+
      '<div class="bulles">'+cells.join('')+'</div>'+
      '<div class="semaine-lg" style="font-size:11.5px">'+
      '<span>Haut '+Math.round(tot.haut)+' rép.</span><span>Bas '+Math.round(tot.bas)+' rép.</span>'+
      '<span>Abdo '+Math.round(tot.abdo)+' rép.</span></div>'+
      ((tps.gainage||tps.etirement)?'<div class="semaine-lg" style="font-size:11.5px;color:var(--texte-3)">'+
        '<span>Gainage '+Math.round(tps.gainage/60)+' min</span>'+
        '<span>Étirements '+Math.round(tps.etirement/60)+' min</span></div>':'')+
      '</div>';
  }
  html+='<div class="rangee"><button class="bouton discret" data-act="plus-semaines">3 semaines de plus</button>'+
    '<button class="bouton discret" data-act="histo">Tout l\u2019historique</button></div>'+
    '<p class="aide" style="margin-top:6px;text-align:center">Taille de la bulle = durée de la séance. '+
    'Le chiffre est la durée en minutes.</p>';
  return html;
}

/* ============================================================
   PLANIFICATEUR — date unique ou récurrence
   ============================================================ */
const MODES_PLANIF=[['unique','Une seule date'],['hebdo','Chaque semaine'],
                    ['mensuel','Chaque mois'],['trimestriel','Chaque trimestre']];
const JOURS_COURTS=['L','M','M','J','V','S','D'];

function ouvrirPlanificateur(modeleId, date){
  const d = date || jourSelectionne || new Date();
  planif={ modeleId:modeleId||'', date:isoJour(d), mode:'unique',
           jours:[(d.getDay()+6)%7], occurrences:8 };
  ecranParams=false; detailSeanceId=null; vueSpecialeHisto=false;
  ongletCourant='planif'; rendre();
}

/* Calcule les dates engendrées par le réglage courant. */
function datesPlanifiees(p){
  if(!p || !p.date) return [];
  const d0=new Date(p.date+'T09:00:00');
  if(isNaN(d0)) return [];
  if(p.mode==='unique') return [d0];
  const n=Math.max(1,Math.min(52,parseInt(p.occurrences,10)||8));
  const out=[];
  if(p.mode==='hebdo'){
    const jours=(p.jours&&p.jours.length?p.jours.slice():[(d0.getDay()+6)%7]).sort((a,b)=>a-b);
    const lundi=lundiDe(d0);
    const plancher=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());
    for(let w=0; w<n && out.length<120; w++){
      jours.forEach(j=>{
        const d=new Date(lundi); d.setDate(lundi.getDate()+7*w+j); d.setHours(9,0,0,0);
        if(d>=plancher) out.push(d);
      });
    }
    return out;
  }
  const pas = p.mode==='mensuel' ? 1 : 3;
  for(let i=0;i<n;i++){
    const d=new Date(d0.getFullYear(), d0.getMonth()+pas*i, 1, 9, 0, 0);
    /* si le quantième n'existe pas dans le mois, on prend le dernier jour */
    const dernier=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(d0.getDate(), dernier));
    out.push(d);
  }
  return out;
}

        (dates.length>8?'<p class="aide" style="margin-top:8px">…et '+(dates.length-8)+
          ' autre'+(dates.length-8>1?'s':'')+'.</p>':'');

  return '<button class="retour" data-act="fermer-planif">\u2039 Retour</button>'+
    '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 12px">Planifier une séance</h2>'+
    '<div class="carte">'+

    '<div class="carte">'+apercu+'</div>'+
    '<div class="barre-form">'+

    '<button class="bouton principal" data-act="valider-planif">Ajouter au calendrier</button></div>';

const TYPES_HISTO=[['tous','Toutes'],['haut','Haut'],['bas','Bas'],
                   ['abdo','Abdo/Gainage'],['etirement','Étirements']];

function vueHistorique(){
  const toutes=DB.journal.slice().sort((a,b)=>new Date(b.debut)-new Date(a.debut));
  const liste=toutes.filter(a=>filtreHisto==='tous'||DB.categoriesRealisee(a).indexOf(filtreHisto)>=0);
  const filtres='<div class="filtres">'+TYPES_HISTO.map(t=>
    '<button data-fhisto="'+t[0]+'" aria-pressed="'+(filtreHisto===t[0])+'">'+t[1]+'</button>').join('')+'</div>';

  if(!liste.length){
    return '<button class="retour" data-act="fermer-histo">\u2039 Retour</button>'+
      '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 12px">Historique</h2>'+
      filtres+'<div class="vide"><div class="gros">\u{1F4CB}</div>'+
      '<p>'+(toutes.length?'Aucune séance de ce type.':'Aucune séance enregistrée pour l’instant.')+'</p></div>';
  }

  /* regroupement par mois, avec le total du mois en tête */
  const groupes=[];
  liste.forEach(a=>{
    const d=new Date(a.debut), cle=d.getFullYear()+'-'+d.getMonth();
    let g=groupes.find(x=>x.cle===cle);
    if(!g){ g={cle, libelle:MOIS[d.getMonth()]+' '+d.getFullYear(), seances:[]}; groupes.push(g); }
    g.seances.push(a);
  });

  let restant=limiteHisto, corps='';
  for(const g of groupes){
    if(restant<=0) break;
    const tot=g.seances.reduce((t,a)=>{ const b=bilanSeance(a);
      return {n:t.n+1, duree:t.duree+b.duree, reps:t.reps+b.reps, min:t.min+b.min}; },
      {n:0,duree:0,reps:0,min:0});
    corps+='<div class="mois-tete"><b>'+g.libelle+'</b><span>'+tot.n+' séance'+(tot.n>1?'s':'')+
      ' \u00B7 '+mmss(tot.duree)+(tot.reps?' \u00B7 '+tot.reps+' rép.':'')+
      (tot.min?' \u00B7 '+tot.min+' min':'')+'</span></div>';
    for(const a of g.seances){
      if(restant--<=0) break;
      const b=bilanSeance(a), d=new Date(a.debut);
      const taux=b.series?Math.round(b.atteints/b.series*100):0;
      const coul=taux>=100?'var(--recup)':taux>=70?'var(--chauffe)':'var(--texte-3)';
      corps+='<div class="ligne" data-detail="'+a.id+'">'+
        '<div class="jour-puce"><b>'+d.getDate()+'</b><span>'+
        ['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()]+'</span></div>'+
        '<div class="txt"><b>'+esc(a.nom)+'</b><span>'+mmss(b.duree)+' \u00B7 '+resumeChiffre(b)+'</span></div>'+
        '<span class="taux" style="color:'+coul+'">'+taux+'%</span>'+
        '<span class="fleche">\u203A</span></div>';
    }
  }
  const reste=liste.length-Math.min(limiteHisto,liste.length);
  return '<button class="retour" data-act="fermer-histo">\u2039 Retour</button>'+
    '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 3px">Historique</h2>'+
    '<p style="color:var(--texte-2);margin:0 0 12px;font-size:13.5px">'+liste.length+' séance'+
    (liste.length>1?'s':'')+' enregistrée'+(liste.length>1?'s':'')+
    ' \u00B7 le pourcentage indique les objectifs atteints.</p>'+
    filtres+corps+
    (reste>0?'<button class="bouton discret" style="margin-top:10px" data-act="plus-histo">'+
      'Afficher '+Math.min(25,reste)+' séance'+(reste>1?'s':'')+' de plus</button>':'');
}

/* ============================================================
   LOT 5 — PLANIFICATION
   ============================================================ */
function grilleMois(base){
  const p=new Date(base.getFullYear(),base.getMonth(),1);
  const debut=new Date(p); debut.setDate(1-((p.getDay()+6)%7));
  const j=[];
  for(let i=0;i<42;i++){ const d=new Date(debut); d.setDate(debut.getDate()+i); j.push(d); }
  return j;
}
function activiteDuJour(d){
  return {
    faites:DB.journal.filter(a=>memeJour(new Date(a.debut),d)),
    prevues:DB.planifiees.filter(p=>p.statut==='planifiee'&&memeJour(new Date(p.date),d))
  };
}
function vuePlanif(){
  if(!moisAffiche) moisAffiche=new Date();
  const base=moisAffiche, auj=new Date();
  const cases=grilleMois(base).map(d=>{
    const a=activiteDuJour(d), hors=d.getMonth()!==base.getMonth();
    let pt='';
    if(a.faites.length) pt='<span class="pt fait"></span>';
    else if(a.prevues.length) pt='<span class="pt prev"></span>';
    return '<button class="jour'+(hors?' hors':'')+(memeJour(d,auj)?' auj':'')+
      (jourSelectionne&&memeJour(d,jourSelectionne)?' auj':'')+
      '" data-jour="'+isoJour(d)+'">'+d.getDate()+pt+'</button>';
  }).join('');
  const aVenir=DB.planifiees.filter(p=>p.statut==='planifiee').sort((a,b)=>new Date(a.date)-new Date(b.date));
  const liste=aVenir.length?aVenir.map(p=>{
    const m=DB.modele(p.modeleId), d=new Date(p.date), a0=new Date(); a0.setHours(0,0,0,0);
    return '<div class="item">'+
      '<h3>'+esc(p.nom||(m?m.nom:'Séance supprimée'))+'</h3>'+
      '<div class="quand"'+(d<a0?' style="color:var(--effort);font-weight:600"':'')+'>'+
      d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+
      (m?' \u00B7 '+resumeSeance(m):'')+'</div>'+
      '<div class="cmds">'+
      (m&&(m.blocs||[]).length?'<button class="go" data-go="'+m.id+'">Débuter</button>':'')+
      '<button data-decaler="'+p.id+'" data-n="1">+1 jour</button>'+
      '<button data-decaler="'+p.id+'" data-n="7">+1 sem.</button>'+
      '<button data-dupliquer-p="'+p.id+'">Dupliquer</button>'+
      '<button data-suppr-p="'+p.id+'">Supprimer</button></div></div>';
  }).join('')
   :'<div class="vide" style="padding:26px"><p>Rien de planifié.</p>'+
    '<p style="font-size:13.5px">Touche un jour, puis choisis une séance ci-dessous.</p></div>';
  return '<div class="carte"><div class="cal-nav">'+
    '<button data-mois="-1" aria-label="Mois précédent">\u2039</button>'+
    '<b>'+MOIS[base.getMonth()]+' '+base.getFullYear()+'</b>'+
    '<button data-mois="1" aria-label="Mois suivant">\u203A</button></div>'+
    '<div class="cal">'+['L','M','M','J','V','S','D'].map(j=>'<div class="jn">'+j+'</div>').join('')+cases+'</div>'+
    '<p class="aide" style="margin-top:10px">Point plein : séance réalisée. Cercle : séance planifiée.</p></div>'+
    (jourSelectionne?panneauJour():'')+
    '<button class="ajout" style="margin-top:12px" data-act="ouvrir-planif">+ Planifier une séance</button>'+
    '<p class="etiquette" style="margin-top:22px">Programmé</p>'+liste+
    blocRealisees();
}

/* Les séances réalisées sur les quatorze derniers jours, de la plus
   récente à la plus ancienne. Chaque ligne ouvre son détail. */
function blocRealisees(){
  const t0=Date.now()-14*86400000;
  const faites=DB.journal.filter(a=>new Date(a.debut).getTime()>=t0)
    .sort((a,b)=>new Date(b.debut)-new Date(a.debut));
  const corps = faites.length
    ? faites.map(a=>{
        const d=new Date(a.debut);
        return '<div class="ligne" data-detail="'+esc(a.id)+'"><div class="txt">'+
          '<b>'+esc(a.nom||'Séance')+'</b><span>'+
          d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+
          ' \u00B7 '+dureeLisible(a.dureeSec||0)+
          ' \u00B7 '+(a.series||[]).length+' séries</span></div>'+
          '<span class="fleche">\u203A</span></div>';
      }).join('')
    : '<div class="vide" style="padding:22px"><p>Aucune séance sur les 14 derniers jours.</p></div>';
  return '<p class="etiquette" style="margin-top:22px">Réalisé \u00B7 14 derniers jours</p>'+
    '<div class="carte" style="padding:4px 15px">'+corps+'</div>';
}
function panneauJour(){
  const d=jourSelectionne, a=activiteDuJour(d);
  const faites=a.faites.map(x=>'<div class="ligne" data-detail="'+x.id+'"><div class="txt"><b>'+esc(x.nom)+'</b>'+
    '<span>réalisée \u00B7 '+mmss(x.dureeSec||0)+' \u00B7 '+(x.series||[]).length+' séries</span></div>'+
    '<span class="fleche">\u203A</span></div>').join('');
  const prev=a.prevues.map(p=>{
    const m=DB.modele(p.modeleId);
    return '<div class="ligne"><div class="txt"><b>'+esc(p.nom||(m?m.nom:'?'))+'</b><span>planifiée</span></div>'+
      '<button data-suppr-p="'+p.id+'" style="color:var(--texte-3);font-size:20px;padding:0 8px">\u00D7</button></div>';
  }).join('');
  return '<div class="carte" style="margin-top:12px;border-color:var(--accent)">'+
    '<p class="etiquette" style="color:var(--accent)">'+
    d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</p>'+
    (faites+prev||'<p style="color:var(--texte-2);font-size:13.5px;margin:0">Rien ce jour-là.</p>')+'</div>';
}

/* --- détail d'une séance réalisée --- */
function vueDetailSeance(){
  const a=DB.journal.find(x=>x.id===detailSeanceId);
  if(!a) return '<div class="vide"><p>Séance introuvable.</p>'+
    '<button class="bouton discret" data-act="fermer-detail">Retour</button></div>';
  const parBloc={};
  (a.series||[]).forEach(s=>(parBloc[s.indexBloc]=parBloc[s.indexBloc]||[]).push(s));
  const blocs=Object.keys(parBloc).sort((x,y)=>x-y).map(k=>{
    const ss=parBloc[k], e=DB.exercice(ss[0].exerciceId);
    const lignes=ss.map(s=>'<div class="delta"><span>Série '+s.numeroSerie+'</span>'+
      '<span class="n '+(s.repsRealisees>=s.repsObjectif?'up':'down')+'">'+s.repsRealisees+' / '+s.repsObjectif+
      ' <span style="color:var(--texte-3);font-weight:400">\u00B7 '+mmss(s.effortSec||0)+'</span></span></div>').join('');
    return '<p class="etiquette" style="margin-top:16px">'+esc(e?e.nom:'Exercice supprimé')+'</p>'+
      '<div class="carte">'+lignes+'</div>';
  }).join('');
  const totalReps=(a.series||[]).reduce((n,s)=>n+s.repsRealisees,0);
  return '<button class="retour" data-act="fermer-detail">\u2039 Retour</button>'+
    '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 2px">'+esc(a.nom)+'</h2>'+
    '<p style="color:var(--texte-2);margin:0 0 14px;font-size:13.5px">'+
    new Date(a.debut).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+
    ' \u00B7 '+new Date(a.debut).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</p>'+
    '<div class="carte stat-grille">'+
    [[mmss(a.dureeSec||0),'durée'],[totalReps,'répétitions'],[(a.series||[]).length,'séries']]
      .map(s=>'<div><div class="n">'+s[0]+'</div><div class="l">'+s[1]+'</div></div>').join('')+'</div>'+
    blocs+
    '<button class="bouton danger" style="margin-top:20px" data-suppr-seance-journal="'+a.id+'">'+
    'Supprimer cette séance de l\u2019historique</button>';
}

/* ============================================================
   LOT 7 — CARTOGRAPHIE MUSCULAIRE
   Silhouette schématique face / dos. Chaque forme porte son
   groupe ; la teinte est proportionnelle au volume travaillé.
   ============================================================ */
function teinteVolume(part){
  if(part<=0) return '';                 /* gris de repos, défini en CSS */
  /* du gris de repos vers l'orange plein, en passant par le saumon */
  const p=Math.max(0.12,Math.min(1,Math.pow(part,0.7)));
  const r=Math.round(207+(249-207)*p), g=Math.round(214-(214-78)*p), b=Math.round(224-224*p);
  return 'rgb('+r+','+g+','+b+')';
}

/* Bloc de cartographie, intégré à l'écran Statistiques.
   Plus de sous-menu : la carte est visible d'emblée. */
function blocCartographie(){
  if(!UNITES[uniteCarto]) uniteCarto='reps';
  const sem=Math.max(1,DB.reglages.semainesCarto||4);
  const vol=volumeParGroupe(sem,uniteCarto);
  const max=Math.max(1,...Object.values(vol));
  const unite = uniteCarto==='temps' ? 'min' : 'rép.';
  const classement=Object.keys(GROUPES).map(g=>({g,v:Math.round(vol[g])})).sort((a,b)=>b.v-a.v);
  const travailles=classement.filter(x=>x.v>0);
  const oublies=classement.filter(x=>x.v===0);
  const bU=['reps','temps'].map(u=>
    '<button data-ucarto="'+u+'" aria-selected="'+(uniteCarto===u)+'">'+UNITES[u].lib+'</button>').join('');
  const bS=[2,4,8,12].map(n=>
    '<button data-carto="'+n+'" aria-pressed="'+(sem===n)+'">'+n+' sem.</button>').join('');
  const note = uniteCarto==='temps'
    ? 'Gainage et étirements uniquement, en minutes tenues.'
    : 'Exercices en répétitions uniquement. Gainage et étirements ont leur propre carte, en durée.';
  /* Le détail par groupe était replié derrière un « Détail » : il
     portait pourtant l'essentiel. Il devient un tableau visible,
     enrichi des deux records. */
  const detail = travailles.length
    ? '<p class="etiquette" style="margin-top:16px">Records par groupe \u00B7 '+sem+' semaines</p>'+
      '<div class="carte">'+tableauGroupes(vol,max,sem,uniteCarto)+
      '<p class="aide" style="margin-top:10px">Meilleure s\u00E9rie et charge la plus lourde sur la fen\u00EAtre choisie. '+
      'Un groupe secondaire compte pour moiti\u00E9 : la valeur brute est alors rappel\u00E9e sous le chiffre.</p></div>'
    : '';
  return '<p class="etiquette" style="margin-top:22px">Cartographie musculaire \u00B7 '+sem+' semaines</p>'+
    '<div class="onglets">'+bU+'</div>'+
    '<div class="filtres">'+bS+'</div>'+
    '<div class="carte"><div class="corps" id="corps">'+silhouetteFace()+silhouetteDos()+'</div>'+
    '<div class="echelle"><span>0</span><span class="bande"></span><span>'+Math.round(max)+' '+unite+'</span></div>'+
    '<p class="aide" style="margin-top:8px">Groupe prioritaire compté à 100 %, secondaire à 50 %. '+note+'</p></div>'+
    (oublies.length?'<div class="carte" style="margin-top:10px;border-color:var(--chauffe)">'+
      '<p class="etiquette" style="color:var(--chauffe)">Non sollicités sur la période</p>'+
      '<p style="margin:0;font-size:14px">'+oublies.map(x=>GROUPES[x.g]).join(', ')+'</p></div>':'')+
    detail;
}
/* colorisation, appelée juste après l'insertion dans le DOM */
function colorierCorps(){
  const c=document.getElementById('corps');
  if(!c) return;
  const vol=volumeParGroupe(Math.max(1,DB.reglages.semainesCarto||4),uniteCarto);
  const max=Math.max(1,...Object.values(vol));
  c.querySelectorAll('[data-g]').forEach(el=>{
    const v=vol[el.dataset.g]||0;
    /* volume nul : on laisse la teinte au repos définie en CSS,
       pour que « non travaillé » se distingue de « peu travaillé » */
    el.style.fill = v>0 ? teinteVolume(v/max) : '';
    el.setAttribute('aria-label',GROUPES[el.dataset.g]+' : '+Math.round(v));
  });
}

function exporterSauvegarde(){
  try{
    const blob=new Blob([Store.exporter()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='rhabdo-'+isoJour(new Date())+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast('Sauvegarde exportée.');
  }catch(e){ toast('Export impossible : '+e.message); }
}
function importerSauvegarde(fichier){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      let n=0;
      ['exercices','modeles','planifiees','journal','reglages'].forEach(c=>{
        if(o[c]!=null){ DB[c]=o[c]; DB.sauver(c); n++; }
      });
      DB.charger(); ecranParams=false; rendre();
      toast(n?'Sauvegarde restaurée.':'Fichier vide ou non reconnu.');
    }catch(e){ toast('Fichier illisible : '+e.message); }
  };
  r.onerror=()=>toast('Lecture du fichier impossible.');
  r.readAsText(fichier);
}

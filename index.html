document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-champ]');
  if(el&&edition){
    let v=el.value;
    if(el.dataset.num){ v = v===''?null:parseFloat(v); if(isNaN(v)) v=null; }
    ecrireChemin(edition.data,el.dataset.champ,v);
    return;
  }
  const pc=ev.target.closest('[data-planifchamp]');
  if(pc&&planif){
    const k=pc.dataset.planifchamp;
    planif[k] = (k==='occurrences') ? Math.max(1,Math.min(52,parseInt(pc.value,10)||1)) : pc.value;
    if(k!=='occurrences') rendre();     /* l'aperçu des dates doit suivre */
    else { const n=document.querySelector('.etiquette + .carte');
           if(n) rendre(); }
    return;
  }
  const rg=ev.target.closest('[data-reglage]');
  if(rg){
    const n=parseInt(rg.value,10);
    if(!isNaN(n)&&n>0){ DB.reglages[rg.dataset.reglage]=n; DB.sauver('reglages'); }
  }
});
document.addEventListener('change',ev=>{
  const pc=ev.target.closest('[data-planifchamp]');
  if(pc&&planif){
    planif[pc.dataset.planifchamp]=pc.value; rendre(); return;
  }
  const g=ev.target.closest('[data-groupe]');
  if(g&&edition){
    const arr=edition.data[g.dataset.groupe], i=arr.indexOf(g.value);
    if(g.checked){ if(i<0) arr.push(g.value); } else if(i>=0) arr.splice(i,1);
    return;
  }
  if(ev.target.id==='fichierImport'&&ev.target.files&&ev.target.files[0]){
    importerSauvegarde(ev.target.files[0]);
  }
});

document.addEventListener('click',ev=>{
  const c=s=>ev.target.closest(s);
  try{
    Voix.debloquer();

    /* La fiche en surcouche se ferme avant tout le reste : tant
       qu'elle est ouverte, elle capte ses propres commandes. */
    const fermeRepart=c('[data-act="fermer-repart"]');
    if(fermeRepart){ repartModale=null; rendre(); return; }
    const courbe=c('[data-courbe]');
    if(courbe){ exoCourbe=courbe.dataset.courbe; rendre(); return; }
    const ouvreRepart=c('[data-repart]');
    if(ouvreRepart){ repartModale=ouvreRepart.dataset.repart; rendre(); return; }
    const fermeFiche=c('[data-act="fermer-fiche"]');
    if(fermeFiche){ ficheModale=null; rendre(); return; }
    const ouvreFiche=c('[data-fiche]');
    if(ouvreFiche){ ficheModale=ouvreFiche.dataset.fiche; rendre(); return; }

    /* un muscle touché sur la carte dit ce qu'il a encaissé */
    const mus=c('.corps .mus');
    if(mus && mus.dataset && mus.dataset.g){
      const g=mus.dataset.g;
      const sem=Math.max(1,DB.reglages.semainesCarto||4);
      const v=Math.round(volumeParGroupe(sem,uniteCarto)[g]||0);
      const r=recordsParGroupe(sem,uniteCarto)[g];
      const u=uniteCarto==='temps'?'min':'rép.';
      toast(GROUPES[g]+' \u00B7 '+v+' '+u+' sur '+sem+' semaines'+
        (r&&r.charge>0?' \u00B7 charge max '+nbCourt(r.charge)+' kg':''));
      return;
    }

    /* verrou des groupes musculaires, dans l'éditeur d'exercice */
    if(c('[data-act="verrou-zones"]') && edition){
      edition.zonesOuvertes=!edition.zonesOuvertes; rendre(); return; }
    if(c('[data-act="zones-defaut"]') && edition){
      const ref=zonesDOrigine(edition.data.id);
      if(ref){ edition.data.zone1=ref.zone1.slice(); edition.data.zone2=ref.zone2.slice();
        toast('Groupes musculaires d\u2019origine restaur\u00E9s.'); rendre(); }
      return; }

    const onglet=c('#barre button');
    if(onglet){ ecranParams=false; detailSeanceId=null; jourSelectionne=null; planif=null;
      vueSpecialeHisto=false; ficheModale=null; repartModale=null;
      aller(onglet.dataset.onglet); return; }

    /* --- détail d'une séance réalisée --- */
    const det=c('[data-detail]');
    if(det){ detailSeanceId=det.dataset.detail; ecranParams=false; rendre(); return; }

    /* --- bibliothèque --- */
    const sous=c('[data-sous]'); if(sous){ sousOnglet=sous.dataset.sous; filtreBiblio='tous'; rendre(); return; }
    const f=c('[data-filtre]'); if(f){ filtreBiblio=f.dataset.filtre; rendre(); return; }
    if(c('[data-nouvel-exo]')){ ouvrirExo(null); return; }
    if(c('[data-nouvelle-seance]')){ ouvrirSeance(null); return; }
    const ee=c('[data-editer-e]'); if(ee){ ouvrirExo(ee.dataset.editerE); return; }
    const es=c('[data-editer-s]'); if(es){ ouvrirSeance(es.dataset.editerS); return; }

    /* --- statistiques --- */
    const pe=c('[data-periode]'); if(pe){ periodeCharge=pe.dataset.periode; rendre(); return; }
    const fc=c('[data-fcharge]'); if(fc){ filtreCharge=fc.dataset.fcharge; rendre(); return; }
    const fh=c('[data-fhisto]'); if(fh){ filtreHisto=fh.dataset.fhisto; limiteHisto=25; rendre(); return; }
    const sj=c('[data-suppr-seance-journal]');
    if(sj){
      if(!confirm('Supprimer définitivement cette séance de l’historique ?')) return;
      DB.journal=DB.journal.filter(x=>x.id!==sj.dataset.supprSeanceJournal);
      DB.sauver('journal'); detailSeanceId=null; rendre(); toast('Séance supprimée.'); return;
    }
    const pm=c('[data-pmode]'); if(pm&&planif){ planif.mode=pm.dataset.pmode; rendre(); return; }
    const pj=c('[data-pjour]');
    if(pj&&planif){
      const j=+pj.dataset.pjour, i=planif.jours.indexOf(j);
      if(i>=0) planif.jours.splice(i,1); else planif.jours.push(j);
      rendre(); return;
    }
    const un=c('[data-unite]');
    if(un && UNITES[un.dataset.unite]){ uniteCharge=un.dataset.unite;
      /* les étirements n'existent qu'en durée : on ne laisse pas un filtre orphelin */
      if(uniteCharge==='reps'&&filtreCharge==='etirement') filtreCharge='tous';
      rendre(); return; }
    const uc=c('[data-ucarto]');
    if(uc && UNITES[uc.dataset.ucarto]){ uniteCarto=uc.dataset.ucarto; rendre(); return; }
    const ca=c('[data-carto]');
    if(ca){ DB.reglages.semainesCarto=+ca.dataset.carto; DB.sauver('reglages'); rendre(); return; }

    /* --- calendrier --- */
    const mo=c('[data-mois]');
    if(mo){ if(!moisAffiche) moisAffiche=new Date();
      moisAffiche=new Date(moisAffiche.getFullYear(),moisAffiche.getMonth()+(+mo.dataset.mois),1);
      rendre(); return; }
    const jo=c('[data-jour]');
    if(jo){ const d=new Date(jo.dataset.jour+'T12:00:00');
      jourSelectionne=(jourSelectionne&&memeJour(jourSelectionne,d))?null:d; rendre(); return; }
    const dc=c('[data-decaler]');
    if(dc){ const p=DB.planifiees.find(x=>x.id===dc.dataset.decaler);
      if(p){ const d=new Date(p.date); d.setDate(d.getDate()+(+dc.dataset.n)); p.date=d.toISOString();
        DB.sauver('planifiees'); rendre(); toast('Reportée au '+d.toLocaleDateString('fr-FR')+'.'); }
      return; }
    const dp=c('[data-dupliquer-p]');
    if(dp){ const p=DB.planifiees.find(x=>x.id===dp.dataset.dupliquerP);
      if(p){ const d=new Date(p.date); d.setDate(d.getDate()+7);
        DB.planifiees.push({id:uid(),modeleId:p.modeleId,nom:p.nom,date:d.toISOString(),statut:'planifiee'});
        DB.sauver('planifiees'); rendre(); toast('Dupliquée à la semaine suivante.'); }
      return; }
    const sp=c('[data-suppr-p]');
    if(sp){ DB.planifiees=DB.planifiees.filter(x=>x.id!==sp.dataset.supprP);
      DB.sauver('planifiees'); rendre(); return; }
    const rp=c('[data-reporter]');
    if(rp){ const p=DB.planifiees.find(x=>x.id===rp.dataset.reporter);
      if(p){ const d=new Date(p.date); d.setDate(d.getDate()+1); p.date=d.toISOString();
        DB.sauver('planifiees'); rendre(); toast('Reportée d’un jour.'); } return; }
    const pl=c('[data-planifier]');
    if(pl){ ouvrirPlanificateur(pl.dataset.planifier); return; }

    /* --- réglages en séance (± écartement, hauteur, lestage) --- */
    const reg=c('[data-reg]');
    if(reg){ Seance.ajusterReglage(reg.dataset.reg,parseFloat(reg.dataset.pas),reg); return; }

    /* --- durée en minutes + secondes, secondes bornées à 59 --- */
    const du=c('[data-duree]');
    if(du&&edition){
      const ch=du.dataset.duree, pas=parseFloat(du.dataset.pas);
      const total=Math.max(0,parseInt(lireChemin(edition.data,ch),10)||0);
      let m=Math.floor(total/60), sec=total%60;
      if(du.dataset.part==='min') m=Math.max(0,m+pas);
      else { sec+=pas; if(sec>59) sec=0; if(sec<0) sec=55; }
      const nouveau=Math.max(1,m*60+sec);
      ecrireChemin(edition.data,ch,nouveau);
      rendre(); return;
    }
    /* --- incréments dans l'éditeur de séance --- */
    const inc=c('[data-inc]');
    if(inc&&edition){
      const ch=inc.dataset.inc, pas=parseFloat(inc.dataset.pas), min=parseFloat(inc.dataset.min)||0;
      const v=Math.max(min,(parseFloat(lireChemin(edition.data,ch))||0)+pas);
      ecrireChemin(edition.data,ch,v);
      if(/lestageKg$/.test(ch) && v===0) ecrireChemin(edition.data,ch,null);
      const n=inc.parentNode.querySelector('.v');
      if(n) n.textContent = (/lestageKg$/.test(ch) && v===0)
        ? 'Poids du corps' : v+' '+(inc.dataset.suffixe||'');
      return;
    }
    const bm=c('[data-bloc-monter]'); if(bm&&edition){ const i=+bm.dataset.blocMonter,a=edition.data.blocs;
      a.splice(i-1,0,a.splice(i,1)[0]); rendre(); return; }
    const bd=c('[data-bloc-descendre]'); if(bd&&edition){ const i=+bd.dataset.blocDescendre,a=edition.data.blocs;
      a.splice(i+1,0,a.splice(i,1)[0]); rendre(); return; }
    const bu=c('[data-bloc-dupliquer]'); if(bu&&edition){ const i=+bu.dataset.blocDupliquer,a=edition.data.blocs;
      a.splice(i+1,0,JSON.parse(JSON.stringify(a[i]))); rendre(); return; }
    const bx=c('[data-bloc-suppr]'); if(bx&&edition){ edition.data.blocs.splice(+bx.dataset.blocSuppr,1); rendre(); return; }

    /* --- bascules de paramètres --- */
    const ba=c('[data-bascule]');
    if(ba){ const k=ba.dataset.bascule;
      DB.reglages[k]=(DB.reglages[k]===false);
      DB.sauver('reglages'); rendre(); return; }

    const go=c('[data-go]');
    if(go){ const m=DB.modele(go.dataset.go); if(m){ ecranParams=false; detailSeanceId=null; Seance.demarrer(m); } return; }

    const act=c('[data-act]');
    if(act){
      switch(act.dataset.act){
        case 'lancer-chauffe': Seance.lancerEchauffement(); break;
        case 'finChauffe':     Seance.finEchauffement(true); break;
        case 'demarrer':       Seance.demarrerSerie(); break;
        case 'enchainer':      Seance.avancerEtDemarrer(); break;
        case 'finSerie':       Seance.terminerSerie(); break;
        case 'finValider':     Seance.terminerEtValider(); break;
        case 'reps+':          Seance.ajusterReps(1); break;
        case 'reps-':          Seance.ajusterReps(-1); break;
        case 'valider':        Seance.validerSerie(); break;
        case 'pause':          Chrono.basculerPause(); rendre(); break;
        case 'passer':         Seance.passerRecup(); break;
        case 'passer-exo':     Seance.passerExercice(); break;
        case 'commencer':      Seance.commencerApresAnnonce(); break;
        case 'terminer':
          if(!Seance.active.series.length){ Seance.abandonner(); toast('Séance annulée.'); }
          else Seance._terminer();
          break;
        case 'retour':         Seance.active=null; rendre(); break;
        case 'annuler-edition':edition=null; rendre(); break;
        case 'sauver-exo':     sauverExo(); break;
        case 'sauver-seance':  sauverSeance(); break;
        case 'plus-semaines':  semainesJournal+=3; rendre(); break;
        case 'histo':          vueSpecialeHisto=true; limiteHisto=25; rendre(); break;
        case 'fermer-histo':   vueSpecialeHisto=false; rendre(); break;
        case 'plus-histo':     limiteHisto+=25; rendre(); break;
        case 'fermer-params':  ecranParams=false; rendre(); break;
        case 'fermer-detail':  detailSeanceId=null; rendre(); break;
        case 'exporter':       exporterSauvegarde(); break;
        case 'importer': {
          const f=document.getElementById('fichierImport');
          if(f) f.click(); break;
        }
        case 'ouvrir-planif':  ouvrirPlanificateur(''); break;
        case 'fermer-planif':  planif=null; rendre(); break;
        case 'valider-planif': {
          if(!planif.modeleId){ toast('Choisis d’abord une séance.'); break; }
          const m=DB.modele(planif.modeleId);
          const dates=datesPlanifiees(planif);
          if(!dates.length){ toast('Aucune date à ajouter.'); break; }
          dates.forEach(d=>DB.planifiees.push({id:uid(),modeleId:m.id,nom:m.nom,
            date:d.toISOString(),statut:'planifiee'}));
          DB.sauver('planifiees');
          jourSelectionne=dates[0]; moisAffiche=new Date(dates[0]); planif=null;
          ongletCourant='planif'; rendre();
          toast(dates.length>1 ? dates.length+' séances ajoutées au calendrier.'
                               : 'Séance ajoutée au '+dates[0].toLocaleDateString('fr-FR')+'.');
          break;
        }
        case 'ajouter-bloc': {
          const sel=document.getElementById('choixExo');
          if(!sel||!sel.value){ toast('Choisis d’abord un exercice.'); break; }
          const exo=DB.exercice(sel.value);
          edition.data.blocs.push({exerciceId:exo.id,nbSeries:exo.objSeries||4,nbReps:exo.objReps||10,
            recupSerieSec:60,recupFinSec:120,repsInitiales:null});
          rendre(); break;
        }
        case 'suppr-exo': {
          const d=edition.data, u=DB.modelesUtilisant(d.id);
          if(u.length){ toast('Impossible : utilisé dans '+u.map(m=>m.nom).join(', ')+'.'); break; }
          DB.exercices=DB.exercices.filter(x=>x.id!==d.id);
          DB.sauver('exercices'); edition=null; rendre(); toast('Exercice supprimé.'); break;
        }
        case 'suppr-seance': {
          const d=edition.data;
          DB.modeles=DB.modeles.filter(x=>x.id!==d.id);
          DB.planifiees=DB.planifiees.filter(p=>p.modeleId!==d.id);
          DB.sauver('modeles'); DB.sauver('planifiees');
          edition=null; sousOnglet='seances'; rendre(); toast('Séance supprimée.'); break;
        }
        case 'oublier-panne': dernierePanne=null; rendre(); break;
        case 'reset':
          if(!confirm('Effacer définitivement tous les exercices, séances et l’historique ?')) break;
          Store.toutEffacer(); Seance.active=null; edition=null; dernierePanne=null;
          ecranParams=false; detailSeanceId=null;
          DB.charger(); ongletCourant='seance'; rendre(); toast('Données réinitialisées.'); break;
      }
      return;
    }
    if(c('#btnParams')){ ecranParams=true; detailSeanceId=null; edition=null; rendre(); return; }
    if(c('#btnProfil')){ ecranParams=true; detailSeanceId=null; edition=null; rendre(); return; }
  }catch(err){ noterPanneSansBoucle(err); rendre(); }
});

/* ============================================================
   DÉMARRAGE
   ============================================================ */
/* Le mode « écran d'accueil » n'existe que pour une page servie en
   http(s). Sur un fichier ouvert localement (file://), iOS ne propose
   pas l'option et refuse les service workers : on n'essaie même pas. */
const SERVI = location.protocol==='http:' || location.protocol==='https:';
if(SERVI && 'serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}

DB.charger();
Voix.init();
if(Seance.reprendre()){
  ongletCourant='seance';
  setTimeout(()=>toast('Séance reprise là où tu l’avais laissée.'),400);
}
rendre();
if(!Store.dispo){
  const b=document.getElementById('bandeau');
  b.style.display='block';
  b.textContent='Stockage bloqué dans cette fenêtre : rien ne sera conservé à la fermeture. Ouvre le fichier directement dans Safari pour que tes séances soient enregistrées.';
}
</script>

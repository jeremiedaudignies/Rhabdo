/* ============================================================
   RHABDO — jetons de conception
   Fond clair, cartes blanches, une seule couleur de signal
   orange. Bascule automatique en sombre la nuit : une app de
   salle ne doit pas éblouir.
   ============================================================ */
:root{
  --fond:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF3; --filet:#E1E5EA;
  --texte:#14171C; --texte-2:#5F6A7B; --texte-3:#9AA3B2;
  --accent:#F94E00; --accent-doux:#FFEDE4;
  --effort:#F94E00; --recup:#00A08C; --chauffe:#F2A104; --planifie:#4C63D6;
  --haut:#4C63D6; --bas:#E07B00; --abdo:#00A08C; --mixte:#8B4FD6; --etirement:#0088A8;
  --ombre:0 1px 2px rgba(20,23,28,.06), 0 4px 14px rgba(20,23,28,.05);
  --corps:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--fond);color-scheme:light;color:var(--texte);font-family:var(--corps);font-size:16px;
  line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--texte);background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-s);padding:11px 12px;width:100%;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-doux)}
/* La coche est peinte en fond plutôt qu'en ::after : les pseudo-
   éléments sur un <input> ne sont pas fiables d'un navigateur à
   l'autre, une image de fond l'est partout. */
input[type="checkbox"]{width:24px;height:24px;flex:0 0 auto;padding:0;border-radius:7px;
  border:1.5px solid var(--filet);background:var(--surface);cursor:pointer;
  transition:background-color .15s,border-color .15s}
input[type="checkbox"]:checked{border-color:var(--accent);background-color:var(--accent);
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round' d='M3.2 8.4l3.4 3.4L12.8 5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:center;background-size:15px 15px}

#app{display:flex;flex-direction:column;height:100dvh}
#entete{flex:0 0 auto;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;
  gap:12px;background:var(--surface);border-bottom:1px solid var(--filet)}
#entete .glyphe{width:36px;height:36px;flex:0 0 auto;border-radius:var(--r-s);background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
#entete .titres{flex:1;min-width:0}
#entete .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
#entete h1{margin:0;font-weight:800;font-size:19px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#entete .actions{display:flex;gap:6px}
#entete .actions button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px}
#vue{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
#barre{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  border-top:1px solid var(--filet);padding-bottom:var(--safe-b)}
#barre button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--texte-3);transition:color .15s}
#barre button .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.55)}
#barre button .lb{font-size:10px;font-weight:600;letter-spacing:.01em}
#barre button[aria-current="page"]{color:var(--accent)}
#barre button[aria-current="page"] .ic{filter:none}

.etiquette{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texte-3);font-weight:600;margin:0 0 8px}
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  box-shadow:var(--ombre)}
.pastille{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--texte-2)}
.pastille.haut{color:var(--haut)} .pastille.bas{color:var(--bas)} .pastille.abdo{color:var(--abdo)}
.pastille.mixte{color:var(--mixte)} .pastille.etirement{color:var(--etirement)}
.repart{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}
.repart .col{display:flex;flex-direction:column;gap:4px;min-width:0}
.repart .tete{display:block;font-size:8.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:var(--texte-3);padding-bottom:5px;
  border-bottom:1px solid var(--filet);margin-bottom:2px}
.repart .tete b{display:block;font-size:14px;line-height:1.15;margin-top:3px;color:var(--texte);
  font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.repart .p{font-size:10.5px;font-weight:600;color:var(--texte-2);background:var(--surface-2);
  border-radius:99px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.repart .p b{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums}
.repart .p.muet{background:none;color:var(--texte-3);padding-left:2px}
.item .cmds .ellipse{margin-left:auto;min-width:46px;padding:9px 12px;font-size:17px;line-height:1;
  letter-spacing:.06em;font-weight:800;color:var(--texte-3)}
.detail-tab .l{display:grid;grid-template-columns:1fr 52px;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--filet)}
.detail-tab .l:last-child{border-bottom:0}
.detail-tab .nm{font-size:13.5px;font-weight:700;min-width:0}
.detail-tab .barre{height:6px;border-radius:99px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.detail-tab .barre i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.detail-tab .pc{text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.detail-tab .src{font-size:11px;color:var(--texte-3);font-weight:500}
.detail-exos .l{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--filet);font-size:13px}
.detail-exos .l:last-child{border-bottom:0}
.detail-exos .q{font-variant-numeric:tabular-nums;font-weight:700;color:var(--texte-2);white-space:nowrap}
.detail-exos .z{display:block;font-size:11px;color:var(--texte-3);font-weight:500}
.bouton{display:block;width:100%;padding:16px;border-radius:99px;background:var(--surface-2);
  font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .08s,filter .15s}
.bouton:active{transform:scale(.98)}
.bouton.principal{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(249,78,0,.28)}
.bouton.effort{background:var(--effort);color:#fff}
.bouton.recup{background:var(--recup);color:#fff}
.bouton.chauffe{background:var(--chauffe);color:#231603}
.bouton.discret{background:transparent;border:1.5px solid var(--filet);color:var(--texte-2);
  font-weight:600;font-size:14.5px;padding:13px}
.bouton.danger{background:transparent;border:1.5px solid var(--effort);color:var(--effort);
  font-weight:600;font-size:14.5px;padding:13px}
.vide{text-align:center;padding:52px 20px;color:var(--texte-2)}
.vide .gros{font-size:38px;margin-bottom:12px}
.vide p{margin:0 0 4px}

/* --- séance en cours --- */
.fil{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;
  color:var(--texte-2);margin-bottom:7px}
.jauge{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.jauge i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cadran{position:relative;width:min(72vw,264px);margin:0 auto 18px;aspect-ratio:1}
.cadran svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.cadran .piste{fill:none;stroke:var(--surface-2);stroke-width:9}
.cadran .arc{fill:none;stroke:var(--texte-3);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:552.9;transition:stroke .3s}
.cadran.effort .arc{stroke:var(--effort)}
.cadran.recup .arc{stroke:var(--recup)}
.cadran.chauffe .arc{stroke:var(--chauffe)}
.cadran .noyau{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px}
.cadran .mode{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-3)}
.cadran.effort .mode{color:var(--effort)} .cadran.recup .mode{color:var(--recup)}
.cadran.chauffe .mode{color:var(--chauffe)}
.cadran .chiffres{font-family:var(--mono);font-weight:700;font-size:clamp(40px,14vw,58px);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.cadran .sous{font-size:12px;color:var(--texte-3);font-weight:500}
@keyframes souffle{0%,100%{opacity:1}50%{opacity:.45}}
.cadran.alerte .chiffres{animation:souffle .5s ease-in-out infinite}
.exo-nom{font-weight:800;font-size:24px;letter-spacing:-.025em;margin:0 0 3px}
.exo-meta{font-size:13px;color:var(--texte-2);margin:0}
.compteur{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 4px}
.compteur button{width:58px;height:58px;border-radius:50%;background:var(--surface-2);font-size:26px;
  font-weight:600;display:grid;place-items:center}
.compteur button:active{background:var(--filet)}
.compteur .val{font-family:var(--mono);font-weight:700;font-size:54px;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.compteur .val.sous-objectif{color:var(--bas)} .compteur .val.sur-objectif{color:var(--recup)}
.rappel-obj{text-align:center;font-size:11.5px;color:var(--texte-3);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;margin:0}
details.reglages{margin-top:12px;border:1px solid var(--filet);border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--ombre);overflow:hidden}
details.reglages summary{padding:14px 15px;font-size:13px;font-weight:600;color:var(--texte-2);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details.reglages summary::-webkit-details-marker{display:none}
details.reglages summary::after{content:"+";font-size:18px;color:var(--texte-3)}
details.reglages[open] summary::after{content:"\2013"}
.reglage{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--filet)}
.reglage .nom{flex:1;font-size:14px;color:var(--texte-2)}
.reglage .pas{display:flex;align-items:center;gap:8px}
.reglage .pas button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:17px;font-weight:600}
.reglage .pas .v{font-family:var(--mono);font-weight:600;font-size:15px;min-width:62px;text-align:center;
  font-variant-numeric:tabular-nums}
.suite{margin-top:12px;padding:13px 15px;border-radius:var(--r-m);background:var(--surface-2);
  color:var(--texte-2);font-size:13.5px;display:flex;align-items:center;gap:11px}
.suite > span{flex:1;min-width:0}
.suite .picto{background:var(--surface)}
.suite b{color:var(--texte);font-weight:700}
.zone-action{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.rangee{display:flex;gap:9px}
.rangee > *{flex:1}

/* --- listes et bibliothèque --- */
.item{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  margin-bottom:10px;box-shadow:var(--ombre)}
.item h3{margin:0 0 3px;font-weight:700;font-size:17px;letter-spacing:-.015em}
.item .quand{font-size:12.5px;color:var(--texte-2)}
.item .cmds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.item .cmds button{padding:9px 14px;border-radius:99px;background:var(--surface-2);font-size:12.5px;
  font-weight:600;color:var(--texte-2)}
.item .cmds button.go{background:var(--accent);color:#fff}
.onglets{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:99px;margin-bottom:14px}
.onglets button{flex:1;padding:10px;border-radius:99px;font-size:14px;font-weight:600;color:var(--texte-2)}
.onglets button[aria-selected="true"]{background:var(--surface);color:var(--texte);box-shadow:var(--ombre)}
.filtres{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--surface);
  border:1px solid var(--filet);font-size:13px;font-weight:600;color:var(--texte-2);white-space:nowrap}
.filtres button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ligne{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-m);margin-bottom:8px;box-shadow:var(--ombre)}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-weight:600;font-size:15px;letter-spacing:-.01em}
.ligne .txt span{font-size:12px;color:var(--texte-2)}
.ligne .fleche{color:var(--texte-3);font-size:18px}
.ajout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border-radius:var(--r-m);border:1.5px dashed var(--filet);color:var(--accent);font-weight:700;
  font-size:15px;margin-bottom:14px}

/* --- formulaires --- */
.champ{margin-bottom:14px}
.champ > label{display:block;font-size:12.5px;font-weight:600;color:var(--texte-2);margin-bottom:6px}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:9px}
.puces{display:flex;flex-wrap:wrap;gap:7px}
.puces label{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:99px;
  background:var(--surface);border:1px solid var(--filet);font-size:13.5px;font-weight:500;cursor:pointer}
.puces input{display:none}
.puces input:checked + span{color:var(--accent);font-weight:700}
.puces label:has(input:checked){border-color:var(--accent);background:var(--accent-doux)}
.zones-bloquees .puces label{opacity:.5}
.zones-bloquees .puces label:has(input:checked){opacity:1}
.tete-section{display:flex;align-items:center;gap:10px;margin:18px 0 8px}
.tete-section .etiquette{flex:1;min-width:0}
.mini-actions{display:flex;gap:6px;flex:0 0 auto}
.mini-actions button{border:1px solid var(--filet);background:var(--surface);color:var(--texte-2);
  font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:99px;cursor:pointer;white-space:nowrap}
.mini-actions button[aria-pressed="false"]{border-color:var(--accent);color:var(--accent);
  background:var(--accent-doux)}
.mini-actions button:active{transform:scale(.96)}
.bloc-exo{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);
  padding:14px;margin-bottom:10px;box-shadow:var(--ombre)}
.bloc-exo .tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bloc-exo .tete b{flex:1;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.bloc-exo .mini{display:flex;gap:5px}
.bloc-exo .mini button{width:32px;height:32px;border-radius:var(--r-s);background:var(--surface-2);
  font-size:13px;display:grid;place-items:center}
.aide{font-size:12px;color:var(--texte-3);margin:5px 0 0;line-height:1.4}
.barre-form{display:flex;gap:9px;margin-top:18px;position:sticky;bottom:0;
  padding:12px 0 4px;background:linear-gradient(to top,var(--fond) 70%,transparent)}
.barre-form > *{flex:1}

.rappel{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 76px);background:var(--texte);
  color:var(--fond);border-radius:var(--r-m);padding:14px 16px;font-size:14px;font-weight:500;z-index:60;
  box-shadow:0 12px 32px rgba(0,0,0,.28);animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#bandeau{display:none;padding:11px 16px;background:#FFF4E0;border-bottom:1px solid #F0D9A8;
  font-size:12.5px;color:#7A5200;line-height:1.35}

.panne{border:1.5px solid var(--effort);border-radius:var(--r-m);padding:16px;background:var(--accent-doux)}
.panne h2{margin:0 0 6px;font-size:17px;font-weight:800}
.panne pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;
  margin:8px 0 12px;max-height:150px;overflow:auto;color:var(--effort)}

/* --- ajouts lots 5 à 8 --- */
.cadran .serie{font-family:var(--mono);font-weight:700;font-size:clamp(20px,7vw,29px);
  color:var(--texte);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.saisie-rangee{display:flex;align-items:stretch;justify-content:center;gap:9px;margin:8px 0 4px}
.objectif-box{flex:0 0 auto;width:86px;border-radius:var(--r-m);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px}
.objectif-box .lb{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-3)}
.objectif-box .nb{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--texte-2)}
.saisie-rangee .rond{flex:0 0 auto;width:56px;border-radius:var(--r-m);background:var(--surface-2);
  font-size:26px;font-weight:600;display:grid;place-items:center}
.saisie-rangee .rond:active{background:var(--filet)}
.saisie-rangee .val{flex:1;min-width:0;border-radius:var(--r-m);background:var(--accent-doux);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:40px;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;padding:10px 4px}
.saisie-rangee .val.sous-objectif{color:var(--bas)} .saisie-rangee .val.sur-objectif{color:var(--recup)}

.stat-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
.stat-grille .n{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.stat-grille .l{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texte-3);margin-top:3px}
.serie-active{display:flex;align-items:baseline;gap:10px}
.serie-active .gros{font-family:var(--mono);font-weight:700;font-size:46px;letter-spacing:-.04em;color:var(--accent)}
.serie-active .txt{font-size:13.5px;color:var(--texte-2);line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .jn{text-align:center;font-size:10.5px;font-weight:700;color:var(--texte-3);padding-bottom:2px}
.cal .jour{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:13px;font-weight:600;background:transparent;color:var(--texte)}
.cal .jour.hors{color:var(--texte-3);opacity:.4}
.cal .jour.auj{background:var(--accent-doux);color:var(--accent);font-weight:800}
.cal .jour .pt{width:7px;height:7px;border-radius:50%}
.cal .jour .pt.fait{background:var(--accent)} .cal .jour .pt.prev{border:2px solid var(--planifie)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-nav button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:15px}
.graph{width:100%;height:auto;display:block;overflow:visible}
.graph .axe{stroke:var(--filet);stroke-width:1}
.graph .gril{stroke:var(--filet);stroke-width:.5;stroke-dasharray:2 3}
.graph .lb{font-size:9px;fill:var(--texte-3);font-family:var(--corps)}
.graph .pt{fill:var(--accent)}
.graph .courbe{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.graph .aire{fill:var(--accent);opacity:.1}
.histo{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;
  height:118px;position:relative;margin-top:14px}
.histo .hb{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.histo .hb i{display:block;width:100%;min-height:3px;border-radius:4px 4px 0 0;background:var(--accent)}
.histo .hb.vide i{background:var(--filet)}
.histo .hb .v{font-size:10.5px;font-weight:800;line-height:1;margin-bottom:3px;color:var(--texte-2)}
.histo .cible{position:absolute;left:0;right:0;border-top:1px dashed var(--recup);pointer-events:none}
.histo .cible b{position:absolute;right:0;top:-13px;font-size:9px;font-weight:700;color:var(--recup);
  letter-spacing:.03em}
.chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 12px;
  padding-bottom:2px;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;padding:7px 12px;border-radius:99px;background:var(--surface-2);
  color:var(--texte-2);font-size:12px;font-weight:600;white-space:nowrap}
.chips button.on{background:var(--accent);color:#fff}
.courbe{width:100%;max-width:100%;height:auto;display:block;margin-top:10px;aspect-ratio:320/150}
.courbe .grille line{stroke:#E1E5EA;stroke-width:1}
.courbe .grille text{fill:#9AA3B2;font-size:9px;font-family:var(--mono)}
.courbe .aire{fill:#FFEDE4}
.courbe .trait{fill:none;stroke:#F94E00;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.courbe .pts circle{fill:#FFFFFF;stroke:#F94E00;stroke-width:2}
.courbe .axe text{fill:#9AA3B2;font-size:9px;font-family:var(--mono)}
.histo-lb{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:6px}
.histo-lb span{font-size:9px;color:var(--texte-3);text-align:center;font-variant-numeric:tabular-nums}
.bulles{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:center;margin:6px 0}
.bulle{aspect-ratio:1;display:grid;place-items:center}
.bulle i{display:block;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;
  font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.bulle.vide i{background:var(--filet);width:5px;height:5px}
.semaine-lg{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
  color:var(--texte-2);margin-top:2px}
.delta{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
  border-top:1px solid var(--filet);font-size:14px}
.delta:first-of-type{border-top:none}
.delta .n{font-family:var(--mono);font-weight:700;font-size:15px}
.delta .up{color:var(--recup)} .delta .down{color:var(--effort)} .delta .flat{color:var(--texte-3)}
.corps{display:flex;align-items:flex-start;gap:10px}
.vue-corps{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.corps svg{width:100%;height:auto;aspect-ratio:200/470;display:block}
.corps .lg{display:block;text-align:center;font-size:11.5px;font-weight:700;color:var(--texte-3);margin-top:4px}
/* Teintes fixes et contrastées : un muscle au repos doit rester
   parfaitement lisible sur la carte blanche, même sans données. */
.corps .silhouette{fill:#E9ECF1;stroke:#C3CAD6;stroke-width:1.5;stroke-linejoin:round}
.corps .mus{fill:#AEB8C8;stroke:#FFFFFF;stroke-width:1.3;stroke-linejoin:round;
  transition:fill .35s;cursor:pointer}
.corps .stri{fill:none;stroke:#FFFFFF;stroke-width:1.1;opacity:.8;stroke-linecap:round}
.echelle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--texte-3)}
.echelle .bande{flex:1;height:9px;border-radius:99px;
  background:linear-gradient(90deg,var(--surface-2),#FFD9C4,#FF9A5E,var(--accent))}
.picto{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--accent-doux);
  color:var(--accent);display:grid;place-items:center;overflow:hidden}
.picto svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:5.2;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.picto svg .t{fill:currentColor;stroke:none}
.picto svg .sol{stroke-width:3;opacity:.28}
.picto svg .equip{stroke-width:4;opacity:.65}
.picto svg .mvt{stroke-width:3.4;opacity:.55}
.picto.mini{width:34px;height:34px;border-radius:9px}
.picto.mini svg{width:28px;height:28px}
.picto.grand{width:64px;height:64px;border-radius:16px}
.picto.grand svg{width:52px;height:52px}
.picto.photo{background:#fff;box-shadow:inset 0 0 0 1px var(--filet)}
.picto.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 52%;display:block}
button.picto{padding:0;border:0;cursor:pointer;position:relative}
button.picto::after{content:'';position:absolute;right:2px;bottom:2px;width:13px;height:13px;
  border-radius:99px;background:var(--accent);opacity:.9;
  box-shadow:0 0 0 2px var(--surface)}
button.picto.mini::after{width:11px;height:11px}
.picto.anim{position:relative}
.picto.anim img{position:absolute;inset:0}
.picto.anim .phase-1{animation:vign1 6s ease-in-out infinite}
.picto.anim .phase-2{animation:vign2 6s ease-in-out infinite}
@keyframes vign1{0%,40%{opacity:1}48%,90%{opacity:0}98%,100%{opacity:1}}
@keyframes vign2{0%,40%{opacity:0}48%,90%{opacity:1}98%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .picto.anim .phase-1,.picto.anim .phase-2{animation:none}
  .picto.anim .phase-2{opacity:0}
}
.modale{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modale-fond{position:absolute;inset:0;background:rgba(20,23,28,.42);backdrop-filter:blur(2px)}
.modale-feuille{position:relative;width:100%;max-width:560px;max-height:88dvh;display:flex;
  flex-direction:column;background:var(--fond);border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(20,23,28,.22);animation:monte .22s ease-out}
@keyframes monte{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.modale-tete{display:flex;align-items:center;gap:10px;padding:16px 16px 10px;
  border-bottom:1px solid var(--filet)}
.modale-tete .exo-nom{margin:0}
.modale-corps{overflow:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 4px;flex:1}
.modale-pied{padding:12px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--filet);
  background:var(--fond);border-radius:0 0 0 0;flex:0 0 auto}
.chrono-chip{flex:0 0 auto;font-size:12px;font-weight:700;letter-spacing:.02em;
  padding:6px 10px;border-radius:99px;background:var(--accent-doux);color:var(--accent);
  white-space:nowrap;font-variant-numeric:tabular-nums}
.chrono-chip.recup{background:#E1F5F1;color:var(--recup)}
.modale-tete .rond{flex:0 0 auto;width:36px;height:36px;border-radius:99px;border:0;
  background:var(--surface-2);color:var(--texte-2);font-size:20px;line-height:1;cursor:pointer}
.modale-tete .rond:active{transform:scale(.94)}
.groupes-tab{margin-top:12px;border-top:1px solid var(--filet)}
.groupes-tab .gl{display:grid;grid-template-columns:1fr 64px 74px;align-items:center;gap:8px;
  padding:9px 0;border-bottom:1px solid var(--filet)}
.groupes-tab .gl:last-child{border-bottom:0}
.groupes-tab .nm{font-size:13.5px;font-weight:700;min-width:0}
.groupes-tab .barre-g{height:6px;border-radius:99px;background:var(--surface-2);margin-top:5px;overflow:hidden}
.groupes-tab .barre-g i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.groupes-tab .vv{text-align:right;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.groupes-tab .vv small{display:block;font-size:10.5px;font-weight:600;color:var(--texte-3);
  letter-spacing:.02em;text-transform:uppercase}

<script>
"use strict";

/* ============================================================
   0. FILET DE SÉCURITÉ
   ============================================================ */
let dernierePanne = null;
function noterPanne(err){
  dernierePanne = (err && err.message ? err.message : String(err)) + '\n' +
    (err && err.stack ? (err.stack.split('\n')[1] || '') : '');
  try{ rendre(); }catch(e){}
}
window.addEventListener('error', e => {
  dernierePanne = (e.message||'Erreur inconnue') + '\n' + (e.filename||'') + ':' + (e.lineno||'');
  try{ rendre(); }catch(_){}
});
window.addEventListener('unhandledrejection', e => {
  dernierePanne = 'Promesse rejetée : ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});

/* ============================================================
   1. STOCKAGE
   ============================================================ */
const Store = (() => {
  const P='rhabdo_v1_', memoire={};
  let dispo=true;
  try{ localStorage.setItem(P+'t','1'); localStorage.removeItem(P+'t'); }catch(e){ dispo=false; }
  return {
    get dispo(){ return dispo; },
    lire(cle,defaut){
      try{
        const brut = dispo ? localStorage.getItem(P+cle) : memoire[cle];
        return brut==null ? defaut : JSON.parse(brut);
      }catch(e){ return defaut; }
    },
    ecrire(cle,val){
      const brut=JSON.stringify(val);
      try{ dispo ? localStorage.setItem(P+cle,brut) : (memoire[cle]=brut); }catch(e){ memoire[cle]=brut; }
    },
    effacer(cle){ try{ dispo ? localStorage.removeItem(P+cle) : delete memoire[cle]; }catch(e){} },
    toutEffacer(){ ['exercices','modeles','planifiees','journal','reglages','seanceEnCours']
      .forEach(c=>this.effacer(c)); },
    exporter(){
      const o={version:1, exporteLe:new Date().toISOString()};
      ['exercices','modeles','planifiees','journal','reglages'].forEach(c=>o[c]=this.lire(c,null));
      return JSON.stringify(o,null,2);
    }
  };
})();

/* ============================================================
   2. MODÈLE DE DONNÉES
   ============================================================ */
const GROUPES = {
  pectoraux:'Pectoraux', dos:'Dos', epaules:'Épaules', biceps:'Biceps', triceps:'Triceps',
  abdo:'Abdo/Gainage', fessiers:'Fessiers', quadriceps:'Quadriceps',
  ischios:'Ischio-jambiers', mollets:'Mollets', hanche:'Hanche'
};
/* Une séance n'a plus de type choisi : ses catégories se déduisent
   des exercices qu'elle contient. « Mixte » n'existe donc plus. */
const CATEGORIES = { echauffement:'Échauffement', course:'Course à pied', haut:'Haut', bas:'Bas', abdo:'Abdo/Gainage', etirement:'Étirement' };
const CAT_EXO = CATEGORIES;

const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

const FICHES_EXERCICES = {"echauffement-tapis-de-course": {"picto": "treadmill", "description": "Mise en route progressive destinée à augmenter la température corporelle et à préparer les articulations avant les exercices plus intenses.", "execution": "Commencez par une marche active, puis augmentez doucement l’allure. Gardez une foulée souple, le buste droit et les épaules relâchées.", "erreurs": "Démarrer trop vite, s’agripper aux poignées ou transformer l’échauffement en séance difficile."}, "course-a-pied-en-endurance": {"picto": "run-easy", "description": "Course continue facile, réalisée à une intensité permettant de parler par phrases et de conserver une respiration maîtrisée.", "execution": "Adoptez une allure régulière et confortable. Restez relâché, regardez loin devant et laissez la durée, plutôt que la vitesse, guider l’effort.", "erreurs": "Accélérer progressivement sans s’en rendre compte, courir crispé ou chercher une allure cible au détriment de l’aisance."}, "course-a-pied-allure-marathon": {"picto": "run-marathon", "description": "Travail à l’allure spécifique visée sur marathon, soutenue mais contrôlée, destiné à améliorer l’économie de course et la tenue d’allure.", "execution": "Stabilisez rapidement l’allure cible et conservez une foulée économique. Pour les blocs longs, entraînez également l’hydratation et le ravitaillement prévus en compétition.", "erreurs": "Partir plus vite que l’allure prévue, négliger l’échauffement ou prolonger le bloc lorsque la technique se dégrade nettement."}, "course-a-pied-allure-semi-marathon": {"picto": "run-half", "description": "Course à une intensité proche de l’allure semi-marathon, exigeante mais régulière, généralement organisée en blocs séparés par une récupération courte.", "execution": "Après un échauffement complet, installez une allure stable. Gardez le haut du corps relâché et terminez le bloc avec une technique encore propre.", "erreurs": "Courir le premier bloc comme un 10 km, raccourcir excessivement les récupérations ou ignorer une dérive cardiaque inhabituelle."}, "course-a-pied-allure-10-km": {"picto": "run-10k", "description": "Travail spécifique à l’allure 10 km, proche du seuil haut, pour développer la capacité à maintenir une vitesse soutenue sans désorganisation technique.", "execution": "Réalisez un échauffement progressif, puis courez les répétitions à allure homogène. Conservez une cadence fluide et une respiration rythmée.", "erreurs": "Sprinter au départ, courir chaque répétition plus vite que la précédente ou finir avec une posture affaissée."}, "course-a-pied-allure-vma": {"picto": "run-vma", "description": "Intervalles rapides sollicitant fortement la puissance aérobie, alternés avec des récupérations suffisantes pour préserver la qualité des répétitions.", "execution": "Échauffez-vous soigneusement avec quelques accélérations. Courez vite mais relâché, à vitesse régulière, puis récupérez en trottinant ou en marchant selon le format.", "erreurs": "Partir au sprint, réduire la récupération au point de perdre la technique ou augmenter simultanément vitesse et volume."}, "course-a-pied-sprint": {"picto": "run-sprint", "description": "Effort très bref et quasi maximal visant la vitesse, la coordination et la capacité d’accélération, avec récupération presque complète.", "execution": "Après un échauffement long, accélérez progressivement sur les premiers appuis puis restez gainé et relâché. Arrêtez la répétition dès que la vitesse chute nettement.", "erreurs": "Sprinter à froid, se crisper, multiplier les répétitions fatiguées ou pratiquer sur un sol glissant."}, "pompes-serrees": {"picto": "pushup-narrow", "description": "Variante de pompe au poids du corps qui conserve le travail des pectoraux tout en augmentant la participation des triceps.", "execution": "Placez les mains sous les épaules ou légèrement plus serrées. Gardez le corps aligné, descendez en contrôlant avec les coudes proches du buste, puis repoussez le sol.", "erreurs": "Écarter les coudes, laisser tomber le bassin, avancer la tête ou raccourcir systématiquement l’amplitude.", "sourceLabel": "", "sourceUrl": ""}, "pompes-larges": {"picto": "pushup-wide", "description": "Pompe avec les mains plus écartées que les épaules, accentuant le travail des pectoraux tout en exigeant un gainage solide.", "execution": "Écartez les mains sans dépasser une position confortable pour les épaules. Descendez la poitrine entre les appuis, corps aligné, puis poussez sans verrouillage brutal.", "erreurs": "Choisir un écartement extrême, hausser les épaules, creuser les lombaires ou rebondir en bas du mouvement.", "sourceLabel": "", "sourceUrl": ""}, "dips": {"picto": "dips", "description": "Mouvement de poussée verticale au poids du corps sollicitant principalement les triceps et les pectoraux, avec une forte demande de stabilité scapulaire.", "execution": "Verrouillez les épaules vers le bas, descendez de façon contrôlée jusqu’à une amplitude confortable, puis repoussez les barres sans balancer les jambes.", "erreurs": "S’effondrer entre les épaules, descendre au-delà de sa mobilité, écarter excessivement les coudes ou donner un coup de jambes.", "sourceLabel": "", "sourceUrl": ""}, "traction-pronation-serree": {"picto": "pullup-pron-narrow", "description": "Traction paumes tournées vers l’avant, avec prise relativement serrée, mobilisant le dos et les bras sur une grande amplitude.", "execution": "Partez bras tendus et corps gainé. Abaissez d’abord les omoplates, puis tirez les coudes vers le bas jusqu’à approcher la poitrine de la barre; contrôlez la descente.", "erreurs": "Se balancer, tirer uniquement avec les bras, avancer le menton ou relâcher brutalement la phase descendante.", "sourceLabel": "", "sourceUrl": ""}, "traction-pronation-large": {"picto": "pullup-pron-wide", "description": "Traction en pronation avec une prise plus large que les épaules, orientée vers le travail du grand dorsal et de la ceinture scapulaire.", "execution": "Choisissez une largeur qui permet de garder les épaules confortables. Restez gainé, tirez la poitrine vers la barre et redescendez jusqu’aux bras tendus sans perdre le contrôle.", "erreurs": "Prise excessivement large, demi-amplitude, épaules remontées vers les oreilles ou balancement du bassin.", "sourceLabel": "", "sourceUrl": ""}, "traction-supination-serree": {"picto": "pullup-sup-narrow", "description": "Traction paumes tournées vers soi, prise serrée, qui associe le travail du dos à une participation importante des biceps.", "execution": "Suspendez-vous corps gainé, initiez le mouvement par les omoplates puis tirez les coudes vers les côtes. Montez sans casser les poignets et contrôlez le retour.", "erreurs": "Lancer les jambes, arrondir les épaules, casser les poignets ou transformer le mouvement en curl incomplet.", "sourceLabel": "", "sourceUrl": ""}, "traction-supination-large": {"picto": "pullup-sup-wide", "description": "Variante en supination avec prise élargie; elle reste un mouvement de dos et de bras mais demande davantage de mobilité aux épaules et aux poignets.", "execution": "N’utilisez qu’une largeur confortable. Gardez les abdominaux engagés, montez sans élan et redescendez lentement jusqu’à l’extension complète des bras.", "erreurs": "Forcer une largeur douloureuse, laisser les épaules partir vers l’avant, se balancer ou négliger la descente.", "sourceLabel": "", "sourceUrl": ""}, "biceps": {"picto": "biceps-curl", "description": "Exercice de flexion du coude destiné au biceps brachial et au brachial, réalisé ici comme un curl avec haltères.", "execution": "Tenez-vous droit, coudes proches du corps. Fléchissez les avant-bras sans avancer les épaules, marquez la contraction puis redescendez lentement.", "erreurs": "Prendre de l’élan avec le dos, déplacer les coudes, casser les poignets ou laisser tomber la charge.", "sourceLabel": "", "sourceUrl": ""}, "triceps": {"picto": "triceps-overhead", "description": "Extension au-dessus de la tête qui isole le triceps, notamment sa longue portion placée en position étirée.", "execution": "Gardez le tronc gainé et les coudes orientés vers l’avant. Fléchissez les coudes pour descendre la charge derrière la tête, puis tendez les bras sans déplacer les épaules.", "erreurs": "Écarter les coudes, cambrer fortement, utiliser une charge incontrôlable ou verrouiller brutalement l’articulation.", "sourceLabel": "", "sourceUrl": ""}, "superman": {"picto": "superman", "description": "Extension au sol sollicitant la chaîne postérieure, notamment les muscles lombaires et les fessiers, en répétitions ou en maintien isométrique.", "execution": "Allongez-vous sur le ventre, bras tendus. Soulevez légèrement bras, poitrine et jambes en gardant la nuque neutre, puis revenez lentement au sol.", "erreurs": "Chercher une hauteur excessive, jeter la tête en arrière, retenir sa respiration ou créer un mouvement saccadé.", "sourceLabel": "", "sourceUrl": ""}, "squat": {"picto": "squat", "description": "Mouvement polyarticulaire de flexion des jambes sollicitant principalement les quadriceps et les fessiers, avec un important travail de stabilisation du tronc.", "execution": "Placez les pieds dans une position naturelle, inspirez et gainez. Descendez en fléchissant hanches et genoux, genoux dans l’axe des pieds, puis poussez le sol pour remonter.", "erreurs": "Genoux qui s’effondrent vers l’intérieur, talons qui décollent, dos qui s’arrondit ou profondeur imposée au-delà de sa mobilité.", "sourceLabel": "", "sourceUrl": ""}, "flexion-laterale": {"picto": "lateral-lunge", "description": "Interprétée ici comme une fente latérale: déplacement du bassin sur un côté pour travailler quadriceps, fessiers et adducteurs dans le plan frontal.", "execution": "Faites un grand pas latéral, poussez les hanches en arrière et fléchissez la jambe d’appui tandis que l’autre reste allongée. Revenez en poussant fermement dans le pied fléchi.", "erreurs": "Confondre avec une inclinaison du buste, laisser le genou rentrer vers l’intérieur, décoller le talon ou aller trop vite.", "sourceLabel": "", "sourceUrl": ""}, "mollets": {"picto": "calf-raise", "description": "Extension de cheville destinée aux mollets; genou tendu, le gastrocnémien est fortement sollicité, tandis qu’un genou fléchi accentue le soléaire.", "execution": "Placez l’avant-pied sur un support stable, laissez le talon descendre sous contrôle, marquez un court arrêt puis montez complètement sur la pointe.", "erreurs": "Rebondir sur le tendon d’Achille, travailler en demi-amplitude, tourner les chevilles ou accélérer la descente.", "sourceLabel": "", "sourceUrl": ""}, "abduction-hanche": {"picto": "hip-abduction", "description": "Éloignement de la jambe par rapport à l’axe du corps pour renforcer surtout le moyen fessier et les stabilisateurs latéraux de la hanche.", "execution": "Restez droit et stabilisez le bassin. Écartez la jambe sans tourner la pointe du pied vers le haut, marquez une courte pause puis revenez lentement.", "erreurs": "Incliner tout le buste, ouvrir le bassin, donner de l’élan ou rechercher une amplitude au détriment du contrôle.", "sourceLabel": "", "sourceUrl": ""}, "adduction-hanche": {"picto": "hip-adduction", "description": "Rapprochement de la jambe vers la ligne médiane pour solliciter les muscles adducteurs de la hanche.", "execution": "Stabilisez le tronc et le bassin, puis ramenez la jambe vers l’intérieur avec une amplitude confortable. Contrôlez le retour sans laisser la charge tirer la hanche.", "erreurs": "Tourner le bassin, fléchir excessivement le tronc, utiliser de l’élan ou forcer une amplitude douloureuse.", "sourceLabel": "", "sourceUrl": ""}, "pont": {"picto": "glute-bridge", "description": "Le pont fessier est une extension de hanche au sol qui renforce les fessiers, les ischio-jambiers et la stabilité du bassin.", "execution": "Allongez-vous, genoux fléchis et pieds à plat. Contractez les abdominaux et les fessiers, montez le bassin jusqu’à aligner épaules, hanches et genoux, puis redescendez contrôlé.", "erreurs": "Cambrer au lieu d’étendre les hanches, pousser uniquement sur les pointes, écarter les genoux ou rebondir au sol.", "sourceLabel": "", "sourceUrl": ""}, "crunch": {"picto": "crunch", "description": "Flexion courte du tronc au sol ciblant surtout le grand droit de l’abdomen, avec une participation du transverse.", "execution": "Gardez le bas du dos au contact du sol, expirez en rapprochant les côtes du bassin et soulevez seulement les omoplates. Revenez lentement sans relâcher totalement la sangle abdominale.", "erreurs": "Tirer sur la nuque, s’asseoir complètement, prendre de l’élan ou bloquer la respiration.", "sourceLabel": "", "sourceUrl": ""}, "abdominaux-chaise-romaine": {"picto": "roman-chair-leg-raise", "description": "Relevé de jambes sur chaise romaine sollicitant le grand droit de l’abdomen et les fléchisseurs de hanche, avec les épaules maintenues actives sur les appuis.", "execution": "Plaquez le dos au dossier, appuyez les avant-bras et abaissez les épaules. Montez les genoux fléchis vers 90° en enroulant légèrement le bassin, puis redescendez sans balancer.", "erreurs": "Se suspendre passivement aux épaules, donner de l’élan, creuser fortement les lombaires ou laisser tomber les jambes.", "sourceLabel": "", "sourceUrl": ""}, "gainage-horizontal": {"picto": "front-plank", "description": "Gainage frontal isométrique visant la stabilité globale du tronc, avec participation des abdominaux, des épaules, des fessiers et des muscles du dos.", "execution": "Placez les coudes sous les épaules et alignez tête, bassin et talons. Contractez abdominaux et fessiers tout en respirant régulièrement.", "erreurs": "Laisser le bassin tomber, monter les fesses, retenir sa respiration ou prolonger la série après la perte d’alignement.", "sourceLabel": "", "sourceUrl": ""}, "gainage-lateral": {"picto": "side-plank", "description": "Gainage sur le côté mettant l’accent sur les obliques et le transverse, tout en renforçant la stabilité latérale Arrondir fortement le dos, verrouiller douloureusement le genou, tirer sur le pied ou effectuer des rebonds."}, "etirement-chevilles": {"picto": "stretch-calf", "description": "Étirement du mollet et mobilisation de la cheville, utile pour travailler la flexion dorsale de façon progressive.", "execution": "Face à un mur, gardez le talon arrière au sol et avancez doucement le genou ou le bassin. Maintenez le pied dans l’axe sans écraser la voûte plantaire.", "erreurs": "Décoller le talon, laisser le genou s’effondrer vers l’intérieur, rebondir ou forcer sur une cheville douloureuse."}, "etirement-cou": {"picto": "stretch-neck", "description": "Mobilisation légère des muscles latéraux du cou et de la région supérieure de l’épaule.", "execution": "Asseyez-vous droit, abaissez une épaule et inclinez doucement la tête du côté opposé. La main peut seulement accompagner, sans tirer.", "erreurs": "Faire des rotations rapides, tirer fortement sur la tête, hausser l’épaule ou maintenir une position qui provoque vertiges ou fourmillements."}};

const _fabriqueExoBrut=(nom,cat,z1,z2,mode,extra)=>Object.assign({
    id:'exo-'+slug(nom), nom, categorie:cat, zone1:z1, zone2:z2||[], modeEffort:mode||'reps',
    ecartementCm:null, hauteurCm:null, lestageKg:null,   /* null = poids du corps */
    objSeries:6, objReps:mode==='temps'?30:10,
    repsInitiales:null,          /* point de départ ; null = on part de l'objectif */
    conseilProgression:'',       /* comment charger la fois suivante — texte libre */
    remarque:'',
    description:'', execution:'', erreurs:'', sourceLabel:'', sourceUrl:'', picto:''
  }, FICHES_EXERCICES[slug(nom)]||{}, extra||{},
     {conseilProgression: (extra&&extra.conseilProgression) || conseilParDefaut(cat,mode,extra||{})});
/* Les anciens paramètres d'évolution ne servent plus qu'à rédiger le
   conseil ci-dessus : on les retire de l'objet une fois celui-ci
   composé, pour ne pas traîner des champs sans emploi. */
const fabriqueExo=(nom,cat,z1,z2,mode,extra)=>{
  const o=_fabriqueExoBrut(nom,cat,z1,z2,mode,extra);
  ['evolPlus','evolLestageKg','evolEcartementCm','evolHauteurCm','evolToutesLesN',
   'compteurReussites'].forEach(k=>{ delete o[k]; });
  return o;
};

/* Le conseil livré avec chaque exercice. Il décrit une règle de
   surcharge concrète, chiffrée à partir des séries et répétitions
   visées — pas une intention générale. */
function conseilParDefaut(cat,mode,x){
  if(cat==='echauffement'||cat==='course') return '';
  if(cat==='etirement')
    return 'Tenir sans douleur. Allonger de 5 s par série quand la position devient facile.';
  const s=x.objSeries||3, r=x.objReps||10;
  if(x.evolLestageKg)
    return 'Ajoute '+String(x.evolLestageKg).replace('.',',')+' kg quand les '+s+' séries passent à '+
      r+' répétitions avec 1 à 2 en réserve. Sinon, reste à la même charge.';
  if(mode==='temps')
    return 'Ajoute 5 s par série quand les '+s+' séries tiennent '+r+' s proprement.';
  return 'Ajoute 1 répétition quand les '+s+' séries atteignent '+r+'. '+
    'Au-delà, augmente la difficulté (lestage, hauteur, levier) et repars plus bas.';
}

const blocSeance=(nom,series,reps,recup,recupFin,opts)=>Object.assign({

   distance de la séance de qualité du mardi.

   La pliométrie et le gainage vivent dans les séances Bas : les sauts
   se font sur des jambes fraîches, avant les charges lourdes, et le
   gainage anti-mouvement appartient au même complexe lombo-pelvien
   que les fessiers et les ischio-jambiers.

function modelesParDefaut(){ return modelesLafay().concat(modelesRenfo()); }

/* Les cinq routines génériques d'origine. Elles faisaient doublon
   avec les quinze séances des blocs 0 à 4 : retirées du catalogue,
   et retirées une fois des installations existantes. */
const ROUTINES_RETIREES = ['seance-routine-haut','seance-routine-bas',
  'seance-routine-abdo-gainage','seance-routine-etirements','seance-routine-complete',
  'seance-lafay-niv-ii','seance-lafay-niv-iii'];

const DB = {
  exercices:[], modeles:[], planifiees:[], journal:[], reglages:{},
  charger(){
    this.exercices = Store.lire('exercices',null);
    if(!Array.isArray(this.exercices)||!this.exercices.length){
      this.exercices = exercicesParDefaut(); Store.ecrire('exercices',this.exercices); }
    this.modeles = Store.lire('modeles',null);
    if(!Array.isArray(this.modeles)||!this.modeles.length){
      this.modeles = modelesParDefaut(); Store.ecrire('modeles',this.modeles); }
    this.migrerEchauffement();
    this.planifiees = Store.lire('planifiees',[])||[];
    this.journal = Store.lire('journal',[])||[];
    this.reglages = Object.assign({ voix:true, bips:true, ecranAllume:true,
      enchainementAuto:true, seancesParSemaine:2, semainesCarto:4,
      seuils:[600,300,180,120,60,30,15,10,5,4,3,2,1], dernierBip:3 }, Store.lire('reglages',{})||{});
    this.majCatalogueRenfo();
    this.retirerRoutines();
    this.refondreSeances();
    this.majSeancesRenfo();
    this.ajouterSeancesManquantes();
  },
  /* Les séances livrées après coup s'ajoutent sans rien réécrire :
     contrairement à majSeancesRenfo, on n'insère que ce qui manque,
     pour ne pas effacer une séance retouchée à la main. */
  ajouterSeancesManquantes(){
    let touche=false;
    modelesRenfo().forEach(ref=>{
      if(!this.modeles.some(m=>m.id===ref.id)){ this.modeles.push(ref); touche=true; }
    });
    /* Les deux mini séances sont livrées corrigées : la première
       version ne portait pas les rappels de l'autre moitié du corps.
       Réécriture unique, sur ces deux séances seulement. */
    if(!(this.reglages.minisCroisees>=2)){
      ['seance-mini-seance-haut','seance-mini-seance-bas'].forEach(id=>{ /* v2 : rappels croisés + bulgare */
        const ref=modelesRenfo().filter(m=>m.id===id)[0];
        const i=this.modeles.findIndex(m=>m.id===id);
        if(ref && i>=0){ this.modeles[i]=ref; touche=true; }
      });
      this.reglages.minisCroisees=2;
      Store.ecrire('reglages',this.reglages);
    }
    if(touche) Store.ecrire('modeles',this.modeles);
  },
  /* Le contenu des six séances a changé (combinaison haut/bas) mais
     leurs identifiants sont restés les mêmes : l'insertion ci-dessous
     ne les aurait donc jamais mises à jour. On réécrit leur contenu
     une fois, en laissant intacte toute séance créée à la main. */
  majSeancesRenfo(){
    if(this.reglages.seancesCombinees>=1) return;
    const refs=modelesRenfo();
    let touche=false;
    refs.forEach(ref=>{
      const i=this.modeles.findIndex(m=>m.id===ref.id);
      if(i<0){ this.modeles.push(ref); touche=true; }
      else { this.modeles[i]=ref; touche=true; }
    });
    if(touche) Store.ecrire('modeles',this.modeles);
    /* une séance en cours issue d'un ancien modèle n'a plus de sens */
    const enCours=Store.lire('seanceEnCours',null);
    if(enCours&&enCours.active&&refs.some(r=>r.id===enCours.active.modeleId))
      Store.effacer('seanceEnCours');
    this.reglages.seancesCombinees=1;
    Store.ecrire('reglages',this.reglages);
  },
  /* Passage des quinze séances « Bloc 0 à 4 » aux six séances des
     trois phases. Une seule fois. Les anciennes séances sont
     retirées, les planifications qui les visaient aussi ; le journal
     n'est pas touché, chaque entrée portant son propre nom. */
  refondreSeances(){
    if(this.reglages.refonteTroisPhases>=1) return;
    const ancienne=id=>/^seance-bloc-[0-4]-[abc]-/.test(id);
    this.modeles=this.modeles.filter(m=>!ancienne(m.id));
    this.planifiees=(this.planifiees||[]).filter(p=>!ancienne(p.modeleId||''));
    modelesRenfo().forEach(ref=>{
      if(!this.modeles.some(m=>m.id===ref.id)) this.modeles.push(ref);
    });
    const enCours=Store.lire('seanceEnCours',null);
    if(enCours&&enCours.active&&ancienne(enCours.active.modeleId||''))
      Store.effacer('seanceEnCours');
    Store.ecrire('modeles',this.modeles);
    Store.ecrire('planifiees',this.planifiees);
    this.reglages.refonteTroisPhases=1;
    Store.ecrire('reglages',this.reglages);
  },
  /* Retrait des cinq routines génériques, une seule fois. On enlève
     avec elles les planifications qui les visaient, et la séance en
     cours si elle en faisait partie. Le journal, lui, n'est pas
     touché : chaque entrée porte son propre nom de séance, donc
     l'historique reste lisible même sans le modèle d'origine. */
  retirerRoutines(){
    if(this.reglages.routinesRetirees>=2) return;
    const avant=this.modeles.length;
    this.modeles=this.modeles.filter(m=>ROUTINES_RETIREES.indexOf(m.id)<0);
    if(this.modeles.length!==avant){
      this.planifiees=this.planifiees.filter(p=>ROUTINES_RETIREES.indexOf(p.modeleId)<0);
      Store.ecrire('modeles',this.modeles);
      Store.ecrire('planifiees',this.planifiees);
    }
    const enCours=Store.lire('seanceEnCours',null);
    if(enCours&&enCours.active&&ROUTINES_RETIREES.indexOf(enCours.active.modeleId)>=0)
      Store.effacer('seanceEnCours');
    this.reglages.routinesRetirees=2;
    Store.ecrire('reglages',this.reglages);
  },
  /* Le catalogue de renforcement et les quinze séances des blocs 0 à 4
     sont arrivés après la première installation : une bibliothèque
     déjà remplie ne les aurait jamais vus, puisque les valeurs par
     défaut ne servent qu'au tout premier lancement.

     On les insère donc une fois, et une seule : un exercice ou une
     séance déjà présent est laissé intact, et un exercice supprimé
     volontairement — le crunch, par exemple — ne réapparaît pas au
     lancement suivant. */
  majCatalogueRenfo(){
    if(this.reglages.catalogueRenfo>=2) return;
    let touche=false;
    exercicesRenfo().forEach(ref=>{
      if(!this.exercice(ref.id)){ this.exercices.push(ref); touche=true; }
    });
    if(touche){ Store.ecrire('exercices',this.exercices); touche=false; }
    modelesRenfo().forEach(ref=>{
      if(!this.modeles.some(m=>m.id===ref.id)){ this.modeles.push(ref); touche=true; }
    });
    if(touche) Store.ecrire('modeles',this.modeles);
    this.reglages.catalogueRenfo=2;
    Store.ecrire('reglages',this.reglages);
  },
  /* Les séances créées avant que l'échauffement ne devienne un
     exercice portaient un champ echauffementMin. On le convertit en
     premier bloc, une fois pour toutes. */
  migrerEchauffement(){
    let touche=false;
    const refsExercices=exercicesParDefaut();
    this.exercices.forEach(e=>{
      /* Les anciens paramètres d'évolution disparaissent ; le conseil
         de progression prend leur place, repris du catalogue quand
         l'exercice y figure. */
      ['evolEcartementCm','evolHauteurCm','evolLestageKg','evolPlus',
       'evolToutesLesN','compteurReussites'].forEach(k=>{
        if(k in e){ delete e[k]; touche=true; }
      });
      const ref=refsExercices.find(r=>r.id===e.id);
      if(e.conseilProgression===undefined){
        e.conseilProgression = ref ? ref.conseilProgression : '';
        touche=true;
      }
      ['description','execution','erreurs','sourceLabel','sourceUrl','picto'].forEach(k=>{
        if(e[k]===undefined){ e[k]=ref&&ref[k]!=null?ref[k]:''; touche=true; }
      });
      if(e.lestageKg===0){ e.lestageKg=null; touche=true; }
    });
    if(touche){ Store.ecrire('exercices',this.exercices); touche=false; }
    this.modeles.forEach(m=>{
      (m.blocs||[]).forEach(b=>{
        ['ecartementCm','hauteurCm','lestageKg'].forEach(k=>{
          if(b[k]===undefined){ b[k]=null; touche=true; }
        });
      });
    });
    /* les six exercices de course ajoutés après coup */
    exercicesParDefaut().forEach(ref=>{
      if(ref.categorie==='course' && !this.exercice(ref.id)){
        this.exercices.push(ref); Store.ecrire('exercices',this.exercices);
      }
    });
    if(!this.exercice('exo-echauffement-tapis-de-course')){
      const ref=exercicesParDefaut()[0];
      this.exercices.unshift(ref); Store.ecrire('exercices',this.exercices);
    }
    this.modeles.forEach(m=>{
      if(m.echauffementMin>0 &&
         !(m.blocs||[]).some(b=>b.exerciceId==='exo-echauffement-tapis-de-course')){
        m.blocs=[{exerciceId:'exo-echauffement-tapis-de-course',nbSeries:1,
                  nbReps:m.echauffementMin*60,recupSerieSec:0,recupFinSec:60,
                  repsInitiales:null}].concat(m.blocs||[]);
        touche=true;
      }
      if(m.echauffementMin!==undefined){ delete m.echauffementMin; touche=true; }
      if(m.type!==undefined){ delete m.type; touche=true; }
    });
    if(touche) Store.ecrire('modeles',this.modeles);
  },
  /* Catégories réellement présentes dans une séance */
  categoriesModele(m){
    const vues=[];
    (m.blocs||[]).forEach(b=>{
      const e=this.exercice(b.exerciceId);
      if(e && vues.indexOf(e.categorie)<0) vues.push(e.categorie);
    });
    return vues.sort((a,b)=>Object.keys(CATEGORIES).indexOf(a)-Object.keys(CATEGORIES).indexOf(b));
  },
  categoriesRealisee(a){
    const vues=[];
    (a.series||[]).forEach(s=>{
      const e=this.exercice(s.exerciceId);
      if(e && vues.indexOf(e.categorie)<0) vues.push(e.categorie);
    });
    return vues;
  },
  sauver(cle){ Store.ecrire(cle,this[cle]); },
  exercice(id){ return this.exercices.find(e=>e.id===id)||null; },
  modele(id){ return this.modeles.find(m=>m.id===id)||null; },
  /* Réglage courant d'un bloc : la séance l'emporte sur l'exercice. */
  reglageBloc(exo,bloc,champ){
    if(bloc && bloc[champ]!=null) return bloc[champ];
    if(exo && exo[champ]!=null) return exo[champ];
    return null;
  },
  /* Valeur retenue au dernier passage sur cet exercice : on prend le
     maximum de la séance la plus récente qui le contient. Renvoie null
     si l'exercice n'a jamais été réalisé, ou jamais avec ce réglage. */
  maxPrecedent(exerciceId,champ){
    for(let i=this.journal.length-1;i>=0;i--){
      const s=(this.journal[i].series||[]).filter(x=>x.exerciceId===exerciceId);
      if(!s.length) continue;
      let m=null;
      s.forEach(x=>{ const v=x[champ]; if(v!=null && (m==null||v>m)) m=v; });
      return m;                 /* séance trouvée : on s'arrête là */
    }
    return null;
  },
  /* Meilleure valeur jamais enregistrée sur cet exercice, avec sa date. */
  recordDeTousTemps(exerciceId,champ){
    let m=null, quand=null;
    this.journal.forEach(a=>{
      (a.series||[]).forEach(s=>{
        if(s.exerciceId!==exerciceId) return;
        const v=s[champ];
        if(v!=null && (m==null||v>m)){ m=v; quand=a.debut; }
      });
    });
    return m==null?null:{val:m, date:quand};
  },
  /* Proposition de répétitions pour la prochaine série de ce bloc. */
  proposition(exo,bloc){
    return this.repsDepart(exo,bloc).val;
  },
  /* Répétitions de départ : le réglage de la séance l'emporte sur
     celui de l'exercice ; à défaut on part de l'objectif. */
  repsDepart(exo,bloc){
    if(bloc && bloc.repsInitiales!=null) return {val:bloc.repsInitiales, source:'seance'};
    if(exo && exo.repsInitiales!=null)   return {val:exo.repsInitiales, source:'exercice'};
    return {val:(bloc?bloc.nbReps:(exo?exo.objReps:0)), source:'objectif'};
  },
  /* Maximum encodé pour cet exercice lors de la DERNIÈRE réalisation
     de cette séance. C'est lui qui prime sur tout le reste. */
  dernierMax(modeleId,exerciceId){
    for(let i=DB.journal.length-1;i>=0;i--){
      const a=DB.journal[i];
      if(a.modeleId!==modeleId) continue;
      const vals=(a.series||[]).filter(s=>s.exerciceId===exerciceId).map(s=>s.repsRealisees);
      if(!vals.length) return null;      /* la séance existe mais sans cet exercice */
      return Math.max.apply(null,vals);
    }
    return null;
  },

  idLibre(prefixe,nom,liste){
    let base = prefixe+slug(nom), id=base, n=2;
    while(liste.some(x=>x.id===id)){ id = base+'-'+(n++); }
    return id;
  },
  modelesUtilisant(exoId){
    return this.modeles.filter(m=>(m.blocs||[]).some(b=>b.exerciceId===exoId));
  }
};

/* ============================================================
   3. VOIX ET SONS
   ============================================================ */
const Voix = {
  ok:false, voix:null, ctx:null,
  init(){
    if(!('speechSynthesis' in window)) return;
    const choisir = () => {
      const d = speechSynthesis.getVoices()||[];
      this.voix = d.find(v=>v.lang==='fr-FR' && /Thomas|Am[ée]lie|Audrey|Marie/i.test(v.name))
               || d.find(v=>v.lang==='fr-FR') || d.find(v=>(v.lang||'').startsWith('fr')) || null;
    };
    choisir(); speechSynthesis.onvoiceschanged = choisir;
  },
  debloquer(){
    if(this.ok) return;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ this.ctx=new AC(); this.ctx.resume(); } }catch(e){}
    try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
    this.ok=true;
  },
  dire(texte,couper){
    if(!DB.reglages.voix||!('speechSynthesis' in window)) return;
    try{
      if(couper) speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(texte);
      u.lang='fr-FR'; u.rate=1.05;
      if(this.voix) u.voice=this.voix;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  bip(freq,duree,gain){
    if(!DB.reglages.bips||!this.ctx) return;
    freq=freq||880; duree=duree||0.09; gain=gain||0.22;
    try{
      const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(gain,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+duree);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+duree+0.02);
    }catch(e){}
  },
  gong(){ this.bip(523,0.14); setTimeout(()=>this.bip(784,0.22,0.26),130); }
};
const Ecran = {
  verrou:null,
  prendre(){
    if(!DB.reglages.ecranAllume||!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(v=>this.verrou=v).catch(()=>{});
  },
  relacher(){ try{ this.verrou&&this.verrou.release(); }catch(e){} this.verrou=null; }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Seance.active&&!Ecran.verrou) Ecran.prendre();
});

/* ============================================================
   4. MOTEUR DE CHRONO
   ------------------------------------------------------------
   surTick ne redessine PLUS toute la vue : il met à jour les
   seuls nœuds du cadran. Reconstruire le HTML 60 fois par
   seconde détruisait les boutons sous le doigt, ce qui faisait
   avaler les taps — c'était la cause du bouton Pause inerte.
   ============================================================ */
function direDuree(sec){
  if(sec>=60 && sec%60===0){ const m=sec/60; return m===1?'une minute':m+' minutes'; }
  if(sec>10) return sec+' secondes';
  return String(sec);
}
const Chrono = {
  mode:'repos', debutMs:0, cibleSec:null, pauseMs:0, pauseDebut:0,
  boucle:null, annonces:new Set(), surFin:null,
  lancer(mode,cibleSec,cbs){
    this.arreter(); cbs=cbs||{};
    this.mode=mode; this.cibleSec=cibleSec; this.debutMs=Date.now();
    this.pauseMs=0; this.pauseDebut=0; this.annonces.clear(); this.surFin=cbs.surFin||null;
    this._tourner();
  },
  ecouleSec(){
    if(!this.debutMs) return 0;
    const fige=this.pauseDebut||Date.now();
    return (fige-this.debutMs-this.pauseMs)/1000;
  },
  restantSec(){ return this.cibleSec==null?null:Math.max(0,this.cibleSec-this.ecouleSec()); },
  basculerPause(){
    if(this.mode==='repos') return;
    if(this.pauseDebut){ this.pauseMs+=Date.now()-this.pauseDebut; this.pauseDebut=0; }
    else this.pauseDebut=Date.now();
  },
  enPause(){ return !!this.pauseDebut; },
  actif(){ return this.mode!=='repos'; },
  arreter(){
    if(this.boucle) cancelAnimationFrame(this.boucle);
    this.boucle=null; this.mode='repos'; this.cibleSec=null;
    this.debutMs=0; this.pauseDebut=0; this.pauseMs=0;
  },
  _tourner(){
    const pas=()=>{
      if(this.mode==='repos') return;
      if(!this.enPause() && this.cibleSec!=null){
        const reste=this.restantSec();
        this._annoncer(Math.ceil(reste));
        if(reste<=0){ const fin=this.surFin; this.arreter(); if(fin) fin(); return; }
      }
      rafraichirCadran();
      this.boucle=requestAnimationFrame(pas);
    };
    this.boucle=requestAnimationFrame(pas);
  },
  _annoncer(sec){
    if(sec<=0||this.annonces.has(sec)) return;
    if((DB.reglages.seuils||[]).indexOf(sec)===-1) return;
    this.annonces.add(sec);
    if(sec<=(DB.reglages.dernierBip||3)){ Voix.bip(sec===1?1320:880,0.1); Voix.dire(String(sec),true); }
    else Voix.dire(direDuree(sec),true);
  }
};
/* « 10 min 30 s », « 45 s » — lecture naturelle d'une durée */
function dureeLisible(sec){
  sec=Math.max(0,Math.round(sec||0));
  const m=Math.floor(sec/60), s=sec%60;
  if(!m) return s+' s';
  return m+' min'+(s?' '+String(s).padStart(2,'0')+' s':'');
}
const mmss = s => { s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };

  [/etirement.*(cheville|mollet)/,'stretch-calf'], [/etirement.*cou/,'stretch-neck'],
  [/etirement/,'stretch-shoulder']
];
function clePicto(exo){
  if(!exo) return 'squat';
  if(exo.picto && PICTOS[exo.picto]) return exo.picto;
  if(exo.id && PICTO_EXACT[exo.id]) return PICTO_EXACT[exo.id];
  const n=slug(exo.nom||'');
  for(let i=0;i<MOTS_PICTO.length;i++) if(MOTS_PICTO[i][0].test(n)) return MOTS_PICTO[i][1];
  return {haut:'biceps-curl',bas:'squat',abdo:'crunch',etirement:'stretch-shoulder',
          echauffement:'treadmill',course:'run-easy'}[exo.categorie]||'squat';
}
function pictoVectoriel(exo,taille){
  const k=clePicto(exo);
  return '<span class="picto'+(taille?' '+taille:'')+'" aria-hidden="true">'+
    '<svg viewBox="0 0 100 100">'+PICTOS[k]+'</svg></span>';
}
function picto(exo,taille){
  const ref = exo && taille!=='guide' ? GUIDE_IMAGES[exo.id] : null;
  if(!ref) return pictoVectoriel(exo,taille);
  return '<span class="picto photo'+(taille?' '+taille:'')+'" data-exo="'+esc(exo.id)+'" aria-hidden="true">'+
    '<img loading="lazy" decoding="async" onerror="vignetteRepli(this)" alt="" src="'+esc(ref.phase2)+'">'+
    '</span>';
}
/* Vignette cliquable : même dessin, mais elle ouvre la fiche.
   La pastille orange en bas à droite signale qu'il y a quelque chose
   à toucher — sans quoi rien ne distingue une image décorative d'une
   image active. */
function pictoLien(exo,taille,animee){
  if(!exo) return picto(exo,taille);
  const ref = GUIDE_IMAGES[exo.id];
  const cls = 'picto'+(ref?' photo':'')+(ref&&animee?' anim':'')+(taille?' '+taille:'');
  const dedans = ref
    ? (animee
        ? '<img class="phase-1" loading="lazy" decoding="async" onerror="vignetteRepli(this)" alt="" src="'+esc(ref.phase1)+'">'+
          '<img class="phase-2" loading="lazy" decoding="async" onerror="vignetteRepli(this)" alt="" src="'+esc(ref.phase2)+'">'
        : '<img loading="lazy" decoding="async" onerror="vignetteRepli(this)" alt="" src="'+esc(ref.phase2)+'">')
    : '<svg viewBox="0 0 100 100" aria-hidden="true">'+PICTOS[clePicto(exo)]+'</svg>';
  return '<button type="button" class="'+cls+'" data-fiche="'+esc(exo.id)+'" data-exo="'+esc(exo.id)+'"'+
    ' aria-label="Voir la fiche : '+esc(exo.nom)+'">'+dedans+'</button>';
}

/* Même principe que pour le guide : une vignette introuvable retombe
   sur le dessin vectoriel plutôt que d'afficher un cadre cassé. */
function vignetteRepli(img){
  const boite=img&&img.parentNode;
  const exo=boite&&boite.dataset?DB.exercice(boite.dataset.exo||''):null;
  if(!boite||!exo) return;
  boite.classList.remove('photo');
  boite.innerHTML='<svg viewBox="0 0 100 100">'+PICTOS[clePicto(exo)]+'</svg>';
}

function phrasesTexte(txt,max){
  return String(txt||'').replace(/\s+/g,' ').split(/(?:\.\s+|;\s+|\n+)/)
    .map(s=>s.trim()).filter(Boolean).map(s=>s.replace(/[. ]+$/,'')).slice(0,max||99);
}
function listeTexteHTML(txt,max){
  const it=phrasesTexte(txt,max);
  if(!it.length) return '';
  return '<ul>'+it.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
}

  const m=DB.modele(repartModale);

  (m.blocs||[]).forEach(b=>{

    total+=b.nbSeries;
    if(e.categorie==='echauffement'||e.categorie==='etirement'||e.categorie==='course') return;
    travail+=b.nbSeries;
    (e.zone1||[]).forEach(g=>{ compte[g]=(compte[g]||0)+b.nbSeries; });
    (e.zone2||[]).forEach(g=>{ compte[g]=(compte[g]||0)+b.nbSeries*0.5; });
  });
  const lignes=Object.keys(GROUPES)
    .map(g=>({g, v:compte[g]||0, pct:travail?Math.round((compte[g]||0)/travail*100):0}))
    .sort((a,b)=>b.v-a.v);
  const maxi=Math.max(1,...lignes.map(x=>x.v));
  const tableau=lignes.map(x=>
    '<div class="l"><div class="nm">'+GROUPES[x.g]+

      '<span class="src">'+nbCourt(x.v)+' série'+(x.v>=2?'s':'')+' pondérée'+(x.v>=2?'s':'')+

    const e=DB.exercice(b.exerciceId); if(!e) return '';

    '<div class="modale-feuille">'+
      '<div class="modale-tete">'+
        '<div style="flex:1;min-width:0"><h2 class="exo-nom">'+esc(m.nom)+'</h2>'+
        '<p class="exo-meta">'+total+' séries \u00B7 '+travail+' de travail \u00B7 '+
        f.prep+'\u2009% préparation, '+f.haut+'\u2009% haut, '+f.bas+'\u2009% bas</p></div>'+
        '<button class="rond" data-act="fermer-repart" aria-label="Fermer">\u00D7</button>'+
      '</div>'+

/* Renvoie les régimes pertinents pour cet exercice.
   Colonnes : régime, effort, récup entre séries, récup fin d'exercice,
   RPE, et la raison d'être du régime. */
function conseilsExercice(exo){
  if(!exo) return [];
  if(exo.categorie==='etirement') return [
    ['Mobilité','2-3 × 20-40 s','15-30 s','30 s','3-4','Mise en tension tenue, jamais douloureuse. Respirer lentement.']
  ];
  if(exo.categorie==='echauffement') return [
    ['Échauffement','5-10 min progressifs','—','60 s','3-5','Monter en température sans entamer la séance qui suit.']
  ];
  if(PLIO.indexOf(exo.id)>=0) return [
    ['Puissance','3-5 × 5-10 contacts','2-3 min','3 min','7-8','Qualité absolue : contacts brefs. On arrête dès que le rythme se dégrade.'],
    ['Raideur / réactivité','3-4 × 15-25 contacts','90 s','2 min','6-7','Volume plus long, amplitude réduite, pour la tolérance du tendon.']
  ];
  if(exo.modeEffort==='temps') return [
    ['Force / tenue max','3-4 × 10-20 s','2 min','2 min','8-9','Position rendue difficile (levier, lestage) plutôt que tenue allongée.'],
    ['Endurance','3 × 45-90 s','45-60 s','90 s','7-8','Le format habituel du gainage : tenir propre, arrêter avant que la posture cède.']
  ];
  return [
    ['Force maximale','4-5 × 3-5','3-5 min','3 min','8-9 · 1-2 rép. en réserve','Le seul régime documenté sur l’économie de course. Intention explosive même quand la barre monte lentement.'],
    ['Vitesse / puissance','4 × 4-6','2-3 min','2 min','6-7 · charge légère','30 à 60 % de la charge maximale, déplacée le plus vite possible. La vitesse prime sur la charge.'],
    ['Hypertrophie','3-4 × 8-12','60-90 s','2 min','8 · 1-2 rép. en réserve','Zone de prise de volume. À doser si le poids de corps compte pour la performance.'],
    ['Endurance musculaire','3-4 × 15-25','30-60 s','90 s','7-8','Format dense, proche de la méthode au poids du corps. Peu de transfert pour un coureur : la course le produit déjà.']
  ];
}

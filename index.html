<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F94E00">
<meta name="color-scheme" content="light only">
<title>RHABDO</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icone-180.png">
<meta name="apple-mobile-web-app-title" content="Rhabdo">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RHABDO — jetons de conception
   Fond clair, cartes blanches, une seule couleur de signal
   orange. Bascule automatique en sombre la nuit : une app de
   salle ne doit pas éblouir.
   ============================================================ */
:root{
  --fond:#F4F5F7; --surface:#FFFFFF; --surface-2:#EDEFF3; --filet:#E1E5EA;
  --texte:#14171C; --texte-2:#5F6A7B; --texte-3:#9AA3B2;
  --accent:#F94E00; --accent-doux:#FFEDE4;
  --effort:#F94E00; --recup:#00A08C; --chauffe:#F2A104; --planifie:#4C63D6;
  --haut:#4C63D6; --bas:#E07B00; --abdo:#00A08C; --mixte:#8B4FD6; --etirement:#0088A8;
  --ombre:0 1px 2px rgba(20,23,28,.06), 0 4px 14px rgba(20,23,28,.05);
  --corps:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-s:10px; --r-m:16px; --r-l:22px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--fond);color-scheme:light;color:var(--texte);font-family:var(--corps);font-size:16px;
  line-height:1.45;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--texte);background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-s);padding:11px 12px;width:100%;appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-doux)}

#app{display:flex;flex-direction:column;height:100dvh}
#entete{flex:0 0 auto;padding:calc(var(--safe-t) + 12px) 16px 12px;display:flex;align-items:center;
  gap:12px;background:var(--surface);border-bottom:1px solid var(--filet)}
#entete .glyphe{width:36px;height:36px;flex:0 0 auto;border-radius:var(--r-s);background:var(--accent);
  color:#fff;display:grid;place-items:center;font-size:17px;font-weight:800}
#entete .titres{flex:1;min-width:0}
#entete .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);font-weight:600}
#entete h1{margin:0;font-weight:800;font-size:19px;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#entete .actions{display:flex;gap:6px}
#entete .actions button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);
  display:grid;place-items:center;font-size:15px}
#vue{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
#barre{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);
  border-top:1px solid var(--filet);padding-bottom:var(--safe-b)}
#barre button{padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--texte-3);transition:color .15s}
#barre button .ic{font-size:20px;line-height:1;filter:grayscale(1) opacity(.55)}
#barre button .lb{font-size:10px;font-weight:600;letter-spacing:.01em}
#barre button[aria-current="page"]{color:var(--accent)}
#barre button[aria-current="page"] .ic{filter:none}

.etiquette{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--texte-3);font-weight:600;margin:0 0 8px}
.carte{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  box-shadow:var(--ombre)}
.pastille{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;padding:4px 9px;border-radius:99px;background:var(--surface-2);color:var(--texte-2)}
.pastille.haut{color:var(--haut)} .pastille.bas{color:var(--bas)} .pastille.abdo{color:var(--abdo)}
.pastille.mixte{color:var(--mixte)} .pastille.etirement{color:var(--etirement)}
.bouton{display:block;width:100%;padding:16px;border-radius:99px;background:var(--surface-2);
  font-weight:700;font-size:16px;letter-spacing:-.01em;transition:transform .08s,filter .15s}
.bouton:active{transform:scale(.98)}
.bouton.principal{background:var(--accent);color:#fff;box-shadow:0 4px 14px rgba(249,78,0,.28)}
.bouton.effort{background:var(--effort);color:#fff}
.bouton.recup{background:var(--recup);color:#fff}
.bouton.chauffe{background:var(--chauffe);color:#231603}
.bouton.discret{background:transparent;border:1.5px solid var(--filet);color:var(--texte-2);
  font-weight:600;font-size:14.5px;padding:13px}
.bouton.danger{background:transparent;border:1.5px solid var(--effort);color:var(--effort);
  font-weight:600;font-size:14.5px;padding:13px}
.vide{text-align:center;padding:52px 20px;color:var(--texte-2)}
.vide .gros{font-size:38px;margin-bottom:12px}
.vide p{margin:0 0 4px}

/* --- séance en cours --- */
.fil{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;
  color:var(--texte-2);margin-bottom:7px}
.jauge{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:18px}
.jauge i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.cadran{position:relative;width:min(72vw,264px);margin:0 auto 18px;aspect-ratio:1}
.cadran svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.cadran .piste{fill:none;stroke:var(--surface-2);stroke-width:9}
.cadran .arc{fill:none;stroke:var(--texte-3);stroke-width:9;stroke-linecap:round;
  stroke-dasharray:552.9;transition:stroke .3s}
.cadran.effort .arc{stroke:var(--effort)}
.cadran.recup .arc{stroke:var(--recup)}
.cadran.chauffe .arc{stroke:var(--chauffe)}
.cadran .noyau{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px}
.cadran .mode{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-3)}
.cadran.effort .mode{color:var(--effort)} .cadran.recup .mode{color:var(--recup)}
.cadran.chauffe .mode{color:var(--chauffe)}
.cadran .chiffres{font-family:var(--mono);font-weight:700;font-size:clamp(40px,14vw,58px);
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.cadran .sous{font-size:12px;color:var(--texte-3);font-weight:500}
@keyframes souffle{0%,100%{opacity:1}50%{opacity:.45}}
.cadran.alerte .chiffres{animation:souffle .5s ease-in-out infinite}
.exo-nom{font-weight:800;font-size:24px;letter-spacing:-.025em;margin:0 0 3px}
.exo-meta{font-size:13px;color:var(--texte-2);margin:0}
.compteur{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 4px}
.compteur button{width:58px;height:58px;border-radius:50%;background:var(--surface-2);font-size:26px;
  font-weight:600;display:grid;place-items:center}
.compteur button:active{background:var(--filet)}
.compteur .val{font-family:var(--mono);font-weight:700;font-size:54px;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.compteur .val.sous-objectif{color:var(--bas)} .compteur .val.sur-objectif{color:var(--recup)}
.rappel-obj{text-align:center;font-size:11.5px;color:var(--texte-3);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase;margin:0}
details.reglages{margin-top:12px;border:1px solid var(--filet);border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--ombre);overflow:hidden}
details.reglages summary{padding:14px 15px;font-size:13px;font-weight:600;color:var(--texte-2);
  list-style:none;display:flex;justify-content:space-between;align-items:center}
details.reglages summary::-webkit-details-marker{display:none}
details.reglages summary::after{content:"+";font-size:18px;color:var(--texte-3)}
details.reglages[open] summary::after{content:"\2013"}
.reglage{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--filet)}
.reglage .nom{flex:1;font-size:14px;color:var(--texte-2)}
.reglage .pas{display:flex;align-items:center;gap:8px}
.reglage .pas button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:17px;font-weight:600}
.reglage .pas .v{font-family:var(--mono);font-weight:600;font-size:15px;min-width:62px;text-align:center;
  font-variant-numeric:tabular-nums}
.suite{margin-top:12px;padding:13px 15px;border-radius:var(--r-m);background:var(--surface-2);
  color:var(--texte-2);font-size:13.5px}
.suite b{color:var(--texte);font-weight:700}
.zone-action{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.rangee{display:flex;gap:9px}
.rangee > *{flex:1}

/* --- listes et bibliothèque --- */
.item{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);padding:15px;
  margin-bottom:10px;box-shadow:var(--ombre)}
.item h3{margin:0 0 3px;font-weight:700;font-size:17px;letter-spacing:-.015em}
.item .quand{font-size:12.5px;color:var(--texte-2)}
.item .cmds{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.item .cmds button{padding:9px 14px;border-radius:99px;background:var(--surface-2);font-size:12.5px;
  font-weight:600;color:var(--texte-2)}
.item .cmds button.go{background:var(--accent);color:#fff}
.onglets{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:99px;margin-bottom:14px}
.onglets button{flex:1;padding:10px;border-radius:99px;font-size:14px;font-weight:600;color:var(--texte-2)}
.onglets button[aria-selected="true"]{background:var(--surface);color:var(--texte);box-shadow:var(--ombre)}
.filtres{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.filtres::-webkit-scrollbar{display:none}
.filtres button{flex:0 0 auto;padding:8px 14px;border-radius:99px;background:var(--surface);
  border:1px solid var(--filet);font-size:13px;font-weight:600;color:var(--texte-2);white-space:nowrap}
.filtres button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ligne{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);
  border:1px solid var(--filet);border-radius:var(--r-m);margin-bottom:8px;box-shadow:var(--ombre)}
.ligne .txt{flex:1;min-width:0}
.ligne .txt b{display:block;font-weight:600;font-size:15px;letter-spacing:-.01em}
.ligne .txt span{font-size:12px;color:var(--texte-2)}
.ligne .fleche{color:var(--texte-3);font-size:18px}
.ajout{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
  border-radius:var(--r-m);border:1.5px dashed var(--filet);color:var(--accent);font-weight:700;
  font-size:15px;margin-bottom:14px}

/* --- formulaires --- */
.champ{margin-bottom:14px}
.champ > label{display:block;font-size:12.5px;font-weight:600;color:var(--texte-2);margin-bottom:6px}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.puces{display:flex;flex-wrap:wrap;gap:7px}
.puces label{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:99px;
  background:var(--surface);border:1px solid var(--filet);font-size:13.5px;font-weight:500;cursor:pointer}
.puces input{display:none}
.puces input:checked + span{color:var(--accent);font-weight:700}
.puces label:has(input:checked){border-color:var(--accent);background:var(--accent-doux)}
.bloc-exo{background:var(--surface);border:1px solid var(--filet);border-radius:var(--r-m);
  padding:14px;margin-bottom:10px;box-shadow:var(--ombre)}
.bloc-exo .tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bloc-exo .tete b{flex:1;font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.bloc-exo .mini{display:flex;gap:5px}
.bloc-exo .mini button{width:32px;height:32px;border-radius:var(--r-s);background:var(--surface-2);
  font-size:13px;display:grid;place-items:center}
.aide{font-size:12px;color:var(--texte-3);margin:5px 0 0;line-height:1.4}
.barre-form{display:flex;gap:9px;margin-top:18px;position:sticky;bottom:0;
  padding:12px 0 4px;background:linear-gradient(to top,var(--fond) 70%,transparent)}
.barre-form > *{flex:1}

.rappel{position:fixed;left:16px;right:16px;bottom:calc(var(--safe-b) + 76px);background:var(--texte);
  color:var(--fond);border-radius:var(--r-m);padding:14px 16px;font-size:14px;font-weight:500;z-index:60;
  box-shadow:0 12px 32px rgba(0,0,0,.28);animation:monte .25s ease-out}
@keyframes monte{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#bandeau{display:none;padding:11px 16px;background:#FFF4E0;border-bottom:1px solid #F0D9A8;
  font-size:12.5px;color:#7A5200;line-height:1.35}

.panne{border:1.5px solid var(--effort);border-radius:var(--r-m);padding:16px;background:var(--accent-doux)}
.panne h2{margin:0 0 6px;font-size:17px;font-weight:800}
.panne pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;word-break:break-word;
  margin:8px 0 12px;max-height:150px;overflow:auto;color:var(--effort)}

/* --- ajouts lots 5 à 8 --- */
.cadran .serie{font-family:var(--mono);font-weight:700;font-size:clamp(20px,7vw,29px);
  color:var(--texte);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.saisie-rangee{display:flex;align-items:stretch;justify-content:center;gap:9px;margin:8px 0 4px}
.objectif-box{flex:0 0 auto;width:86px;border-radius:var(--r-m);background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px}
.objectif-box .lb{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--texte-3)}
.objectif-box .nb{font-family:var(--mono);font-weight:700;font-size:26px;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--texte-2)}
.saisie-rangee .rond{flex:0 0 auto;width:56px;border-radius:var(--r-m);background:var(--surface-2);
  font-size:26px;font-weight:600;display:grid;place-items:center}
.saisie-rangee .rond:active{background:var(--filet)}
.saisie-rangee .val{flex:1;min-width:0;border-radius:var(--r-m);background:var(--accent-doux);
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:40px;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;padding:10px 4px}
.saisie-rangee .val.sous-objectif{color:var(--bas)} .saisie-rangee .val.sur-objectif{color:var(--recup)}

.stat-grille{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;text-align:center}
.stat-grille .n{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:-.03em;line-height:1.1}
.stat-grille .l{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--texte-3);margin-top:3px}
.serie-active{display:flex;align-items:baseline;gap:10px}
.serie-active .gros{font-family:var(--mono);font-weight:700;font-size:46px;letter-spacing:-.04em;color:var(--accent)}
.serie-active .txt{font-size:13.5px;color:var(--texte-2);line-height:1.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .jn{text-align:center;font-size:10.5px;font-weight:700;color:var(--texte-3);padding-bottom:2px}
.cal .jour{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:2px;font-size:13px;font-weight:600;background:transparent;color:var(--texte)}
.cal .jour.hors{color:var(--texte-3);opacity:.4}
.cal .jour.auj{background:var(--accent-doux);color:var(--accent);font-weight:800}
.cal .jour .pt{width:7px;height:7px;border-radius:50%}
.cal .jour .pt.fait{background:var(--accent)} .cal .jour .pt.prev{border:2px solid var(--planifie)}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-nav b{font-size:15px;font-weight:700;text-transform:capitalize}
.cal-nav button{width:34px;height:34px;border-radius:50%;background:var(--surface-2);font-size:15px}
.graph{width:100%;height:auto;display:block;overflow:visible}
.graph .axe{stroke:var(--filet);stroke-width:1}
.graph .gril{stroke:var(--filet);stroke-width:.5;stroke-dasharray:2 3}
.graph .lb{font-size:9px;fill:var(--texte-3);font-family:var(--corps)}
.graph .pt{fill:var(--accent)}
.graph .courbe{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.graph .aire{fill:var(--accent);opacity:.1}
.bulles{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;align-items:center;margin:6px 0}
.bulle{aspect-ratio:1;display:grid;place-items:center}
.bulle i{display:block;border-radius:50%;background:var(--accent);color:#fff;font-style:normal;
  font-family:var(--mono);font-size:10px;font-weight:700;display:grid;place-items:center}
.bulle.vide i{background:var(--filet);width:5px;height:5px}
.semaine-lg{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
  color:var(--texte-2);margin-top:2px}
.pr{display:flex;align-items:center;gap:11px;padding:11px 0;border-top:1px solid var(--filet)}
.pr:first-of-type{border-top:none}
.pr .med{font-size:24px;width:34px;text-align:center}
.pr .co{flex:1;min-width:0}
.pr .co b{display:block;font-size:15px;font-weight:700}
.pr .co span{font-size:12px;color:var(--texte-2)}
.pr .v{font-family:var(--mono);font-weight:700;font-size:19px}
.delta{display:flex;justify-content:space-between;align-items:center;padding:9px 0;
  border-top:1px solid var(--filet);font-size:14px}
.delta:first-of-type{border-top:none}
.delta .n{font-family:var(--mono);font-weight:700;font-size:15px}
.delta .up{color:var(--recup)} .delta .down{color:var(--effort)} .delta .flat{color:var(--texte-3)}
.corps{display:flex;align-items:flex-start;gap:10px}
.vue-corps{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center}
.corps svg{width:100%;height:auto;display:block}
.corps .lg{display:block;text-align:center;font-size:11.5px;font-weight:700;color:var(--texte-3);margin-top:4px}
/* Teintes fixes et contrastées : un muscle au repos doit rester
   parfaitement lisible sur la carte blanche, même sans données. */
.corps .neutre{fill:#EFF1F5;stroke:#CFD5DE;stroke-width:1;stroke-linejoin:round}
.corps .mus{fill:#CFD6E0;stroke:#FFFFFF;stroke-width:1;stroke-linejoin:round;transition:fill .35s}
.corps .stri{fill:none;stroke:#FFFFFF;stroke-width:.8;opacity:.7;stroke-linecap:round}
.echelle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:11px;color:var(--texte-3)}
.echelle .bande{flex:1;height:9px;border-radius:99px;
  background:linear-gradient(90deg,var(--surface-2),#FFD9C4,#FF9A5E,var(--accent))}
.picto{flex:0 0 auto;width:46px;height:46px;border-radius:12px;background:var(--accent-doux);
  color:var(--accent);display:grid;place-items:center;overflow:hidden}
.picto svg{width:38px;height:38px;stroke:currentColor;fill:none;stroke-width:6.5;
  stroke-linecap:round;stroke-linejoin:round;display:block}
.picto svg .t{fill:currentColor;stroke:none}
.picto svg .sol{stroke-width:4;opacity:.35}

</div>
<script>
"use strict";

/* ============================================================
   0. FILET DE SÉCURITÉ
   ============================================================ */
let dernierePanne = null;
function noterPanne(err){
  dernierePanne = (err && err.message ? err.message : String(err)) + '\n' +
    (err && err.stack ? (err.stack.split('\n')[1] || '') : '');
  try{ rendre(); }catch(e){}
}
window.addEventListener('error', e => {
  dernierePanne = (e.message||'Erreur inconnue') + '\n' + (e.filename||'') + ':' + (e.lineno||'');
  try{ rendre(); }catch(_){}
});
window.addEventListener('unhandledrejection', e => {
  dernierePanne = 'Promesse rejetée : ' + (e.reason && e.reason.message ? e.reason.message : e.reason);
});

/* ============================================================
   1. STOCKAGE
   ============================================================ */
const Store = (() => {
  const P='rhabdo_v1_', memoire={};
  let dispo=true;
  try{ localStorage.setItem(P+'t','1'); localStorage.removeItem(P+'t'); }catch(e){ dispo=false; }
  return {
    get dispo(){ return dispo; },
    lire(cle,defaut){
      try{
        const brut = dispo ? localStorage.getItem(P+cle) : memoire[cle];
        return brut==null ? defaut : JSON.parse(brut);
      }catch(e){ return defaut; }
    },
    ecrire(cle,val){
      const brut=JSON.stringify(val);
      try{ dispo ? localStorage.setItem(P+cle,brut) : (memoire[cle]=brut); }catch(e){ memoire[cle]=brut; }
    },
    effacer(cle){ try{ dispo ? localStorage.removeItem(P+cle) : delete memoire[cle]; }catch(e){} },
    toutEffacer(){ ['exercices','modeles','planifiees','journal','reglages','seanceEnCours']
      .forEach(c=>this.effacer(c)); },
    exporter(){
      const o={version:1, exporteLe:new Date().toISOString()};
      ['exercices','modeles','planifiees','journal','reglages'].forEach(c=>o[c]=this.lire(c,null));
      return JSON.stringify(o,null,2);
    }
  };
})();

/* ============================================================
   2. MODÈLE DE DONNÉES
   ============================================================ */
const GROUPES = {
  pectoraux:'Pectoraux', dos:'Dos', epaules:'Épaules', biceps:'Biceps', triceps:'Triceps',
  abdo:'Abdo/Gainage', fessiers:'Fessiers', quadriceps:'Quadriceps',
  ischios:'Ischio-jambiers', mollets:'Mollets', hanche:'Hanche'
};
/* Une séance n'a plus de type choisi : ses catégories se déduisent
   des exercices qu'elle contient. « Mixte » n'existe donc plus. */
const CATEGORIES = { echauffement:'Échauffement', haut:'Haut', bas:'Bas', abdo:'Abdo/Gainage', etirement:'Étirement' };
const CAT_EXO = CATEGORIES;

const slug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function exercicesParDefaut(){
  const e=(nom,cat,z1,z2,mode,extra)=>Object.assign({
    id:'exo-'+slug(nom), nom, categorie:cat, zone1:z1, zone2:z2||[], modeEffort:mode||'reps',
    ecartementCm:null, hauteurCm:null, lestageKg:0, objSeries:6, objReps:mode==='temps'?30:10,
    repsInitiales:null,          /* point de départ ; null = on part de l'objectif */
    evolPlus:1, evolToutesLesN:3, compteurReussites:0, remarque:''
  }, extra||{});
  return [
    e('Échauffement tapis de course','echauffement',['quadriceps'],['mollets'],'temps',
      {objSeries:1,objReps:600,evolPlus:0,evolToutesLesN:1}),
    e('Pompes serrées','haut',['pectoraux'],['triceps'],'reps',{ecartementCm:30}),
    e('Pompes larges','haut',['pectoraux'],['abdo'],'reps',{ecartementCm:70}),
    e('Dips','haut',['triceps'],['pectoraux']),
    e('Traction pronation serrée','haut',['dos'],['biceps'],'reps',{ecartementCm:40}),
    e('Traction pronation large','haut',['dos'],['epaules'],'reps',{ecartementCm:80}),
    e('Traction supination serrée','haut',['biceps'],['dos'],'reps',{ecartementCm:30}),
    e('Traction supination large','haut',['dos'],['biceps'],'reps',{ecartementCm:60}),
    e('Biceps','haut',['biceps'],[]),
    e('Triceps','haut',['triceps'],['epaules']),
    e('Superman','haut',['dos'],['fessiers']),
    e('Squat','bas',['quadriceps'],['fessiers']),
    e('Flexion latérale','bas',['quadriceps'],[]),
    e('Mollets','bas',['mollets'],[]),
    e('Abduction hanche','bas',['hanche'],['fessiers']),
    e('Adduction hanche','bas',['hanche'],[]),
    e('Pont','bas',['fessiers'],['ischios']),
    e('Crunch','abdo',['abdo'],[]),
    e('Abdominaux chaise romaine','abdo',['abdo'],['dos']),
    e('Gainage horizontal','abdo',['abdo'],[],'temps',{objSeries:3,objReps:45,evolPlus:5}),
    e('Gainage latéral','abdo',['abdo'],[],'temps',{objSeries:4,objReps:30,evolPlus:5}),
    e('Étirement dos','etirement',['dos'],[],'temps',{objSeries:2,objReps:30,evolPlus:0}),
    e('Étirement épaule','etirement',['epaules'],[],'temps',{objSeries:2,objReps:30,evolPlus:0}),
    e('Étirement bras','etirement',['biceps'],[],'temps',{objSeries:2,objReps:30,evolPlus:0}),
    e('Étirement jambes','etirement',['ischios'],[],'temps',{objSeries:2,objReps:30,evolPlus:0}),
    e('Étirement chevilles','etirement',['mollets'],[],'temps',{objSeries:2,objReps:30,evolPlus:0}),
    e('Étirement cou','etirement',['epaules'],[],'temps',{objSeries:2,objReps:20,evolPlus:0})
  ];
}
function modelesParDefaut(){
  const b=(nom,series,reps,recup,recupFin)=>({
    exerciceId:'exo-'+slug(nom), nbSeries:series, nbReps:reps,
    recupSerieSec:recup, recupFinSec:recupFin==null?120:recupFin,
    repsInitiales:null,          /* null = hérite de l'exercice */
    evolPlus:null, evolToutesLesN:null
  });
  const chauffe=min=>({exerciceId:'exo-echauffement-tapis-de-course',nbSeries:1,nbReps:min*60,
    recupSerieSec:0,recupFinSec:60,repsInitiales:null,evolPlus:null,evolToutesLesN:null});
  const m=(nom,mn,blocs)=>({id:'seance-'+slug(nom),nom,
    blocs:(mn?[chauffe(mn)]:[]).concat(blocs)});
  return [
    m('Routine Haut',10,[ b('Pompes serrées',6,10,60), b('Traction pronation large',6,6,90),
      b('Dips',5,8,75), b('Biceps',4,10,60), b('Triceps',4,10,60) ]),
    m('Routine Bas',10,[ b('Squat',6,15,60), b('Pont',4,15,45),
      b('Abduction hanche',4,15,45), b('Mollets',4,20,45) ]),
    m('Routine Abdo/Gainage',5,[ b('Gainage horizontal',3,45,60), b('Gainage latéral',4,30,45),
      b('Crunch',4,20,45), b('Abdominaux chaise romaine',4,12,60) ]),
    m('Routine Étirements',0,[ b('Étirement dos',2,30,15,30), b('Étirement épaule',2,30,15,30),
      b('Étirement bras',2,30,15,30), b('Étirement jambes',2,30,15,30),
      b('Étirement chevilles',2,30,15,30), b('Étirement cou',2,20,15,30) ]),
    m('Routine complète',10,[ b('Pompes larges',5,12,60), b('Squat',5,15,60),
      b('Traction supination large',5,6,90), b('Gainage horizontal',3,45,45) ]),
    m('Lafay Niv II',10,[]),
    m('Lafay Niv III',10,[])
  ];
}

const DB = {
  exercices:[], modeles:[], planifiees:[], journal:[], reglages:{},
  charger(){
    this.exercices = Store.lire('exercices',null);
    if(!Array.isArray(this.exercices)||!this.exercices.length){
      this.exercices = exercicesParDefaut(); Store.ecrire('exercices',this.exercices); }
    this.modeles = Store.lire('modeles',null);
    if(!Array.isArray(this.modeles)||!this.modeles.length){
      this.modeles = modelesParDefaut(); Store.ecrire('modeles',this.modeles); }
    this.migrerEchauffement();
    this.planifiees = Store.lire('planifiees',[])||[];
    this.journal = Store.lire('journal',[])||[];
    this.reglages = Object.assign({ voix:true, bips:true, ecranAllume:true,
      enchainementAuto:true, seancesParSemaine:2, semainesCarto:4,
      seuils:[600,300,180,120,60,30,15,10,5,4,3,2,1], dernierBip:3 }, Store.lire('reglages',{})||{});
  },
  /* Les séances créées avant que l'échauffement ne devienne un
     exercice portaient un champ echauffementMin. On le convertit en
     premier bloc, une fois pour toutes. */
  migrerEchauffement(){
    let touche=false;
    if(!this.exercice('exo-echauffement-tapis-de-course')){
      const ref=exercicesParDefaut()[0];
      this.exercices.unshift(ref); Store.ecrire('exercices',this.exercices);
    }
    this.modeles.forEach(m=>{
      if(m.echauffementMin>0 &&
         !(m.blocs||[]).some(b=>b.exerciceId==='exo-echauffement-tapis-de-course')){
        m.blocs=[{exerciceId:'exo-echauffement-tapis-de-course',nbSeries:1,
                  nbReps:m.echauffementMin*60,recupSerieSec:0,recupFinSec:60,
                  repsInitiales:null,evolPlus:null,evolToutesLesN:null}].concat(m.blocs||[]);
        touche=true;
      }
      if(m.echauffementMin!==undefined){ delete m.echauffementMin; touche=true; }
      if(m.type!==undefined){ delete m.type; touche=true; }
    });
    if(touche) Store.ecrire('modeles',this.modeles);
  },
  /* Catégories réellement présentes dans une séance */
  categoriesModele(m){
    const vues=[];
    (m.blocs||[]).forEach(b=>{
      const e=this.exercice(b.exerciceId);
      if(e && vues.indexOf(e.categorie)<0) vues.push(e.categorie);
    });
    return vues.sort((a,b)=>Object.keys(CATEGORIES).indexOf(a)-Object.keys(CATEGORIES).indexOf(b));
  },
  categoriesRealisee(a){
    const vues=[];
    (a.series||[]).forEach(s=>{
      const e=this.exercice(s.exerciceId);
      if(e && vues.indexOf(e.categorie)<0) vues.push(e.categorie);
    });
    return vues;
  },
  sauver(cle){ Store.ecrire(cle,this[cle]); },
  exercice(id){ return this.exercices.find(e=>e.id===id)||null; },
  modele(id){ return this.modeles.find(m=>m.id===id)||null; },
  /* Répétitions de départ : le réglage de la séance l'emporte sur
     celui de l'exercice ; à défaut on part de l'objectif. */
  repsDepart(exo,bloc){
    if(bloc && bloc.repsInitiales!=null) return {val:bloc.repsInitiales, source:'seance'};
    if(exo && exo.repsInitiales!=null)   return {val:exo.repsInitiales, source:'exercice'};
    return {val:(bloc?bloc.nbReps:(exo?exo.objReps:0)), source:'objectif'};
  },
  /* Maximum encodé pour cet exercice lors de la DERNIÈRE réalisation
     de cette séance. C'est lui qui prime sur tout le reste. */
  dernierMax(modeleId,exerciceId){
    for(let i=DB.journal.length-1;i>=0;i--){
      const a=DB.journal[i];
      if(a.modeleId!==modeleId) continue;
      const vals=(a.series||[]).filter(s=>s.exerciceId===exerciceId).map(s=>s.repsRealisees);
      if(!vals.length) return null;      /* la séance existe mais sans cet exercice */
      return Math.max.apply(null,vals);
    }
    return null;
  },
  regleEvolution(exo,bloc){
    return {
      plus:(bloc&&bloc.evolPlus!=null)?bloc.evolPlus:(exo?exo.evolPlus:0),
      tous:(bloc&&bloc.evolToutesLesN!=null)?bloc.evolToutesLesN:(exo?exo.evolToutesLesN:0),
      herite:!(bloc&&bloc.evolPlus!=null)
    };
  },
  idLibre(prefixe,nom,liste){
    let base = prefixe+slug(nom), id=base, n=2;
    while(liste.some(x=>x.id===id)){ id = base+'-'+(n++); }
    return id;
  },
  modelesUtilisant(exoId){
    return this.modeles.filter(m=>(m.blocs||[]).some(b=>b.exerciceId===exoId));
  }
};

/* ============================================================
   3. VOIX ET SONS
   ============================================================ */
const Voix = {
  ok:false, voix:null, ctx:null,
  init(){
    if(!('speechSynthesis' in window)) return;
    const choisir = () => {
      const d = speechSynthesis.getVoices()||[];
      this.voix = d.find(v=>v.lang==='fr-FR' && /Thomas|Am[ée]lie|Audrey|Marie/i.test(v.name))
               || d.find(v=>v.lang==='fr-FR') || d.find(v=>(v.lang||'').startsWith('fr')) || null;
    };
    choisir(); speechSynthesis.onvoiceschanged = choisir;
  },
  debloquer(){
    if(this.ok) return;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC){ this.ctx=new AC(); this.ctx.resume(); } }catch(e){}
    try{ if('speechSynthesis' in window){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
    this.ok=true;
  },
  dire(texte,couper){
    if(!DB.reglages.voix||!('speechSynthesis' in window)) return;
    try{
      if(couper) speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(texte);
      u.lang='fr-FR'; u.rate=1.05;
      if(this.voix) u.voice=this.voix;
      speechSynthesis.speak(u);
    }catch(e){}
  },
  bip(freq,duree,gain){
    if(!DB.reglages.bips||!this.ctx) return;
    freq=freq||880; duree=duree||0.09; gain=gain||0.22;
    try{
      const t=this.ctx.currentTime,o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(gain,t+0.012);
      g.gain.exponentialRampToValueAtTime(0.0001,t+duree);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t+duree+0.02);
    }catch(e){}
  },
  gong(){ this.bip(523,0.14); setTimeout(()=>this.bip(784,0.22,0.26),130); }
};
const Ecran = {
  verrou:null,
  prendre(){
    if(!DB.reglages.ecranAllume||!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(v=>this.verrou=v).catch(()=>{});
  },
  relacher(){ try{ this.verrou&&this.verrou.release(); }catch(e){} this.verrou=null; }
};
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Seance.active&&!Ecran.verrou) Ecran.prendre();
});

/* ============================================================
   4. MOTEUR DE CHRONO
   ------------------------------------------------------------
   surTick ne redessine PLUS toute la vue : il met à jour les
   seuls nœuds du cadran. Reconstruire le HTML 60 fois par
   seconde détruisait les boutons sous le doigt, ce qui faisait
   avaler les taps — c'était la cause du bouton Pause inerte.
   ============================================================ */
function direDuree(sec){
  if(sec>=60 && sec%60===0){ const m=sec/60; return m===1?'une minute':m+' minutes'; }
  if(sec>10) return sec+' secondes';
  return String(sec);
}
const Chrono = {
  mode:'repos', debutMs:0, cibleSec:null, pauseMs:0, pauseDebut:0,
  boucle:null, annonces:new Set(), surFin:null,
  lancer(mode,cibleSec,cbs){
    this.arreter(); cbs=cbs||{};
    this.mode=mode; this.cibleSec=cibleSec; this.debutMs=Date.now();
    this.pauseMs=0; this.pauseDebut=0; this.annonces.clear(); this.surFin=cbs.surFin||null;
    this._tourner();
  },
  ecouleSec(){
    if(!this.debutMs) return 0;
    const fige=this.pauseDebut||Date.now();
    return (fige-this.debutMs-this.pauseMs)/1000;
  },
  restantSec(){ return this.cibleSec==null?null:Math.max(0,this.cibleSec-this.ecouleSec()); },
  basculerPause(){
    if(this.mode==='repos') return;
    if(this.pauseDebut){ this.pauseMs+=Date.now()-this.pauseDebut; this.pauseDebut=0; }
    else this.pauseDebut=Date.now();
  },
  enPause(){ return !!this.pauseDebut; },
  actif(){ return this.mode!=='repos'; },
  arreter(){
    if(this.boucle) cancelAnimationFrame(this.boucle);
    this.boucle=null; this.mode='repos'; this.cibleSec=null;
    this.debutMs=0; this.pauseDebut=0; this.pauseMs=0;
  },
  _tourner(){
    const pas=()=>{
      if(this.mode==='repos') return;
      if(!this.enPause() && this.cibleSec!=null){
        const reste=this.restantSec();
        this._annoncer(Math.ceil(reste));
        if(reste<=0){ const fin=this.surFin; this.arreter(); if(fin) fin(); return; }
      }
      rafraichirCadran();
      this.boucle=requestAnimationFrame(pas);
    };
    this.boucle=requestAnimationFrame(pas);
  },
  _annoncer(sec){
    if(sec<=0||this.annonces.has(sec)) return;
    if((DB.reglages.seuils||[]).indexOf(sec)===-1) return;
    this.annonces.add(sec);
    if(sec<=(DB.reglages.dernierBip||3)){ Voix.bip(sec===1?1320:880,0.1); Voix.dire(String(sec),true); }
    else Voix.dire(direDuree(sec),true);
  }
};
const mmss = s => { s=Math.max(0,Math.floor(s));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
/* ============================================================
   PICTOGRAMMES D'EXERCICES
   Dessins vectoriels embarqués : aucune requête réseau, aucune
   question de licence, et le même langage graphique que la
   cartographie musculaire.
   ============================================================ */

/* Association exercice -> pictogramme, par mot-clé du nom. */
const MOTS_PICTO=[
  [/echauffement|tapis|course/,'tapis'],
  [/pompes?\s*larges/,'pompes-larges'], [/pompes/,'pompes'],
  [/dips/,'dips'],
  [/traction.*supination/,'traction-sup'], [/traction/,'traction'],
  [/chaise\s*romaine/,'chaise-rom'],
  [/gainage.?lat/,'gainage-lat'], [/gainage/,'gainage'],
  [/crunch|abdomin/,'crunch'],
  [/superman/,'superman'],
  [/biceps/,'biceps'], [/triceps/,'triceps'],
  [/squat/,'squat'], [/flexion/,'flexion-lat'], [/mollets/,'mollets'],
  [/abduction/,'abduction'], [/adduction/,'adduction'], [/pont/,'pont'],
  [/etirement.*(jambe|cheville|mollet|ischio)/,'etirement-bs'],
  [/etirement/,'etirement-ht']
];
function clePicto(exo){
  if(!exo) return 'squat';
  if(exo.picto && PICTOS[exo.picto]) return exo.picto;
  const n=slug(exo.nom||'');
  for(let i=0;i<MOTS_PICTO.length;i++) if(MOTS_PICTO[i][0].test(n)) return MOTS_PICTO[i][1];
  /* repli par catégorie */
  return {haut:'biceps',bas:'squat',abdo:'crunch',etirement:'etirement-ht',echauffement:'tapis'}[exo.categorie]||'squat';
}
function picto(exo,taille){
  const k=clePicto(exo);
  return '<span class="picto'+(taille?' '+taille:'')+'" aria-hidden="true">'+
    '<svg viewBox="0 0 100 100">'+PICTOS[k]+'</svg></span>';
}

/* ============================================================
   5. SÉANCE EN COURS
   échauffement-prêt → échauffement → prêt → effort → saisie
   → récup → prêt … → terminé
   ============================================================ */
const Seance = {
  active:null, etat:'pret', iBloc:0, iSerie:1, repsSaisies:0, effortEcoule:0, progressions:[],

  demarrer(modele){
    const blocs=(modele.blocs||[]).filter(b=>DB.exercice(b.exerciceId));
    if(!blocs.length){ toast('Cette séance ne contient aucun exercice. Ajoute-lui des exercices depuis la bibliothèque.'); return; }
    this.active={
      id:uid(), modeleId:modele.id, nom:modele.nom,
      debut:new Date().toISOString(),
      blocs:blocs.map(b=>Object.assign({},b)), series:[]
    };
    this.iBloc=0; this.iSerie=1; this.progressions=[];
    /* Valeur proposée au compteur, par ordre de priorité :
       1. le maximum encodé à la dernière réalisation de CETTE séance
       2. les répétitions de départ (réglage séance, puis exercice)
       3. l'objectif de la série */
    this.active.blocs.forEach(b=>{
      const exo=DB.exercice(b.exerciceId);
      const max=DB.dernierMax(modele.id,b.exerciceId);
      b.derniereSaisie = (max!=null) ? max : DB.repsDepart(exo,b).val;
    });
    this._preparerSaisie(); Ecran.prendre(); ongletCourant='seance'; edition=null;
    this.etat='pret';
    this.persister(); rendre();
    if(true)
      Voix.dire(modele.nom+'. '+this._exo().nom+', série 1 sur '+this._bloc().nbSeries+'.');
  },

  reprendre(){
    const s=Store.lire('seanceEnCours',null);
    if(!s||!s.active||!Array.isArray(s.active.blocs)) return false;
    const blocs=s.active.blocs.filter(b=>DB.exercice(b.exerciceId));
    if(!blocs.length){ Store.effacer('seanceEnCours'); return false; }
    s.active.blocs=blocs;
    const iBloc=Math.min(Math.max(0,s.iBloc|0),blocs.length-1);
    const iSerie=Math.min(Math.max(1,s.iSerie|0),blocs[iBloc].nbSeries);
    this.active=s.active; this.iBloc=iBloc; this.iSerie=iSerie; this.progressions=[];
    /* on ne relance jamais un chrono tout seul au chargement */
    this.etat = (s.etat==='recup-termine') ? 'recup-termine' : 'pret';
    this._preparerSaisie();
    return true;
  },
  persister(){
    if(!this.active){ Store.effacer('seanceEnCours'); return; }
    Store.ecrire('seanceEnCours',{active:this.active,iBloc:this.iBloc,iSerie:this.iSerie,etat:this.etat});
  },

  _bloc(){ return this.active.blocs[this.iBloc]; },
  _exo(){ const b=this._bloc(); return b?DB.exercice(b.exerciceId):null; },
  _blocSuivant(){ return this.active.blocs[this.iBloc+1]||null; },
  _preparerSaisie(){
    const b=this._bloc(), exo=this._exo();
    if(!b||!exo) return;
    if(b.ecartementCm===undefined) b.ecartementCm=exo.ecartementCm;
    if(b.hauteurCm===undefined) b.hauteurCm=exo.hauteurCm;
    if(b.lestageKg===undefined) b.lestageKg=exo.lestageKg||0;
    /* la saisie de la série précédente devient la proposition par défaut */
    this.repsSaisies = (b.derniereSaisie!=null) ? b.derniereSaisie : b.nbReps;
  },

  demarrerSerie(){
    const exo=this._exo(), b=this._bloc();
    this.etat='effort'; this.persister();
    Voix.gong();
    Chrono.lancer('effort', exo.modeEffort==='temps'?b.nbReps:null, {
      surFin:()=>{ this.effortEcoule=b.nbReps; this._versSaisie(); }
    });
    rendre();
  },
  terminerSerie(){ this.effortEcoule=Chrono.ecouleSec(); Chrono.arreter(); this._versSaisie(); },
  _versSaisie(){
    const exo=this._exo();
    this.etat='saisie';
    const b0=this._bloc();
    this.repsSaisies = exo.modeEffort==='temps'
      ? Math.round(this.effortEcoule)
      : ((b0.derniereSaisie!=null) ? b0.derniereSaisie : b0.nbReps);
    this.persister(); Voix.dire('Série terminée.'); rendre();
  },
  validerSerie(){
    const b=this._bloc();
    this.active.series.push({
      exerciceId:b.exerciceId, indexBloc:this.iBloc, numeroSerie:this.iSerie,
      repsObjectif:b.nbReps, repsRealisees:this.repsSaisies,
      ecartementCm:b.ecartementCm, hauteurCm:b.hauteurCm, lestageKg:b.lestageKg,
      effortSec:Math.round(this.effortEcoule), recupSec:0, ts:new Date().toISOString()
    });
    b.derniereSaisie=this.repsSaisies;
    const derniereSerie=this.iSerie>=b.nbSeries, dernierBloc=!this._blocSuivant();
    if(derniereSerie&&dernierBloc){ this._terminer(); return; }
    const recup = derniereSerie ? (b.recupFinSec||b.recupSerieSec) : b.recupSerieSec;
    this.etat='recup'; this.persister();
    Voix.dire((derniereSerie?'Exercice terminé. ':'')+'Récupération, '+direDuree(recup)+'.');
    Chrono.lancer('recup',recup,{ surFin:()=>this.recupTerminee() });
    rendre();
  },

  /* ce que sera la prochaine série, sans encore y aller */
  prochaine(){
    const b=this._bloc();
    if(this.iSerie<b.nbSeries){
      const exo=this._exo();
      return {iBloc:this.iBloc, iSerie:this.iSerie+1, nbSeries:b.nbSeries,
              exo:exo, nbReps:b.nbReps, memeExercice:true};
    }
    const suiv=this._blocSuivant();
    if(!suiv) return null;
    return {iBloc:this.iBloc+1, iSerie:1, nbSeries:suiv.nbSeries,
            exo:DB.exercice(suiv.exerciceId), nbReps:suiv.nbReps, memeExercice:false};
  },

  /* Correction 2 : à la fin du décompte, la série suivante part
     seule. On annonce d'abord, puis on lance après un court délai
     pour que la voix ait le temps de commencer. */
  recupTerminee(){
    const der=this.active.series[this.active.series.length-1];
    if(der) der.recupSec=Math.round(Chrono.cibleSec||0);
    Chrono.arreter();
    const p=this.prochaine();
    if(!p){ this._terminer(); return; }
    Voix.dire('Récupération terminée. '+p.exo.nom+', série '+p.iSerie+' sur '+p.nbSeries+
      '. Objectif '+p.nbReps+' '+(p.exo.modeEffort==='temps'?'secondes':'répétitions')+'.');
    if(DB.reglages.enchainementAuto === false){
      this.etat='recup-termine'; this.persister(); Voix.gong(); rendre(); return;
    }
    this._avancer(); this.etat='pret'; this.persister(); rendre();
    const cible=this.active.series.length;
    setTimeout(()=>{
      if(Seance.active && Seance.etat==='pret' && Seance.active.series.length===cible)
        Seance.demarrerSerie();
    }, 1500);
  },

  _avancer(){
    const b=this._bloc();
    if(this.iSerie>=b.nbSeries){ this.iBloc++; this.iSerie=1; } else this.iSerie++;
    this._preparerSaisie(); this.persister();
  },
  /* depuis l'écran « récupération terminée » : on avance ET on lance */
  avancerEtDemarrer(){ this._avancer(); this.demarrerSerie(); },

  /* Abandonne les séries restantes de l'exercice courant et passe au
     suivant. Les séries déjà réalisées restent au journal. */
  passerExercice(){
    Chrono.arreter();
    if(!this._blocSuivant()){
      if(this.active.series.length) this._terminer();
      else { this.abandonner(); toast('Séance annulée.'); }
      return;
    }
    this.iBloc++; this.iSerie=1;
    this.etat='pret'; this._preparerSaisie(); this.persister();
    const exo=this._exo(), b=this._bloc();
    Voix.dire('Exercice suivant. '+exo.nom+', série 1 sur '+b.nbSeries+'.');
    rendre();
  },

  /* raccourci pendant la récup : on saute le reste du décompte */
  passerRecup(){
    const der=this.active.series[this.active.series.length-1];
    if(der) der.recupSec=Math.round(Chrono.ecouleSec());
    Chrono.arreter(); this._avancer();
    this.etat='pret'; this.persister();
    Voix.gong();
    const exo=this._exo(), nb=this._bloc();
    Voix.dire(exo.nom+', série '+this.iSerie+' sur '+nb.nbSeries+'.');
    rendre();
  },

  _appliquerEvolution(){
    const parExo={};
    this.active.series.forEach(s=>(parExo[s.exerciceId]=parExo[s.exerciceId]||[]).push(s));
    Object.keys(parExo).forEach(id=>{
      const exo=DB.exercice(id); if(!exo) return;
      const bloc=this.active.blocs.find(b=>b.exerciceId===id);
      const regle=DB.regleEvolution(exo,bloc);
      if(!regle.plus||!regle.tous) return;
      /* objectif atteint à CHAQUE série de cette séance : on progresse */
      const reussi=parExo[id].every(s=>s.repsRealisees>=s.repsObjectif);
      if(reussi){
        exo.objReps+=regle.plus;
        const modele=DB.modele(this.active.modeleId);
        if(modele){ const bm=(modele.blocs||[]).find(b=>b.exerciceId===id); if(bm) bm.nbReps+=regle.plus; }
        this.progressions.push(exo.nom+' : objectif porté à '+exo.objReps+(exo.modeEffort==='temps'?' s':' reps'));
      }
    });
    DB.sauver('exercices'); DB.sauver('modeles');
  },
  _terminer(){
    Chrono.arreter(); Ecran.relacher();
    const a=this.active;
    a.fin=new Date().toISOString();
    a.dureeSec=Math.round((new Date(a.fin)-new Date(a.debut))/1000);
    this._appliquerEvolution();
    DB.journal.push(a); DB.sauver('journal');
    const p=DB.planifiees.find(p=>p.modeleId===a.modeleId&&p.statut==='planifiee');
    if(p){ p.statut='realisee'; DB.sauver('planifiees'); }
    this.etat='termine'; Store.effacer('seanceEnCours');
    Voix.gong(); Voix.dire('Séance terminée. Bravo.'); rendre();
  },
  abandonner(){
    Chrono.arreter(); Ecran.relacher();
    this.active=null; this.etat='pret'; Store.effacer('seanceEnCours'); rendre();
  },
  ajusterReps(d){
    const exo=this._exo();
    this.repsSaisies=Math.max(0,this.repsSaisies+d*(exo.modeEffort==='temps'?5:1));
    /* le conteneur s'appelle .saisie-rangee depuis que l'objectif est
       passé à gauche ; si le nœud manque, on redessine plutôt que de
       laisser l'écran mentir sur la valeur réelle. */
    const n=document.querySelector('.saisie-rangee .val');
    if(!n){ rendre(); return; }
    n.textContent=this.repsSaisies;
    const o=this._bloc().nbReps;
    n.className='val'+(this.repsSaisies<o?' sous-objectif':this.repsSaisies>o?' sur-objectif':'');
  },
  ajusterReglage(champ,d,noeud){
    const b=this._bloc();
    b[champ]=Math.max(0,Math.round(((b[champ]==null?0:b[champ])+d)*10)/10);
    this.persister();
    if(noeud){ const v=noeud.parentNode.querySelector('.v');
      if(v) v.textContent=b[champ]+' '+(champ==='lestageKg'?'kg':'cm'); }
  },
  progression(){
    const total=this.active.blocs.reduce((n,b)=>n+b.nbSeries,0), faites=this.active.series.length;
    return {faites,total,pct: total?Math.round(faites/total*100):0};
  }
};

/* ------------------------------------------------------------
   Rafraîchissement ciblé du cadran : aucun innerHTML, donc
   aucun bouton détruit sous le doigt.
   ------------------------------------------------------------ */
function rafraichirCadran(){
  const cadran=document.getElementById('cadran');
  if(!cadran) return;
  const etat=etatCadran();
  cadran.className='cadran '+etat.cls;
  const c=cadran.querySelector('.chiffres'), s=cadran.querySelector('.sous'),
        m=cadran.querySelector('.mode'), a=cadran.querySelector('.arc');
  const se=cadran.querySelector('.serie');
  if(c && c.textContent!==String(etat.gros)) c.textContent=etat.gros;
  if(s && s.textContent!==etat.sous) s.textContent=etat.sous;
  if(m && m.textContent!==etat.mode) m.textContent=etat.mode;
  if(se && se.textContent!==etat.serie) se.textContent=etat.serie;
  if(a) a.style.strokeDashoffset=etat.arc;
}

/* source unique de vérité pour ce qu'affiche le cadran */
function etatCadran(){
  const C=552.9;
  if(!Seance.active) return {cls:'',mode:'',gros:'',sous:'',serie:'',arc:0};
  const b=Seance._bloc(), exo=Seance._exo();
  if(!b||!exo) return {cls:'',mode:'',gros:'',sous:'',serie:'',arc:0};
  const parTemps=exo.modeEffort==='temps';
  const serieEnCours='Série '+Seance.iSerie+'/'+b.nbSeries;

  if(Seance.etat==='recup-termine'){
    const p=Seance.prochaine();
    return {cls:'recup', mode:'Récupération terminée', gros:'00',
      sous: p ? (p.memeExercice?'même exercice':'exercice suivant') : 'fin de séance',
      serie: p ? 'Série '+p.iSerie+'/'+p.nbSeries : '', arc:C};
  }
  if(Seance.etat==='effort'){
    if(parTemps){
      const r=Chrono.restantSec()==null?b.nbReps:Chrono.restantSec();
      return {cls:'effort'+(r<=5?' alerte':''), mode:Chrono.enPause()?'Effort · en pause':'Effort',
        gros:Math.ceil(r), sous:'sur '+b.nbReps+' s', serie:serieEnCours, arc:C*(1-r/b.nbReps)};
    }
    return {cls:'effort', mode:Chrono.enPause()?'Effort · en pause':'Effort',
      gros:mmss(Chrono.ecouleSec()), sous:'objectif '+b.nbReps+' reps', serie:serieEnCours, arc:0};
  }
  if(Seance.etat==='recup'){
    const r=Chrono.restantSec()||0, cible=Chrono.cibleSec||1;
    return {cls:'recup'+(r<=5?' alerte':''), mode:Chrono.enPause()?'Récupération · en pause':'Récupération',
      gros:Math.ceil(r), sous:'sur '+cible+' s', serie:serieEnCours, arc:C*(1-r/cible)};
  }
  if(Seance.etat==='saisie')
    return {cls:'', mode:'Série terminée', gros:mmss(Seance.effortEcoule),
      sous:'temps sous tension', serie:serieEnCours, arc:0};
  return {cls:'', mode:'Prêt', gros:b.nbReps,
    sous:parTemps?'secondes à tenir':'répétitions visées', serie:serieEnCours, arc:0};
}

function rendre(){
  const enCours = ongletCourant==='seance' && Seance.active;
  const m = METAS[ongletCourant]||METAS.accueil;
  $('#glyphe').textContent = enCours?'\u{1F3CB}':m.glyphe;
  $('#eyebrow').textContent = enCours?'Entraînement':m.eyebrow;
  $('#titre').textContent = enCours?Seance.active.nom:m.titre;
  document.querySelectorAll('#barre button').forEach(b=>
    b.setAttribute('aria-current', b.dataset.onglet===ongletCourant?'page':'false'));
  const v=$('#vue');
  try{
    if(dernierePanne){ v.innerHTML=vuePanne(); return; }
    if(detailSeanceId){ v.innerHTML=vueDetailSeance(); return; }
    if(ecranParams){ v.innerHTML=vueParametres(); return; }
    if(vueSpecialeHisto){ v.innerHTML=vueHistorique(); return; }
    if(planif){ v.innerHTML=vuePlanificateur(); return; }
    if(ongletCourant==='seance') v.innerHTML = Seance.active?vueSeanceEnCours():vueListeSeances();
    else if(ongletCourant==='biblio') v.innerHTML = edition?vueEditeur():vueBiblio();
    else if(ongletCourant==='accueil'){ v.innerHTML = vueAccueil(); colorierCorps(); }
    else v.innerHTML = vuePlanif();
  }catch(err){ noterPanneSansBoucle(err); v.innerHTML=vuePanne(); }
}
function noterPanneSansBoucle(err){
  dernierePanne=(err&&err.message?err.message:String(err))+'\n'+(err&&err.stack?(err.stack.split('\n')[1]||''):'');
}
function vuePanne(){
  return '<div class="panne"><h2>Quelque chose a cassé</h2>'+
    '<p style="margin:0;font-size:13.5px">Voici le message exact, à me transmettre tel quel.</p>'+
    '<pre>'+esc(dernierePanne)+'\n\nonglet='+ongletCourant+

/* ============================================================
   VUE : SÉANCE EN COURS
   ============================================================ */
function vueSeanceEnCours(){
  if(Seance.etat==='termine') return vueBilan();
  const a=Seance.active;

  const b=Seance._bloc(), exo=Seance._exo();
  if(!b||!exo){ Seance.abandonner(); return vueListeSeances(); }
  const prog=Seance.progression(), parTemps=exo.modeEffort==='temps';
  const unite=parTemps?'s':'reps';

  /* Correction 5 : « Exercice suivant » désigne bien l'exercice
     suivant, jamais la prochaine série de l'exercice en cours. */
  const bs=Seance._blocSuivant();
  const exoSuivant = bs ? (DB.exercice(bs.exerciceId)||{nom:'?'}) : null;
  const restantes = b.nbSeries - Seance.iSerie;
  const ligneSuite = exoSuivant
    ? 'Exercice suivant : <b>'+esc(exoSuivant.nom)+'</b>'+
      (restantes>0 ? ' <span style="color:var(--texte-3)">— encore '+restantes+' série'+(restantes>1?'s':'')+' ici</span>' : '')
    : 'Dernier exercice de la séance'+
      (restantes>0 ? ' <span style="color:var(--texte-3)">— encore '+restantes+' série'+(restantes>1?'s':'')+'</span>' : ' <b>— dernière série</b>');

  let action='';
  if(Seance.etat==='pret'){
    action='<button class="bouton principal" data-act="demarrer">Démarrer la série '+Seance.iSerie+'</button>';
  } else if(Seance.etat==='recup-termine'){
    action='<button class="bouton principal" data-act="enchainer">Lancer la série suivante</button>';
  } else if(Seance.etat==='effort'){
    action='<div class="rangee">'+
      (parTemps?'<button class="bouton discret" data-act="pause">'+(Chrono.enPause()?'Reprendre':'Pause')+'</button>':'')+
      '<button class="bouton effort" data-act="finSerie">Série terminée</button></div>';
  } else if(Seance.etat==='saisie'){
    /* Correction 4 : l'objectif est un cadre à gauche du compteur,
       de même hauteur que les commandes. */
    const c=Seance.repsSaisies<b.nbReps?'sous-objectif':Seance.repsSaisies>b.nbReps?'sur-objectif':'';
    action='<div class="carte">'+

let ecranParams=false, detailSeanceId=null, moisAffiche=null, jourSelectionne=null;
let vueSpecialeHisto=false, filtreHisto='tous', limiteHisto=25;
let planif=null;   /* écran de planification : {modeleId,date,mode,jours,occurrences} */

const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const memeJour=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
function lundiDe(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function cleSemaine(d){ return lundiDe(d).toISOString().slice(0,10); }
function isoJour(d){ const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }

const PERIODES={'7j':7,'1m':30,'3m':91,'6m':183,'annee':null,'1an':365};
const LIB_PERIODES={'7j':'7 jours','1m':'1 mois','3m':'3 mois','6m':'6 mois','annee':'Année en cours','1an':'1 an'};
function debutPeriode(cle){
  const d=new Date();
  if(cle==='annee') return new Date(d.getFullYear(),0,1).getTime();
  const n=PERIODES[cle]||91;
  return d.getTime()-n*86400000;
}

/* ------------------------------------------------------------
   DEUX UNITÉS, JAMAIS MÉLANGÉES
   Les exercices en répétitions (pompes, squat…) se comptent en
   répétitions. Les exercices en temps (gainage, étirements) se
   comptent en secondes. Aucune conversion entre les deux : le
   ratio « 3 s = 1 rép. » était arbitraire, il a disparu.
   ------------------------------------------------------------ */
const UNITES={reps:{cle:'reps',lib:'Répétitions',court:'rép.',axe:'répétitions'},
              temps:{cle:'temps',lib:'Durée',court:'min',axe:'minutes'}};

function categorieSerie(s){ const e=DB.exercice(s.exerciceId); return e?e.categorie:'haut'; }
function uniteSerie(s){ const e=DB.exercice(s.exerciceId); return (e&&e.modeEffort==='temps')?'temps':'reps'; }
/* valeur d'une série dans SON unité : répétitions, ou secondes */
function valeurSerie(s){ return s.repsRealisees; }
/* la série compte-t-elle pour l'unité demandée ? */
function serieDansUnite(s,unite){ return uniteSerie(s)===unite; }

/* catégories proposées aux filtres, étirements compris */
const CATS_STAT=[['tous','Tout'],['haut','Haut du corps'],['abdo','Abdo/Gainage'],
                 ['bas','Bas du corps'],['etirement','Étirements']];
/* unité naturelle d'une catégorie : les étirements se lisent en durée */
function uniteNaturelle(cat){ return cat==='etirement'?'temps':'reps'; }

/* bilan d'une séance archivée, chaque unité de son côté */
function bilanSeance(a){
  let reps=0, sec=0, atteints=0;
  (a.series||[]).forEach(s=>{
    if(uniteSerie(s)==='temps') sec+=valeurSerie(s); else reps+=valeurSerie(s);
    if(s.repsRealisees>=s.repsObjectif) atteints++;
  });
  return {reps:Math.round(reps), sec:Math.round(sec), min:Math.round(sec/60),
          series:(a.series||[]).length, atteints, duree:a.dureeSec||0};
}
function resumeChiffre(b){
  const p=[];
  if(b.reps) p.push(b.reps+' rép.');
  if(b.min)  p.push(b.min+' min de tenue');
  if(!p.length) p.push(b.series+' séries');
  return p.join(' \u00B7 ');
}

function serieActivites(){
  const N=Math.max(1,DB.reglages.seancesParSemaine||2);
  const parSem={};
  DB.journal.forEach(a=>{ const k=cleSemaine(new Date(a.debut)); parSem[k]=(parSem[k]||0)+1; });
  let semaines=0,total=0;
  const cur=lundiDe(new Date());
  const cetteSemaine=parSem[cur.toISOString().slice(0,10)]||0;
  const d=new Date(cur);
  for(let i=0;i<520;i++){
    const k=d.toISOString().slice(0,10), n=parSem[k]||0;
    /* la semaine en cours n'est pas finie : elle ne casse pas la série */
    if(i===0 && n<N){ d.setDate(d.getDate()-7); continue; }
    if(n>=N){ semaines++; total+=n; d.setDate(d.getDate()-7); } else break;
  }
  return {semaines,total,objectif:N,cetteSemaine};
}

function seancesPeriode(cle,filtre,unite){
  const t0=debutPeriode(cle);
  return DB.journal.filter(a=>new Date(a.debut).getTime()>=t0)
    .map(a=>{
      const series=(a.series||[]).filter(x=>
        serieDansUnite(x,unite) && (filtre==='tous'||categorieSerie(x)===filtre));
      const brut=series.reduce((n,x)=>n+valeurSerie(x),0);
      return {date:new Date(a.debut), nom:a.nom, id:a.id, nb:series.length,
              val: unite==='temps' ? Math.round(brut/60) : Math.round(brut)};
    })
    .filter(x=>x.nb>0)
    .sort((a,b)=>a.date-b.date);
}

function meilleursEfforts(){
  const best={};
  DB.journal.forEach(a=>(a.series||[]).forEach(s=>{
    const c=categorieSerie(s), u=uniteSerie(s);
    const k=(u==='temps')?(c==='etirement'?'etirement':'gainage'):c;
    const v=Math.round(valeurSerie(s));
    if(!best[k]||v>best[k].v) best[k]={v,unite:u,exo:s.exerciceId,date:a.debut,seanceId:a.id};
  }));
  return best;
}

function deltaPeriode(cle,unite){
  const n=PERIODES[cle]||91;
  const fin=Date.now(), deb=cle==='annee'?debutPeriode('annee'):fin-n*86400000;
  const duree=fin-deb, debPrec=deb-duree;
  const cats = unite==='temps' ? ['abdo','etirement'] : ['haut','bas','abdo'];
  const somme=(t0,t1)=>{
    const r={}; cats.forEach(c=>r[c]=0);
    DB.journal.forEach(a=>{
      const t=new Date(a.debut).getTime();
      if(t<t0||t>=t1) return;
      (a.series||[]).forEach(s=>{
        if(!serieDansUnite(s,unite)) return;
        const c=categorieSerie(s);
        if(r[c]!=null) r[c]+=valeurSerie(s);
      });
    });
    return r;
  };
  const act=somme(deb,fin), prec=somme(debPrec,deb);
  const conv=v=>unite==='temps'?Math.round(v/60):Math.round(v);
  return cats.map(c=>{
    const a=conv(act[c]), p=conv(prec[c]);
    const pct = p>0 ? Math.round((a-p)/p*100) : (a>0?null:0);
    return {cat:c, actuel:a, precedent:p, delta:a-p, pct};
  });
}

function volumeParGroupe(semaines,unite){
  const t0=Date.now()-semaines*7*86400000, vol={};
  Object.keys(GROUPES).forEach(g=>vol[g]=0);
  DB.journal.forEach(a=>{
    if(new Date(a.debut).getTime()<t0) return;
    (a.series||[]).forEach(s=>{
      if(!serieDansUnite(s,unite)) return;
      const e=DB.exercice(s.exerciceId); if(!e) return;
      const v=valeurSerie(s);
      (e.zone1||[]).forEach(g=>{ if(vol[g]!=null) vol[g]+=v; });
      (e.zone2||[]).forEach(g=>{ if(vol[g]!=null) vol[g]+=v*0.5; });
    });
  });
  if(unite==='temps') Object.keys(vol).forEach(g=>vol[g]=vol[g]/60);
  return vol;
}

/* ============================================================
   Graphique : nuage + courbe, SVG à la main
   ============================================================ */
function graphCharge(pts,unite){
  if(pts.length<1) return '<div class="vide" style="padding:30px"><p>Pas encore de données sur cette période.</p></div>';
  const L=320,H=150,mg={g:34,d:8,h:12,b:22};
  const maxY=Math.max(unite==='temps'?5:10,...pts.map(p=>p.val));
  const t0=pts[0].date.getTime(), t1=pts[pts.length-1].date.getTime();
  const etendue=Math.max(1,t1-t0);
  const x=p=>mg.g+(L-mg.g-mg.d)*((p.date.getTime()-t0)/etendue);
  const y=v=>mg.h+(H-mg.h-mg.b)*(1-v/maxY);
  const chemin=pts.map((p,i)=>(i?'L':'M')+x(p).toFixed(1)+' '+y(p.val).toFixed(1)).join(' ');
  const aire=pts.length>1 ? chemin+' L'+x(pts[pts.length-1]).toFixed(1)+' '+(H-mg.b)+' L'+x(pts[0]).toFixed(1)+' '+(H-mg.b)+' Z' : '';
  const ticks=[0,Math.round(maxY/2),maxY];
  const grilles=ticks.map(v=>'<line class="gril" x1="'+mg.g+'" y1="'+y(v)+'" x2="'+(L-mg.d)+'" y2="'+y(v)+'"/>'+
    '<text class="lb" x="'+(mg.g-5)+'" y="'+(y(v)+3)+'" text-anchor="end">'+v+'</text>').join('');
  const dates=[pts[0],pts[pts.length-1]].filter((p,i,t)=>i===0||t[0]!==p).map((p,i)=>
    '<text class="lb" x="'+x(p)+'" y="'+(H-6)+'" text-anchor="'+(i?'end':'start')+'">'+
    p.date.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+'</text>').join('');
  return '<svg class="graph" viewBox="0 0 '+L+' '+H+'" role="img" aria-label="Charge d’entraînement">'+
    grilles+
    (aire?'<path class="aire" d="'+aire+'"/>':'')+
    (pts.length>1?'<path class="courbe" d="'+chemin+'"/>':'')+
    pts.map(p=>'<circle class="pt" cx="'+x(p).toFixed(1)+'" cy="'+y(p.val).toFixed(1)+'" r="3.5"/>').join('')+
    '<line class="axe" x1="'+mg.g+'" y1="'+(H-mg.b)+'" x2="'+(L-mg.d)+'" y2="'+(H-mg.b)+'"/>'+
    dates+'</svg>';
}

function journalBulles(){
  const auj=new Date();
  let html='<p class="etiquette" style="margin-top:22px">Journal d’entraînement</p>';
  const maxDuree=Math.max(1,...DB.journal.map(a=>a.dureeSec||0));
  for(let w=0;w<semainesJournal;w++){
    const lundi=lundiDe(auj); lundi.setDate(lundi.getDate()-7*w);
    const dim=new Date(lundi); dim.setDate(dim.getDate()+6);
    const tot={haut:0,bas:0,abdo:0}, tps={gainage:0,etirement:0};
    const cells=[];
    for(let i=0;i<7;i++){
      const d=new Date(lundi); d.setDate(lundi.getDate()+i);
      const faites=DB.journal.filter(a=>memeJour(new Date(a.debut),d));
      if(!faites.length){ cells.push('<div class="bulle vide"><i></i></div>'); continue; }
      const duree=faites.reduce((n,a)=>n+(a.dureeSec||0),0);
      faites.forEach(a=>(a.series||[]).forEach(s=>{
        const c=categorieSerie(s);
        if(uniteSerie(s)==='temps'){ tps[c==='etirement'?'etirement':'gainage']+=valeurSerie(s); }
        else if(tot[c]!=null) tot[c]+=valeurSerie(s);
      }));
      const taille=Math.round(16+22*Math.sqrt(duree/maxDuree));
      cells.push('<div class="bulle" data-detail="'+faites[0].id+'">'+
        '<i style="width:'+taille+'px;height:'+taille+'px">'+Math.round(duree/60)+'</i></div>');
    }
    html+='<div class="carte" style="margin-bottom:9px">'+
      '<div class="semaine-lg"><b style="color:var(--texte);font-size:13px">'+
      lundi.getDate()+' '+MOIS[lundi.getMonth()].slice(0,4)+'. \u2013 '+dim.getDate()+' '+MOIS[dim.getMonth()].slice(0,4)+'.</b></div>'+
      '<div class="bulles">'+cells.join('')+'</div>'+
      '<div class="semaine-lg" style="font-size:11.5px">'+
      '<span>Haut '+Math.round(tot.haut)+' rép.</span><span>Bas '+Math.round(tot.bas)+' rép.</span>'+
      '<span>Abdo '+Math.round(tot.abdo)+' rép.</span></div>'+
      ((tps.gainage||tps.etirement)?'<div class="semaine-lg" style="font-size:11.5px;color:var(--texte-3)">'+
        '<span>Gainage '+Math.round(tps.gainage/60)+' min</span>'+
        '<span>Étirements '+Math.round(tps.etirement/60)+' min</span></div>':'')+
      '</div>';
  }
  html+='<div class="rangee"><button class="bouton discret" data-act="plus-semaines">3 semaines de plus</button>'+
    '<button class="bouton discret" data-act="histo">Tout l\u2019historique</button></div>'+
    '<p class="aide" style="margin-top:6px;text-align:center">Taille de la bulle = durée de la séance. '+
    'Le chiffre est la durée en minutes.</p>';
  return html;
}

const MODES_PLANIF=[['unique','Une seule date'],['hebdo','Chaque semaine'],
                    ['mensuel','Chaque mois'],['trimestriel','Chaque trimestre']];
const JOURS_COURTS=['L','M','M','J','V','S','D'];

function ouvrirPlanificateur(modeleId, date){
  const d = date || jourSelectionne || new Date();
  planif={ modeleId:modeleId||'', date:isoJour(d), mode:'unique',
           jours:[(d.getDay()+6)%7], occurrences:8 };
  ecranParams=false; detailSeanceId=null; vueSpecialeHisto=false;
  ongletCourant='planif'; rendre();
}

/* Calcule les dates engendrées par le réglage courant. */
function datesPlanifiees(p){
  if(!p || !p.date) return [];
  const d0=new Date(p.date+'T09:00:00');
  if(isNaN(d0)) return [];
  if(p.mode==='unique') return [d0];
  const n=Math.max(1,Math.min(52,parseInt(p.occurrences,10)||8));
  const out=[];
  if(p.mode==='hebdo'){
    const jours=(p.jours&&p.jours.length?p.jours.slice():[(d0.getDay()+6)%7]).sort((a,b)=>a-b);
    const lundi=lundiDe(d0);
    const plancher=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate());
    for(let w=0; w<n && out.length<120; w++){
      jours.forEach(j=>{
        const d=new Date(lundi); d.setDate(lundi.getDate()+7*w+j); d.setHours(9,0,0,0);
        if(d>=plancher) out.push(d);
      });
    }
    return out;
  }
  const pas = p.mode==='mensuel' ? 1 : 3;
  for(let i=0;i<n;i++){
    const d=new Date(d0.getFullYear(), d0.getMonth()+pas*i, 1, 9, 0, 0);
    /* si le quantième n'existe pas dans le mois, on prend le dernier jour */
    const dernier=new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(d0.getDate(), dernier));
    out.push(d);
  }
  return out;
}

const TYPES_HISTO=[['tous','Toutes'],['haut','Haut'],['bas','Bas'],
                   ['abdo','Abdo/Gainage'],['etirement','Étirements']];

function vueHistorique(){
  const toutes=DB.journal.slice().sort((a,b)=>new Date(b.debut)-new Date(a.debut));
  const liste=toutes.filter(a=>filtreHisto==='tous'||DB.categoriesRealisee(a).indexOf(filtreHisto)>=0);
  const filtres='<div class="filtres">'+TYPES_HISTO.map(t=>
    '<button data-fhisto="'+t[0]+'" aria-pressed="'+(filtreHisto===t[0])+'">'+t[1]+'</button>').join('')+'</div>';

  if(!liste.length){
    return '<button class="retour" data-act="fermer-histo">\u2039 Retour</button>'+
      '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 12px">Historique</h2>'+
      filtres+'<div class="vide"><div class="gros">\u{1F4CB}</div>'+
      '<p>'+(toutes.length?'Aucune séance de ce type.':'Aucune séance enregistrée pour l’instant.')+'</p></div>';
  }

  /* regroupement par mois, avec le total du mois en tête */
  const groupes=[];
  liste.forEach(a=>{
    const d=new Date(a.debut), cle=d.getFullYear()+'-'+d.getMonth();
    let g=groupes.find(x=>x.cle===cle);
    if(!g){ g={cle, libelle:MOIS[d.getMonth()]+' '+d.getFullYear(), seances:[]}; groupes.push(g); }
    g.seances.push(a);
  });

  let restant=limiteHisto, corps='';
  for(const g of groupes){
    if(restant<=0) break;
    const tot=g.seances.reduce((t,a)=>{ const b=bilanSeance(a);
      return {n:t.n+1, duree:t.duree+b.duree, reps:t.reps+b.reps, min:t.min+b.min}; },
      {n:0,duree:0,reps:0,min:0});
    corps+='<div class="mois-tete"><b>'+g.libelle+'</b><span>'+tot.n+' séance'+(tot.n>1?'s':'')+
      ' \u00B7 '+mmss(tot.duree)+(tot.reps?' \u00B7 '+tot.reps+' rép.':'')+
      (tot.min?' \u00B7 '+tot.min+' min':'')+'</span></div>';
    for(const a of g.seances){
      if(restant--<=0) break;
      const b=bilanSeance(a), d=new Date(a.debut);
      const taux=b.series?Math.round(b.atteints/b.series*100):0;
      const coul=taux>=100?'var(--recup)':taux>=70?'var(--chauffe)':'var(--texte-3)';
      corps+='<div class="ligne" data-detail="'+a.id+'">'+
        '<div class="jour-puce"><b>'+d.getDate()+'</b><span>'+
        ['dim','lun','mar','mer','jeu','ven','sam'][d.getDay()]+'</span></div>'+
        '<div class="txt"><b>'+esc(a.nom)+'</b><span>'+mmss(b.duree)+' \u00B7 '+resumeChiffre(b)+'</span></div>'+
        '<span class="taux" style="color:'+coul+'">'+taux+'%</span>'+
        '<span class="fleche">\u203A</span></div>';
    }
  }
  const reste=liste.length-Math.min(limiteHisto,liste.length);
  return '<button class="retour" data-act="fermer-histo">\u2039 Retour</button>'+
    '<h2 style="font-weight:800;font-size:22px;letter-spacing:-.02em;margin:0 0 3px">Historique</h2>'+
    '<p style="color:var(--texte-2);margin:0 0 12px;font-size:13.5px">'+liste.length+' séance'+
    (liste.length>1?'s':'')+' enregistrée'+(liste.length>1?'s':'')+
    ' \u00B7 le pourcentage indique les objectifs atteints.</p>'+
    filtres+corps+
    (reste>0?'<button class="bouton discret" style="margin-top:10px" data-act="plus-histo">'+
      'Afficher '+Math.min(25,reste)+' séance'+(reste>1?'s':'')+' de plus</button>':'');
}

function grilleMois(base){
  const p=new Date(base.getFullYear(),base.getMonth(),1);
  const debut=new Date(p); debut.setDate(1-((p.getDay()+6)%7));
  const j=[];
  for(let i=0;i<42;i++){ const d=new Date(debut); d.setDate(debut.getDate()+i); j.push(d); }
  return j;
}
function activiteDuJour(d){
  return {
    faites:DB.journal.filter(a=>memeJour(new Date(a.debut),d)),
    prevues:DB.planifiees.filter(p=>p.statut==='planifiee'&&memeJour(new Date(p.date),d))
  };
}
function vuePlanif(){
  if(!moisAffiche) moisAffiche=new Date();
  const base=moisAffiche, auj=new Date();
  const cases=grilleMois(base).map(d=>{
    const a=activiteDuJour(d), hors=d.getMonth()!==base.getMonth();
    let pt='';
    if(a.faites.length) pt='<span class="pt fait"></span>';
    else if(a.prevues.length) pt='<span class="pt prev"></span>';
    return '<button class="jour'+(hors?' hors':'')+(memeJour(d,auj)?' auj':'')+
      (jourSelectionne&&memeJour(d,jourSelectionne)?' auj':'')+
      '" data-jour="'+isoJour(d)+'">'+d.getDate()+pt+'</button>';
  }).join('');
  const aVenir=DB.planifiees.filter(p=>p.statut==='planifiee').sort((a,b)=>new Date(a.date)-new Date(b.date));
  const liste=aVenir.length?aVenir.map(p=>{
    const m=DB.modele(p.modeleId), d=new Date(p.date), a0=new Date(); a0.setHours(0,0,0,0);
    return '<div class="item"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">'+
      '<div style="min-width:0"><h3>'+esc(p.nom||(m?m.nom:'Séance supprimée'))+'</h3>'+
      '<div class="quand"'+(d<a0?' style="color:var(--effort);font-weight:600"':'')+'>'+
      d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})+'</div></div>'+
      (m?'<span style="display:flex;flex-wrap:wrap;gap:4px">'+pastillesSeance(m)+'</span>':'')+'</div><div class="cmds">'+
      (m&&(m.blocs||[]).length?'<button class="go" data-go="'+m.id+'">Débuter</button>':'')+
      '<button data-decaler="'+p.id+'" data-n="1">+1 jour</button>'+
      '<button data-decaler="'+p.id+'" data-n="7">+1 sem.</button>'+
      '<button data-dupliquer-p="'+p.id+'">Dupliquer</button>'+

  }).join('')
   :'<div class="vide" style="padding:26px"><p>Rien de planifié.</p>'+
    '<p style="font-size:13.5px">Touche un jour, puis choisis une séance ci-dessous.</p></div>';
  return '<div class="carte"><div class="cal-nav">'+
    '<button data-mois="-1" aria-label="Mois précédent">\u2039</button>'+
    '<b>'+MOIS[base.getMonth()]+' '+base.getFullYear()+'</b>'+
    '<button data-mois="1" aria-label="Mois suivant">\u203A</button></div>'+
    '<div class="cal">'+['L','M','M','J','V','S','D'].map(j=>'<div class="jn">'+j+'</div>').join('')+cases+'</div>'+

    (jourSelectionne?panneauJour():'')+

/* ============================================================
   LOT 7 — CARTOGRAPHIE MUSCULAIRE
   Silhouette schématique face / dos. Chaque forme porte son
   groupe ; la teinte est proportionnelle au volume travaillé.
   ============================================================ */
function teinteVolume(part){
  if(part<=0) return '';                 /* gris de repos, défini en CSS */
  /* du gris de repos vers l'orange plein, en passant par le saumon */
  const p=Math.max(0.12,Math.min(1,Math.pow(part,0.7)));
  const r=Math.round(207+(249-207)*p), g=Math.round(214-(214-78)*p), b=Math.round(224-224*p);
  return 'rgb('+r+','+g+','+b+')';
}

/* Bloc de cartographie, intégré à l'écran Statistiques.
   Plus de sous-menu : la carte est visible d'emblée. */
function blocCartographie(){
  if(!UNITES[uniteCarto]) uniteCarto='reps';
  const sem=Math.max(1,DB.reglages.semainesCarto||4);
  const vol=volumeParGroupe(sem,uniteCarto);
  const max=Math.max(1,...Object.values(vol));
  const unite = uniteCarto==='temps' ? 'min' : 'rép.';
  const classement=Object.keys(GROUPES).map(g=>({g,v:Math.round(vol[g])})).sort((a,b)=>b.v-a.v);
  const travailles=classement.filter(x=>x.v>0);
  const oublies=classement.filter(x=>x.v===0);
  const bU=['reps','temps'].map(u=>
    '<button data-ucarto="'+u+'" aria-selected="'+(uniteCarto===u)+'">'+UNITES[u].lib+'</button>').join('');
  const bS=[2,4,8,12].map(n=>
    '<button data-carto="'+n+'" aria-pressed="'+(sem===n)+'">'+n+' sem.</button>').join('');
  const note = uniteCarto==='temps'
    ? 'Gainage et étirements uniquement, en minutes tenues.'
    : 'Exercices en répétitions uniquement. Gainage et étirements ont leur propre carte, en durée.';
  const detail = travailles.length
    ? '<details class="reglages" style="margin-top:12px"><summary>Détail par groupe</summary>'+
      travailles.map(x=>'<div class="reglage"><span class="nom">'+GROUPES[x.g]+'</span>'+
        '<span class="pas"><span class="v">'+x.v+' '+unite+'</span></span></div>').join('')+'</details>'
    : '';
  return '<p class="etiquette" style="margin-top:22px">Cartographie musculaire \u00B7 '+sem+' semaines</p>'+
    '<div class="onglets">'+bU+'</div>'+
    '<div class="filtres">'+bS+'</div>'+
    '<div class="carte"><div class="corps" id="corps">'+silhouetteFace()+silhouetteDos()+'</div>'+
    '<div class="echelle"><span>0</span><span class="bande"></span><span>'+Math.round(max)+' '+unite+'</span></div>'+
    '<p class="aide" style="margin-top:8px">Groupe prioritaire compté à 100 %, secondaire à 50 %. '+note+'</p></div>'+
    (oublies.length?'<div class="carte" style="margin-top:10px;border-color:var(--chauffe)">'+
      '<p class="etiquette" style="color:var(--chauffe)">Non sollicités sur la période</p>'+
      '<p style="margin:0;font-size:14px">'+oublies.map(x=>GROUPES[x.g]).join(', ')+'</p></div>':'')+
    detail;
}
/* colorisation, appelée juste après l'insertion dans le DOM */
function colorierCorps(){
  const c=document.getElementById('corps');
  if(!c) return;
  const vol=volumeParGroupe(Math.max(1,DB.reglages.semainesCarto||4),uniteCarto);
  const max=Math.max(1,...Object.values(vol));
  c.querySelectorAll('[data-g]').forEach(el=>{
    const v=vol[el.dataset.g]||0;
    /* volume nul : on laisse la teinte au repos définie en CSS,
       pour que « non travaillé » se distingue de « peu travaillé » */
    el.style.fill = v>0 ? teinteVolume(v/max) : '';
    el.setAttribute('aria-label',GROUPES[el.dataset.g]+' : '+Math.round(v));
  });
}
